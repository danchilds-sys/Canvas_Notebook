<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500&family=Encode+Sans+Semi+Condensed:wght@700;800;900&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Caveat:wght@500;600&family=Source+Serif+Pro:wght@400;600&family=Jost:wght@500;700&family=League+Spartan:wght@600;800&family=Barlow+Semi+Condensed:wght@600;800&family=Archivo:wght@500;800;900&family=Archivo+Black&family=Bricolage+Grotesque:wght@600;800&family=Sofia+Sans+Condensed:wght@600;800&family=Asap+Condensed:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --canvas-bg: #F5F0E3;
    --card-paper: #FBF8F0;
    --card-paper-rgb: 251, 248, 240;
    --ink-neutral: #3D332A;
    --ink-faint: #8A7D68;
    --doc-bg: #DCEAE3; --doc-ink: #1F4D3D; --doc-sub: #3D7A63; --doc-border: #7AADA0; --doc-divider: #A8C8BC;
    --fic-bg: #F2D9DC; --fic-ink: #6B1F2A; --fic-sub: #A14C5A; --fic-border: #C07A84; --fic-divider: #D4A4AC;
    --mus-bg: #F4DCC8; --mus-ink: #7A3B1A; --mus-sub: #B26A3C; --mus-border: #C09070; --mus-divider: #D4B090;
    --neu-bg: #DDD2BD; --neu-ink: #5A5042; --neu-sub: #8A7D68; --neu-border: #A09080; --neu-divider: #C0B4A4;
    --evt-bg: #F5F0E8; --evt-ink: #3D332A; --evt-sub: #8A7D68; --evt-border: #C8BCA8; --evt-divider: #D8D0C0;
    --games-bg: #F7E8C4; --games-ink: #8A5A0A; --games-sub: #B8842E; --games-border: #D9B168; --games-divider: #E8D19C;
    --paper-edge: rgba(61,51,42,0.28);
    --paper-shadow-s: 0 0 0 1px var(--paper-edge), 2px 3px 0 rgba(61,51,42,0.16);
    --paper-shadow-l: 0 0 0 1px var(--paper-edge), 4px 6px 0 rgba(61,51,42,0.16), 8px 14px 24px rgba(61,51,42,0.12);
    --card-body-border: #BEB8AE;
    --chord-ink: #A14C5A;
    /* Month colours — based on synaesthetic palette */
    --month-jan: #C8C8D0; --month-jan-ink: #3D332A;
    --month-feb: #8FA3B8; --month-feb-ink: #1A2A38;
    --month-mar: #C94040; --month-mar-ink: #FBF8F0;
    --month-apr: #5A9E4A; --month-apr-ink: #FBF8F0;
    --month-may: #A8405A; --month-may-ink: #FBF8F0;
    --month-jun: #D4793A; --month-jun-ink: #FBF8F0;
    --month-jul: #E8A830; --month-jul-ink: #3D332A;
    --month-aug: #D45830; --month-aug-ink: #FBF8F0;
    --month-sep: #9E4830; --month-sep-ink: #FBF8F0;
    --month-oct: #8A8A90; --month-oct-ink: #FBF8F0;
    --month-nov: #5C3D28; --month-nov-ink: #FBF8F0;
    --month-dec: #3A3A42; --month-dec-ink: #FBF8F0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--canvas-bg);
    font-family: "Public Sans", "Inter", sans-serif; color: var(--ink-neutral);
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  #wrap, #wrap * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #wrap input, #wrap textarea {
    -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }
  input, textarea { user-select: text; }
  #wrap { position: fixed; inset: 0; overflow: hidden; cursor: crosshair; background: #2A241D; }
  #canvas { position: absolute; top: 0; left: 0; width: 4000px; height: 3000px; transform-origin: 0 0; z-index: 1; }
  #board-rect {
    position: absolute; top: 0; left: 0; background: var(--canvas-bg);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.1), 0 10px 50px rgba(0,0,0,0.35);
    pointer-events: none;
  }
  #board-resize-handle {
    position: absolute; right: -7px; bottom: -7px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--card-paper); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.25);
    cursor: nwse-resize; display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); z-index: 2; pointer-events: auto;
  }
  #board-resize-handle svg { width: 9px; height: 9px; transform: rotate(45deg); }
  #connector-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #items-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #selection-box {
    position: absolute; border: 1px solid #4A90E2; background: rgba(74,144,226,0.12);
    pointer-events: none; display: none; border-radius: 2px;
  }

  #connector-popup {
    position: fixed; display: flex; align-items: center; gap: 8px;
    background: var(--card-paper); border-radius: 999px; padding: 8px 10px;
    box-shadow: var(--paper-shadow-s);
    z-index: 40; transform: translate(-50%, -130%);
  }
  #connector-popup.hidden { display: none; }
  .conn-color-swatch {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid transparent;
    cursor: pointer; padding: 0;
  }
  .conn-color-swatch.selected { border-color: var(--ink-neutral); }
  .conn-style-group { display: flex; align-items: center; gap: 2px; border-left: 0.5px solid var(--ink-faint); padding-left: 8px; margin-left: 2px; }
  .conn-style-btn {
    width: 22px; height: 22px; border-radius: 50%; border: none;
    background: transparent; color: var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .conn-style-btn svg { width: 18px; height: 6px; }
  .conn-style-btn:hover { background: rgba(61,51,42,0.08); }
  .conn-style-btn.selected { background: rgba(61,51,42,0.14); color: var(--ink-neutral); }
  .conn-arrow-btn {
    background: none; border: none; border-radius: 5px; padding: 4px 6px;
    cursor: pointer; color: var(--ink-faint); display: flex; align-items: center;
    transition: background 0.1s, color 0.1s;
  }
  .conn-arrow-btn svg { width: 30px; height: 10px; }
  .conn-arrow-btn:hover { background: rgba(61,51,42,0.08); color: var(--ink-neutral); }
  .conn-arrow-btn.selected { background: rgba(61,51,42,0.14); color: var(--ink-neutral); }
  .conn-bend-handle {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: white; border: 2px solid #8A7D68;
    cursor: grab; transform: translate(-50%, -50%);
    pointer-events: auto; z-index: 5;
    transition: background 0.1s, transform 0.1s;
  }
  .conn-bend-handle:hover { background: #8A7D68; transform: translate(-50%, -50%) scale(1.2); }
  #connector-delete {
    background: none; border: none; font-size: 12px; color: var(--ink-faint);
    cursor: pointer; padding: 0 0 0 8px; border-left: 0.5px solid var(--ink-faint);
  }
  #connector-delete:hover { color: var(--fic-ink); }

  #stack-menu {
    position: fixed; display: flex; flex-direction: column;
    background: var(--card-paper); border-radius: 10px; padding: 6px;
    box-shadow: var(--paper-shadow-s);
    z-index: 50; min-width: 150px;
  }
  #stack-menu.hidden { display: none; }
  #stack-menu-colors, #stack-menu-container-colors { display: flex; flex-direction: column; gap: 4px; padding: 4px 6px 6px; order: 3; }
  #stack-menu-colors.hidden, #stack-menu-container-colors.hidden { display: none; }
  .shape-color-row { display: flex; gap: 6px; background: rgba(255,255,255,0.75); border-radius: 7px; padding: 4px; }
  .shape-color-swatch, .container-color-swatch, .textnote-color-swatch {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid transparent;
    cursor: pointer; padding: 0;
  }
  .shape-color-swatch.selected, .container-color-swatch.selected, .textnote-color-swatch.selected { border-color: var(--ink-neutral); }
  #stack-menu-fill-style { display: flex; flex-direction: column; gap: 2px; padding: 4px 6px 8px; }
  #stack-menu-fill-style.hidden { display: none; } #stack-menu-fill-style { order: 2; padding: 0 6px 4px; }
  .shape-fill-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; cursor: pointer; padding: 5px 6px; border-radius: 6px;
    font-family: "Public Sans", "Inter", sans-serif; font-size: 12px; color: var(--ink-neutral);
    text-align: left; transition: background 0.1s;
  }
  .shape-fill-btn:hover { background: rgba(61,51,42,0.07); }
  .shape-fill-btn.selected { background: rgba(61,51,42,0.1); font-weight: 600; }
  .shape-fill-btn svg { width: 32px; height: 18px; flex-shrink: 0; color: var(--ink-neutral); }


  .shape-frost {
    position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit; clip-path: inherit;
  }
  .shape-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 8px; text-align: center; pointer-events: none;
    font-family: "Public Sans", "Inter", sans-serif; font-size: 14px; font-weight: 500;
    line-height: 1.3; word-break: break-word;
  }
  .shape-label-editor {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 8px;
  }
  .shape-label-editor textarea {
    background: transparent; border: none; outline: none; resize: none;
    text-align: center; font-family: "Public Sans", "Inter", sans-serif; font-size: 14px; font-weight: 500;
    line-height: 1.3; color: inherit; width: 100%; height: 100%;
    -webkit-user-select: text; user-select: text; pointer-events: auto; overflow: hidden;
  }

  /* Opacity slider */
  #stack-menu-opacity { padding: 6px 10px 10px; }
  #stack-menu-opacity.hidden { display: none; } #stack-menu-opacity { order: 5; padding: 0 10px 6px; }
  .stack-menu-section-label {
    font-family: "Public Sans", "Inter", sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint);
    padding: 6px 10px 2px;
  }
  .stack-menu-opacity-row { display: flex; align-items: center; gap: 8px; }
  .stack-menu-opacity-label {
    font-family: "Public Sans", "Inter", sans-serif; font-size: 12px; color: var(--ink-faint);
    flex-shrink: 0; width: 30px; text-align: right;
  }
  #shape-opacity-slider { flex: 1; accent-color: var(--ink-neutral); cursor: pointer; }

  /* Gradient picker */
  #stack-menu-gradient { padding: 4px 10px 10px; }
  #stack-menu-gradient.hidden { display: none; } #stack-menu-gradient { order: 4; padding: 0 10px 6px; }
  .gradient-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 4px; background: rgba(255,255,255,0.75); border-radius: 7px; padding: 4px; }
  .gradient-color-swatch {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .gradient-color-swatch:hover { outline: 2px solid rgba(61,51,42,0.2); outline-offset: 1px; }
  .gradient-color-swatch.selected { border-color: var(--ink-neutral); }
  .gradient-none-swatch {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(61,51,42,0.25);
    cursor: pointer; padding: 0; flex-shrink: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; color: var(--ink-faint);
    font-size: 14px; line-height: 1;
  }
  .gradient-none-swatch:hover { border-color: var(--ink-neutral); color: var(--ink-neutral); }
  .gradient-none-swatch.selected { border-color: var(--ink-neutral); }

  /* Grid snap */
  .tool-btn.snap-active { background: rgba(61,51,42,0.12); color: var(--ink-neutral); }
  #canvas-grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle, rgba(61,51,42,0.22) 1px, transparent 1px);
    background-size: 20px 20px; display: none;
  }
  #canvas-grid.visible { display: block; }
  #stack-menu-shape-types { padding: 4px 6px 2px; order: 1; }
  #stack-menu-shape-types.hidden { display: none; }
  .shape-type-mini-row { display: flex; gap: 5px; background: rgba(255,255,255,0.75); border-radius: 8px; padding: 5px; }
  .shape-type-mini-btn {
    background: transparent; border: 1.5px solid transparent; border-radius: 7px;
    padding: 6px; cursor: pointer; color: var(--ink-neutral);
    display: flex; align-items: center; justify-content: center;
    flex: 1; transition: background 0.1s;
  }
  .shape-type-mini-btn svg { width: 22px; height: 22px; }
  .shape-type-mini-btn:hover { background: rgba(61,51,42,0.07); }
  .shape-type-mini-btn.selected { background: rgba(61,51,42,0.12); border-color: rgba(61,51,42,0.25); }
  #multi-delete-confirm {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--card-paper);
    border-radius: 14px; padding: 20px 24px;
    box-shadow: var(--paper-shadow-l);
    z-index: 80; min-width: 260px; text-align: center;
  }
  #multi-delete-confirm.hidden { display: none; }
  #multi-delete-confirm p {
    font-family: "Public Sans", "Inter", sans-serif; font-size: 14px; color: var(--ink-neutral);
    margin: 0 0 16px;
  }
  #multi-delete-confirm .confirm-btns {
    display: flex; gap: 8px; justify-content: center;
  }
  #multi-delete-confirm button {
    font-family: "Public Sans", "Inter", sans-serif; font-size: 14px; border: none;
    padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 500;
  }
  #multi-delete-confirm-yes {
    background: var(--fic-ink); color: white;
  }
  #multi-delete-confirm-yes:hover { opacity: 0.88; }
  #multi-delete-confirm-no {
    background: rgba(61,51,42,0.08); color: var(--ink-neutral);
  }
  #multi-delete-confirm-no:hover { background: rgba(61,51,42,0.14); }
  #stack-menu-shape-actions.hidden { display: none; }
  #stack-menu-shape-actions button:hover { background: rgba(61,51,42,0.08) !important; border-radius: 6px; }
  .stack-menu-item {
    background: none; border: none; text-align: left;
    font-family: "Public Sans", "Inter", sans-serif; font-size: 14px; color: var(--ink-neutral);
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .stack-menu-item.hidden { display: none; }
  .stack-menu-item:hover { background: rgba(61,51,42,0.08); }
  #stack-menu-delete { color: var(--fic-ink); border-top: 0.5px solid rgba(61,51,42,0.1); margin-top: 4px; padding-top: 10px; }

  .card {
    position: absolute;
    border-radius: 10px;
    padding: 0;
    cursor: grab;
    box-shadow: 2px 5px 14px rgba(61,51,42,0.56), 1px 2px 4px rgba(61,51,42,0.36);
    user-select: none;
    touch-action: none;
    overflow: visible;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    transition: left 0.22s ease, top 0.22s ease, width 0.22s ease, height 0.22s ease,
                transform 0.2s ease, box-shadow 0.2s ease;
  }
  /* iOS-style gradient border highlight */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 10px;
    padding: 1px;
    background: linear-gradient(145deg,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.6) 45%,
      rgba(255,255,255,0.25) 70%,
      rgba(90,60,50,0.32) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .card:active { cursor: grabbing; }
  .card.is-dragging {
    transform: scale(1.04) rotate(1deg);
    box-shadow: 4px 10px 40px rgba(61,51,42,0.72), 2px 5px 10px rgba(61,51,42,0.44);
    z-index: 20;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card.just-landed {
    animation: card-land 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .card.just-joined-stack {
    animation: card-pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes card-land {
    from { transform: scale(1.04) rotate(1deg); }
    to   { transform: scale(1) rotate(0deg); }
  }
  @keyframes card-pop-in {
    from { transform: scale(0.88); opacity: 0.5; }
    to   { transform: scale(1); opacity: 1; }
  }
  /* Same lift-on-drag effect as cards, extended to shapes and stacks —
     makeDraggable already adds/removes these classes on every draggable
     item, but until now only .card had matching CSS to actually show it. */
  .shape-item.is-dragging, .card-group-frame.is-dragging {
    transform: scale(1.04) rotate(1deg);
    box-shadow: 4px 10px 40px rgba(61,51,42,0.72), 2px 5px 10px rgba(61,51,42,0.44);
    z-index: 20;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .shape-item.just-landed, .card-group-frame.just-landed {
    animation: card-land 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .card.modal-open { opacity: 0 !important; pointer-events: none; }
  .card-header {
    padding: 10px 12px 6px; flex-shrink: 0;
    background: linear-gradient(160deg, #F5EFE7 0%, #D0C9C0 100%);
    border-bottom: 1px solid #776750;
    border-radius: 10px 10px 0 0;
  }
  .card.cat-documentary .card-header { background: linear-gradient(160deg, #E3F1FF 0%, #AAD3FF 100%); border-bottom-color: #3B76D5; }
  .card.cat-games .card-header { background: linear-gradient(160deg, #FFEADC 0%, #FFB380 100%); border-bottom-color: #E37A3C; }
  .card.cat-fiction .card-header { background: linear-gradient(160deg, #FFE7EB 0%, #F6A3B1 100%); border-bottom-color: #802A40; }
  .card.cat-music .card-header { background: linear-gradient(160deg, #E7EFFF 0%, #9AADF1 100%); border-bottom-color: #33409E; }
  .card-body {
    padding: 0 12px 10px; flex: 1; min-height: 0; background: var(--card-paper);
    display: flex; flex-direction: column;
    border-radius: 0 0 10px 10px;
    position: relative;
    overflow: hidden;
  }
  .card-body::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 0 0 10px 10px;
    background:
      linear-gradient(to bottom, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 55%) left/1px 100% no-repeat,
      linear-gradient(to bottom, rgba(90,60,50,0.18) 0%, rgba(90,60,50,0) 55%) right/1px 100% no-repeat;
    pointer-events: none;
    z-index: 1;
  }
  .card-block-icons {
    display: flex; gap: 4px; align-items: center; margin-left: auto; flex-shrink: 0; padding-left: 6px;
  }
  .card-block-icon { display: flex; align-items: center; opacity: 0.6; }
  .card-block-icon svg { width: 11px; height: 11px; }
  .card.cat-documentary .card-block-icon { color: var(--doc-ink); }
  .card.cat-games .card-block-icon { color: var(--games-ink); }
  .card.cat-fiction .card-block-icon { color: var(--fic-ink); }
  .card.cat-music .card-block-icon { color: var(--mus-ink); }
  .card.cat-idea .card-block-icon, .card .card-block-icon { color: var(--neu-ink); }
  .card .card-title { font-family: "Newsreader", "Lora", serif; font-weight: 600; font-size: 15px; margin: 0 0 2px; color: var(--neu-ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .card-sub { font-size: 12px; margin: 0; color: var(--neu-sub); flex-shrink: 0; }
  .card .card-preview { font-size: 12px; line-height: 1.5; color: var(--ink-neutral); opacity: 0.75; margin: 0; padding-top: 8px; flex: 1; min-height: 0; overflow: hidden; overflow-wrap: break-word; display: flex; flex-direction: column; }
  .card-preview-heading { font-family: "Newsreader", "Lora", serif; font-weight: 600; font-size: 14px; opacity: 1; margin-top: 4px; }
  .card-preview-heading:first-child { margin-top: 0; }
  .card-preview-line:empty { height: 6px; }
  .card-song-pill {
    display: flex; align-items: center; gap: 7px;
    background: rgba(161,76,90,0.08); border-radius: 8px;
    padding: 6px 10px; margin-top: 6px;
  }
  .card-song-pill svg { width: 14px; height: 14px; color: #A14C5A; flex-shrink: 0; }
  .card-song-pill-text { display: flex; flex-direction: column; min-width: 0; }
  .card-song-pill-title {
    font-family: "Newsreader", "Lora", serif; font-weight: 600; font-size: 12px;
    color: #A14C5A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-song-pill-artist {
    font-family: "Public Sans", "Inter", sans-serif; font-size: 12px;

    cursor: grab;
    touch-action: none;

    transition: left 0.22s ease, top 0.22s ease, width 0.22s ease, height 0.22s ease,
      transform 0.15s ease, filter 0.15s ease;

  .img-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; pointer-events: none; }
  /* Same lift-on-drag/land-on-drop treatment as cards, shapes, and stacks —
     rotation lives in --item-rotation (a custom property) rather than
     directly on transform, specifically so this class can add the lift

     fight (inline transform would otherwise always beat a CSS class). */

    transform: rotate(var(--item-rotation, 0deg)) scale(1.04);
    /* v39: a blurred drop-shadow filter on a moving element leaves stale
       shadow trails in Safari until release. A plain box-shadow repaints
       cleanly while the photo is being dragged. */

    box-shadow: 4px 10px 32px rgba(61,51,42,0.6), 2px 5px 10px rgba(61,51,42,0.4);

  .property-music-suggestion-btn:hover { border-color: rgba(161,76,90,0.35); background: rgba(161,76,90,0.06); }
  .table-cell.derived-cell { color: var(--ink-faint); font-style: italic; cursor: default; }
  .table-perf-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(161,76,90,0.12); color: #A14C5A;
    border: none; border-radius: 999px; padding: 3px 10px 3px 8px;
    font-family: "Public Sans", "Inter", sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
    transition: background 0.12s;
  }
  .table-perf-pill svg { width: 9px; height: 9px; flex-shrink: 0; }
  .table-perf-pill:hover { background: rgba(161,76,90,0.22); }
  .table-cell.perf-cell { cursor: default; }
  #property-create-confirm, #option-picker-new-confirm {
    width: 100%; background: var(--neu-ink); color: var(--card-paper); border: none;
    border-radius: 999px; font-size: 12px; cursor: pointer; padding: 7px; font-family: "Public Sans", "Inter", sans-serif;
  }
  #option-picker-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; max-height: 160px; overflow-y: auto; }
  .option-picker-row {
    display: flex; align-items: center; justify-content: space-between;
    border-radius: 8px; padding: 4px 4px 4px 8px; cursor: pointer;
  }
  .option-picker-row:hover { background: var(--canvas-bg); }
  #option-picker-new-input {
    width: 100%; border: none; border-bottom: 1px solid rgba(61,51,42,0.15);
    background: transparent; outline: none; font-size: 12px; color: var(--ink-neutral);
    padding: 0 0 6px; margin-bottom: 8px; font-family: "Public Sans", "Inter", sans-serif;
  }

  #modal-notes {
    width: 100%; min-height: 140px; border: none; background: transparent;
    font-family: "Public Sans", "Inter", sans-serif; font-size: 14px; line-height: 1.7; color: var(--ink-neutral);
    outline: none; resize: none; padding: 0; margin-top: 0; flex: 1;
  }
  #modal-notes::placeholder { color: var(--ink-faint); }
  #modal-delete {
    margin-top: 16px; background: none; border: none; color: var(--ink-faint);
    font-size: 12px; cursor: pointer; padding: 0; flex-shrink: 0;
  }
  #modal-delete:hover { color: var(--fic-ink); }
  #delete-confirm {
    margin-top: 16px; display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ink-faint); flex-shrink: 0;
  }
  #delete-confirm.hidden { display: none; }
  #delete-confirm-yes {
    background: none; border: none; color: var(--fic-ink); font-weight: 500;
    font-size: 12px; cursor: pointer; padding: 0;
  }
  #delete-confirm-cancel {
    background: none; border: none; color: var(--ink-faint);
    font-size: 12px; cursor: pointer; padding: 0;
  }
  .hidden { display: none; }

  /* ===== DL TRIAL v2 (shared with Radar v3). Delete this block and restore the three CATEGORY_ maps to undo. ===== */
  :root { --ink-faint: #655948; --doc-bg: #D6EBFF; --doc-ink: #15366B; --doc-sub: #35578F; --doc-border: #83A6DD; --doc-divider: #B1C9EF; --fic-bg: #FFDCE3; --fic-ink: #601C2E; --fic-sub: #863D4D; --fic-border: #D68D99; --fic-divider: #EBB8BF;
    --mus-bg: #FFE9BF; --mus-ink: #5A3700; --mus-sub: #7D5510; --mus-border: #E3B35C; --mus-divider: #F1D194;
    --neu-bg: #EEE7DD; --neu-ink: #413626; --neu-sub: #625646; --neu-border: #B0A290; --neu-divider: #D3C5B2;
    --evt-bg: #F1F0EE; --evt-ink: #33312E; --evt-sub: #5E5C58; --evt-border: #C9C7C3; --evt-divider: #DBD9D6;
    --games-bg: #FFD9C2; --games-ink: #5C1D00; --games-sub: #8A3A0E; --games-border: #EE8F57; --games-divider: #F7B994;
    --dl-bold: "Encode Sans Semi Condensed", "Public Sans", sans-serif; }
  body, button, input, textarea, select { font-weight: 500; }
  .card { --edge: #776750; }
  .card.cat-documentary { --edge: #3B76D5; } .card.cat-fiction { --edge: #802A40; } .card.cat-music { --edge: #E39A12; } .card.cat-games { --edge: #EA5F14; } .card.cat-event { --edge: #A9A7A3; }
  .card.cat-music .card-header { background: linear-gradient(160deg, #FFF1D6 0%, #FFCB70 100%); border-bottom-color: #E39A12; }
  .card.cat-games .card-header { background: linear-gradient(160deg, #FFE3D2 0%, #FF9B5E 100%); border-bottom-color: #EA5F14; }
  .card.cat-event .card-header { background: #E4E3E1; border-bottom-color: #A9A7A3; }
  .card-header { border-bottom-width: 1.5px; box-shadow: inset 0 4px 0 var(--edge); padding-top: 13px; }
  .card .card-title { font-family: "Public Sans", "Inter", sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .card-preview-heading, .card-song-pill-title { font-family: var(--dl-bold); font-weight: 700; }
  #modal-title { font-family: var(--dl-bold); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
  .card .card-preview { opacity: 1; color: var(--ink-neutral); font-size: 14px; }
  .card .card-sub { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .card-property-badge { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: rgba(61,51,42,0.1); }
  .card-block-icon { opacity: 1; }
  .card-block-icon svg { width: 14px; height: 14px; }
  .timeline-event-card { background: #F1F0EE; border-color: #C9C7C3; box-shadow: 1px 3px 8px rgba(61,51,42,0.16), 0 1px 2px rgba(61,51,42,0.12); }
  .timeline-event-card-title { font-family: "Public Sans", "Inter", sans-serif; font-weight: 700; }
  /* Event cards: the month-colour tab IS the top bar. Fit it inside the card edge and drop the extra inset bar. */
  .card.cat-event .event-month-tab { height: 5px; margin: 0; border-radius: 9px 9px 0 0; }
  .card.cat-event .card-header { box-shadow: none; border-radius: 0; padding-top: 10px; }
  .table-cell.table-name-cell { font-family: "Public Sans", "Inter", sans-serif; font-weight: 700; letter-spacing: -0.005em; }
  /* ===== end DL TRIAL ===== */
  /* ===== DL RESPONSIVE: floating title bar and toolbar fit the screen (no visual restyle, just wrapping) ===== */
  #board-title-bar { max-width: calc(100vw - 16px); top: calc(20px + env(safe-area-inset-top, 0px)); }
  #toolbar { width: max-content; max-width: calc(100vw - 16px); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); flex-wrap: wrap; justify-content: center; }
  #canvas-color-popup { bottom: var(--toolbar-clear, 76px); max-width: calc(100vw - 16px); flex-wrap: wrap; }
  #boards-panel { top: var(--titlebar-clear, 56px); width: min(300px, calc(100vw - 16px)); }
  @media (max-width: 640px) {
    body:not(.focus-mode) #board-title-bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 4px; }
    body:not(.focus-mode) #board-title-input { order: -1; flex: 1 0 100%; width: auto !important; min-width: 0; }
    body:not(.focus-mode) #toolbar { display: grid; grid-template-columns: repeat(5, 44px); justify-content: center; gap: 4px 6px; border-radius: 28px; padding: 8px 12px; }
    body:not(.focus-mode) #toolbar .tool-btn.toolbar-icon-only { width: 44px; height: 44px; padding: 0; justify-content: center; align-items: center; }
  }
  /* ===== end DL RESPONSIVE ===== */

  /* ===== DL RADAR STYLE v10: bring Canvas in line with Radar (arty mid-century newspaper). Delete this block to undo. ===== */
  :root {
    --r-ink: #1E1B18;
    --r-panel: #FBF8F0;
    --r-shadow: 2px 5px 14px rgba(61,51,42,.30), 1px 2px 4px rgba(61,51,42,.20);
    --r-shadow-lift: 3px 8px 22px rgba(61,51,42,.36), 1px 3px 6px rgba(61,51,42,.22);
    --r-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --paper-edge: var(--r-ink);
    --paper-shadow-s: 0 0 0 1.5px var(--r-ink), var(--r-shadow);
    --paper-shadow-l: 0 0 0 1.5px var(--r-ink), var(--r-shadow-lift);
  }
  /* light warm surround instead of the dark app backdrop; the board reads as a sheet of paper on a desk */
  #wrap { background: #E4DDCB; }
  #board-rect { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--r-ink), var(--r-shadow-lift); }
  /* floating bars: inked rectangles like Radar's panels, not glass pills */
  #board-title-bar, #toolbar { border-radius: 14px; }
  body:not(.focus-mode) #board-title-bar { border-radius: 14px; }
  #board-title-input { text-transform: uppercase; font-weight: 900; font-size: 20px; letter-spacing: 0.03em; color: var(--r-ink); min-width: 140px; }
  #board-title-input::placeholder { text-transform: uppercase; }
  #canvas-logo { border-radius: 6px; box-shadow: 0 0 0 1.5px var(--r-ink); margin-right: 4px; }
  /* buttons and hovers: ink on paper, same as Radar's tabs */
  .tool-btn:hover { background: #ECE6D6; }
  #stack-drop-chip, #group-suggest-btn { font-family: var(--r-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  #group-suggest-btn:hover { background: #ECE6D6; }
  /* one bold display voice everywhere: no serif left over */
  .card-song-pill-title, #script-title, #modal-title, .song-title-input, #perf-song-title, #chord-editor-name,
  .calendar-nav-title, .timeline-event-card-title, .card-group-title-input, .card-preview-heading,
  .card .card-title, .table-cell.table-name-cell { font-family: var(--dl-bold); }
  .card-song-pill-title, .song-title-input, #perf-song-title, #chord-editor-name { font-weight: 800; }
  #modal-title, #script-title { text-transform: uppercase; letter-spacing: 0.01em; font-weight: 900; }
  .calendar-nav-title { text-transform: uppercase; font-weight: 800; letter-spacing: 0.03em; font-size: 15px; }
  .card-group-title-input { text-transform: uppercase; font-weight: 800; letter-spacing: 0.03em; font-size: 16px; }
  .table-cell.table-name-cell { font-weight: 700; font-size: 14px; }
  /* card shadow and edge, as Radar cards */
  .card { box-shadow: var(--r-shadow); }
  /* section labels in popups: mono caps, as Radar's labels */
  #shape-type-popup h4, #shape-type-popup .section-label, .popup-section-label { font-family: var(--r-mono); letter-spacing: 0.08em; }
  /* Add to board and other dark primary buttons: ink, like Radar's Cut button */
  #shape-picker-confirm { background: var(--r-ink); color: #FBF8F0; }
  
  /* ===== DL RADAR STYLE v11: bold flat-colour icons (ink outline, colour blocks) ===== */
  svg.mm-ico { overflow: visible; }
  .tool-btn.toolbar-icon-only svg.mm-ico { width: 26px; height: 26px; }
  .cat-icon-btn svg.mm-ico, .block-add-btn svg.mm-ico, .group-view-btn svg.mm-ico { width: 22px; height: 22px; }
  .tool-btn:hover svg.mm-ico { transform: translate(-1px,-1px); }
  svg.mm-ico { transition: transform 0.12s; }
  /* ===== end icons ===== */
  
  /* ===== DL RADAR STYLE v12: canvas palette as labelled paper / tint / poster / neutral rows ===== */
  #canvas-color-popup { padding: 14px; gap: 8px; border-radius: 14px; }
  .color-temp-group { display: flex; align-items: center; gap: 10px; background: transparent; padding: 0; }
  .color-row-label { width: 108px; flex-shrink: 0; font-family: var(--r-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--r-ink); }
  .canvas-color-swatch { width: 38px; height: 38px; border-radius: 4px; border: 1.5px solid var(--r-ink); box-shadow: 1px 2px 0 rgba(61,51,42,0.25); position: relative; transition: transform 0.1s; }
  .canvas-color-swatch:hover { transform: translate(-1px,-1px); }
  .canvas-color-swatch.selected { border-color: var(--r-ink); box-shadow: 0 0 0 2px var(--r-panel), 0 0 0 4px var(--r-ink); }
  .canvas-color-swatch.selected::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: var(--r-ink); border-radius: 50%; }
  /* ===== end palette ===== */
  
  /* ===== DL RADAR STYLE v13: cards as printed stationery (ink keyline, index tabs, Radar colours) ===== */
  .card { border-radius: 4px; --edge: #9A9590; }
  .card.cat-documentary { --edge: #3B82C4; } .card.cat-fiction { --edge: #E0527A; } .card.cat-music { --edge: #E8B92E; }
  .card.cat-games { --edge: #E0883A; } .card.cat-event { --edge: #A9A7A3; } .card.cat-idea { --edge: #9A9590; }
  /* crisp ink outline replaces the glossy iOS highlight */
  .card::after { border-radius: 4px; padding: 0; background: none; -webkit-mask: none; mask: none; border: 1.5px solid var(--r-ink); }
  .card-header { border-radius: 3px 3px 0 0; }
  .card-body { border-radius: 0 0 3px 3px; box-shadow: inset 0 0 0 4px var(--card-paper), inset 0 0 0 5px rgba(30,27,24,0.16); }
  .card-body::before { display: none; }
  /* Radar project colours on the headers */
  .card.cat-documentary .card-header { background: #9DC5FF; border-bottom-color: #3B82C4; }
  .card.cat-fiction .card-header { background: #F7A3D3; border-bottom-color: #E0527A; }
  .card.cat-music .card-header { background: #FFD865; border-bottom-color: #E8B92E; }
  .card.cat-games .card-header { background: #FF9B5E; border-bottom-color: #E0883A; }
  .card.cat-event .card-header { background: #E4E3E1; border-bottom-color: #A9A7A3; }
  .card.cat-idea .card-header { background: #DDD6C6; border-bottom-color: #9A9590; }
  .card.cat-fiction .card-title { color: #7A1F3C; } .card.cat-fiction .card-sub { color: #7A1F3C; }
  /* display-caps titles, like PROJECT RADAR */
  .card .card-title { font-family: var(--dl-bold); font-weight: 800; font-size: 16px; letter-spacing: 0.03em; text-transform: uppercase; }
  /* category label as a printed index tab: colour block on the left, as on Radar's chips */
  .card .card-sub { display: inline-block; align-self: flex-start; width: fit-content; max-width: 100%; margin-top: 3px; padding: 1px 8px 1px 8px; border: 1px solid var(--edge); border-left-width: 7px; border-radius: 2px; background: rgba(251,248,240,0.7); }
  .card.selected, .img-item.selected, .shape-item.selected, .card-group-frame.selected, .container-box.selected { outline: 2.5px solid var(--r-ink); outline-offset: 3px; }
  /* ===== end cards ===== */
  /* v18: month-colour tab stays clearly visible on cards inside stacks (notebook + timeline) */
  .card.cat-event .event-month-tab { height: 9px; border-bottom: 1.5px solid var(--r-ink); box-sizing: border-box; flex-shrink: 0; }
  .timeline-event-card-tab { height: 9px; border-bottom: 1.5px solid var(--r-ink); box-sizing: border-box; }
  /* v19: title bar icons in the bold flat-colour style (ink outline, colour blocks) */
  /* v20: title bar sized to match the bottom tool bar (62px tall, 46px buttons, 26px icons) */
  #board-title-bar { padding: 8px 10px; gap: 10px; }
  #board-title-bar button { width: 46px; height: 46px; padding: 10px; border: none; background: none; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--r-ink); box-sizing: border-box; }
  #board-title-bar button:hover { background: #ECE6D6; }
  #board-title-bar button svg.mm-ico { width: 26px; height: 26px; }
  #board-title-bar button:hover svg.mm-ico { transform: translate(-1px,-1px); }
  #board-title-bar #canvas-logo { width: 42px; height: 42px; margin-right: 0; }
  #board-title-bar #board-title-input { font-size: 24px; height: 46px; min-width: 160px; }
  /* v21: hide-menu slides the bottom tool bar straight down off screen (eased, with vertical motion blur) */
  /* restore (leaving focus mode): ease-out, so the bar arrives at speed and glides in clean; hide keeps its ease-in below */
  #toolbar { transition: transform 0.6s cubic-bezier(.2,.8,.2,1), visibility 0s linear 0s; will-change: transform; }
  body.focus-mode #toolbar {
    left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 64px));
    width: max-content; height: auto; padding: 8px 10px; overflow: visible;
    justify-content: flex-start; align-items: stretch;
    visibility: hidden; pointer-events: none;
    transition: transform 0.7s cubic-bezier(.7,0,.2,1), visibility 0s linear 0.7s;
  }
  body.focus-mode #toolbar > *:not(#restore-ui-btn) { opacity: 1; pointer-events: none; position: static; }
  #restore-ui-btn, body.focus-mode #restore-ui-btn { display: none; }
  /* v24: title bar open/close. Height now animates with width; eye stays in flow and travels (see toggleFocusMode);
     contents fade in one after another as the widening bar passes each one */
  #board-title-bar { overflow: hidden; transition: left 0.65s cubic-bezier(.65,0,.35,1), top 0.65s cubic-bezier(.65,0,.35,1), transform 0.65s cubic-bezier(.65,0,.35,1), width 0.65s cubic-bezier(.65,0,.35,1), height 0.65s cubic-bezier(.65,0,.35,1), padding 0.65s cubic-bezier(.65,0,.35,1); }
  body.focus-mode #board-title-bar { justify-content: flex-start; }
  /* while closing, contents stay in the layout so they can fade out in turn; they leave it once the bar has settled */
  body.focus-mode:not(.focus-settled) #board-title-bar > *:not(#focus-mode-btn) { position: static; }
  body.focus-settled #focus-mode-btn { margin-left: -1px; }

  /* ===== end DL RADAR STYLE ===== */
</style>

<style id="dl-blocks-css">
/* DL BLOCKS v29: dashed block outlines in the designer, always-visible drag tab, no overlap on board cards */
#blocks-container { gap: 16px; padding: 18px 6px 12px 2px; }
#blocks-container > .card-block {
  --bc: #7C8594;
  border: 1.5px dashed var(--bc); border-radius: 8px;

}

#blocks-container > .card-block > .block-drag-handle {
  left: 12px; top: -13px; transform: none; width: 40px; height: 24px; opacity: 1;
  border-radius: 12px; background: var(--bc); color: #fff; cursor: grab; touch-action: none; z-index: 3;
}

#blocks-container > .card-block > .block-remove-btn {
  right: 12px; top: -13px; width: 24px; height: 24px; opacity: 1; z-index: 3;
  background: var(--bc); color: #fff; font-size: 17px; line-height: 24px;
}
#blocks-container > .card-block > .block-remove-btn:hover { background: var(--bc); filter: brightness(0.85); color: #fff; }

.card .card-preview > * { flex-shrink: 0; }
.map-block-map { height: auto !important; aspect-ratio: 4 / 3; }

<style id="dl-header-colours">

<script>
(function () {
  var STORE_KEY = "canvas-state-v1"; // overridden by board system

  // Birthdays live outside any single board's state — entered once, they
  // show up on every egg calendar on every board, forever.
  var GLOBAL_BIRTHDAYS_KEY = "canvas-global-birthdays";
  function loadGlobalBirthdays() {
    try {
      var raw = localStorage.getItem(GLOBAL_BIRTHDAYS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveGlobalBirthdays(list) {
    try {
      localStorage.setItem(GLOBAL_BIRTHDAYS_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      console.warn("Could not save birthdays", e);
      return false;
    }
  }

  // Shrinks an uploaded photo down to something sensible for a small
  // circular thumbnail before it ever gets stored — a full-resolution
  // phone photo can be several MB, versus a few KB once downscaled,
  // which matters a lot given localStorage has a hard quota shared
  // across everything else already saved.
  function resizeImageDataUrl(dataUrl, maxSize, quality, callback) {
    // JPEG has no alpha channel — forcing every image through it would
    // silently flatten any transparent PNG (a cut-out token/sprite, say)
    // onto a solid background. So: preserve PNG output for PNG sources,
    // which keeps transparency intact at the cost of a larger file; only
    // non-transparent formats (regular photos) get the smaller lossy JPEG.
    var isPng = dataUrl.indexOf("data:image/png") === 0;
    var img = new Image();
    img.onload = function() {
      var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      var targetW = Math.max(1, Math.round(img.width * scale));
      var targetH = Math.max(1, Math.round(img.height * scale));

      // Downscaling a transparent PNG in one big jump makes the browser
      // blend each edge pixel with its fully-transparent neighbours —
      // and those "invisible" pixels are very often stored as black
      // underneath even at alpha=0, producing a visible dark halo around
      // any soft/antialiased edge. Stepping down by half repeatedly (the
      // standard fix for this) keeps each blend local enough that the
      // artifact never really has room to show up.
      var curW = img.width, curH = img.height;
      var srcCanvas = document.createElement("canvas");
      srcCanvas.width = curW; srcCanvas.height = curH;
      srcCanvas.getContext("2d").drawImage(img, 0, 0);
      var srcCtx = srcCanvas;

      while (curW * 0.5 > targetW && curH * 0.5 > targetH) {
        var stepW = Math.max(targetW, Math.round(curW * 0.5));
        var stepH = Math.max(targetH, Math.round(curH * 0.5));
        var stepCanvas = document.createElement("canvas");
        stepCanvas.width = stepW; stepCanvas.height = stepH;
        stepCanvas.getContext("2d").drawImage(srcCtx, 0, 0, stepW, stepH);
        srcCtx = stepCanvas;
        curW = stepW; curH = stepH;
      }

      var canvasEl = document.createElement("canvas");
      canvasEl.width = targetW; canvasEl.height = targetH;
      var ctx = canvasEl.getContext("2d");
      ctx.drawImage(srcCtx, 0, 0, targetW, targetH);
      try {
        callback(isPng ? canvasEl.toDataURL("image/png") : canvasEl.toDataURL("image/jpeg", quality));
      } catch (e) {
        callback(null);
      }
    };
    img.onerror = function() { callback(null); };
    img.src = dataUrl;
  }

  // Supabase Storage — photos live here instead of as base64 blobs in
  // localStorage, which has a hard few-MB ceiling that base64 images
  // burn through fast. Falls back to storing the (still-compressed)
  // data URL locally if the upload fails for any reason — network down,
  // bucket misconfigured, Supabase unreachable — so the app keeps
  // working even without connectivity, just back to the old ceiling.
  var SUPABASE_URL = "https://khjrutahsyomcykkgscw.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_6tgotKURJQGD2GYqZ4y2xg_FeGKsliu";
  var SUPABASE_BUCKET = "Photos";
  // auth is disabled entirely — this app has no login, so we never want
  // a stray/anonymous auth session hijacking the Authorization header
  // and silently swapping the effective Postgres role from anon to
  // authenticated, which would fail RLS checks written for anon.
  var supabaseClient = (typeof window.supabase !== "undefined")
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      })
    : null;

  function uploadImageToSupabase(dataUrl, callback) {
    if (!supabaseClient) { callback(null); return; }
    fetch(dataUrl).then(function(res){ return res.blob(); }).then(function(blob){
      var ext = (blob.type === "image/png") ? ".png" : ".jpg";
      var fileName = "img_" + Date.now() + "_" + Math.random().toString(36).slice(2) + ext;
      return supabaseClient.storage.from(SUPABASE_BUCKET).upload(fileName, blob, { contentType: blob.type || "image/jpeg" })
        .then(function(uploadResult){
          if (uploadResult.error) {
            console.warn("Supabase upload failed — full detail:", JSON.stringify(uploadResult.error, null, 2));
            console.warn("Upload target was bucket:", SUPABASE_BUCKET, "using key prefix:", SUPABASE_ANON_KEY.slice(0, 20));
            callback(null); return;
          }
          // Bucket is private, so a plain public URL won't work — use a
          // long-lived signed URL instead (10 years) so it just keeps
          // working without needing to be regenerated.
          return supabaseClient.storage.from(SUPABASE_BUCKET).createSignedUrl(fileName, 60*60*24*365*10)
            .then(function(signedResult){
              if (signedResult.error) { console.warn("Could not create signed URL", signedResult.error); callback(null); return; }
              callback(signedResult.data.signedUrl);
            });
        });
    }).catch(function(err){
      console.warn("Supabase upload error", err);
      callback(null);
    });
  }

  // Generic (non-image) file upload — used for custom fonts. Unlike photos,
  // font files must never be recompressed/re-encoded, so this skips the
  // resize step entirely and just uploads the raw file as-is.
  function uploadFileToSupabase(file, callback) {
    if (!supabaseClient) { callback(null); return; }
    var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    var fileName = "font_" + Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + safeName;
    supabaseClient.storage.from(SUPABASE_BUCKET).upload(fileName, file, { contentType: file.type || "application/octet-stream" })
      .then(function(uploadResult){
        if (uploadResult.error) {
          console.warn("Supabase font upload failed:", JSON.stringify(uploadResult.error, null, 2));
          callback(null); return;
        }
        return supabaseClient.storage.from(SUPABASE_BUCKET).createSignedUrl(fileName, 60*60*24*365*10)
          .then(function(signedResult){
            if (signedResult.error) { console.warn("Could not create signed URL for font", signedResult.error); callback(null); return; }
            callback(signedResult.data.signedUrl);
          });
      }).catch(function(err){
        console.warn("Supabase font upload error", err);
        callback(null);
      });
  }

  // Custom fonts — stored globally (not per-board, since a font you upload
  // should be available everywhere) as {name, familyName, url} entries. Only
  // the small signed URL is kept locally; the actual font file lives in
  // Supabase, exactly like photos, so a handful of custom fonts can't eat
  // into localStorage quota the way base64 font data would.
  var CUSTOM_FONTS_KEY = "canvas-custom-fonts";
  function loadCustomFonts() {
    try {
      var raw = localStorage.getItem(CUSTOM_FONTS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveCustomFonts(list) {
    try { localStorage.setItem(CUSTOM_FONTS_KEY, JSON.stringify(list)); return true; }
    catch (e) { console.warn("Could not save custom fonts", e); return false; }
  }
  function registerCustomFont(entry) {
    if (!("FontFace" in window)) return;
    if (loadedFontFamilies.has(entry.familyName)) return; // already loaded — skip a duplicate network fetch
    loadedFontFamilies.add(entry.familyName);
    try {
      var face = new FontFace(entry.familyName, "url(" + entry.url + ")");
      face.load().then(function(loaded){ document.fonts.add(loaded); }).catch(function(err){
        console.warn("Could not load custom font", entry.name, err);
        loadedFontFamilies.delete(entry.familyName); // allow a retry later if this attempt failed
      });
    } catch (e) {
      console.warn("Could not register custom font", entry.name, e);
      loadedFontFamilies.delete(entry.familyName);
    }
  }
  // Lazy loading: with a personal library of custom fonts potentially
  // running into the dozens, fetching every single one on every app
  // load would make startup noticeably slower as the library grows —
  // most of them wouldn't even be used on whatever board is open. So
  // instead we only fetch a font's file the moment something on screen
  // actually needs to render in it.
  var loadedFontFamilies = new Set();
  var customFonts = loadCustomFonts();
  // Extracts the family name out of a CSS font-family value like
  // "'MyFont-ab12', sans-serif" and loads it on demand if it matches a
  // known custom font that hasn't been fetched yet this session.
  function ensureCustomFontLoaded(fontFamilyValue) {
    if (!fontFamilyValue) return;
    var match = fontFamilyValue.match(/^'([^']+)'/);
    if (!match) return;
    var familyName = match[1];
    if (loadedFontFamilies.has(familyName)) return;
    var entry = customFonts.find(function(cf){ return cf.familyName === familyName; });
    if (entry) registerCustomFont(entry);
  }

  // Compresses locally first (still worth doing — smaller uploads, less
  // bandwidth, faster loads), then tries Supabase, falling back to the
  // compressed data URL if the upload doesn't succeed.
  var pendingImageUploads = 0;
  // v34: builds the small versions of a photo (640px thumbnail and ~160px
  // tiny) and uploads them. needThumb=false makes the tiny one only.
  function makeSmallVersions(fullDataUrl, needThumb, cb) {
    function withThumb(thDataUrl, thUrl) {
      resizeImageDataUrl(thDataUrl || fullDataUrl, 160, 0.7, function(ti){
        if (!ti) { cb(thUrl, null); return; }
        uploadImageToSupabase(ti, function(tiUrl){ cb(thUrl, tiUrl || null); });
      });
    }
    if (!needThumb) { withThumb(null, null); return; }
    resizeImageDataUrl(fullDataUrl, 640, 0.8, function(th){
      if (!th) { cb(null, null); return; }
      uploadImageToSupabase(th, function(thUrl){
        if (!thUrl) { cb(null, null); return; }
        withThumb(th, thUrl);
      });
    });
  }

  // With wantThumb, also makes small versions and passes their URLs as the
  // 2nd and 3rd callback arguments (thumbnail, tiny), so boards can draw the
  // smallest file that still looks sharp at the current zoom.
  function compressAndUploadImage(dataUrl, maxSize, quality, callback, wantThumb) {
    pendingImageUploads++;
    resizeImageDataUrl(dataUrl, maxSize, quality, function(resized){
      var toUse = resized || dataUrl;
      uploadImageToSupabase(toUse, function(url){
        if (!url || !wantThumb) { pendingImageUploads--; callback(url || toUse); return; }
        makeSmallVersions(toUse, true, function(th, ti){
          pendingImageUploads--;
          callback(url, th, ti);
        });
      });
    });
  }

  // Birthdays set on a contact card (this board only) show up automatically
  // too, alongside the standalone global list — a convenience for people
  // Dan already keeps a contact card for, without needing to enter them
  // twice. Unlike the global list these are naturally per-board, since a
  // contact card only exists on whichever board it was created on.
  function getContactCardBirthdays() {
    var results = [];
    (state.cards || []).forEach(function(card){
      (card.blocks || []).forEach(function(block){
        if (block.type === "contact" && block.birthday) {
          var d = new Date(block.birthday + "T00:00:00");
          if (isNaN(d.getTime())) return;
          results.push({
            id: "contact:" + card.id + ":" + block.id,
            name: block.name || "Unnamed",
            month0: d.getMonth(),
            day: d.getDate(),
            photo: block.photo || null,
            fromContact: true
          });
        }
      });
    });
    return results;
  }

  function getAllBirthdaysForDisplay() {
    return loadGlobalBirthdays().concat(getContactCardBirthdays());
  }
  var SVG_NS = "http://www.w3.org/2000/svg";
  var wrap = document.getElementById("wrap");
  var canvas = document.getElementById("canvas");
  var boardRect = document.getElementById("board-rect");
  var boardResizeHandle = document.getElementById("board-resize-handle");
  var itemsLayer = document.getElementById("items-layer");
  var connectorLayer = document.getElementById("connector-layer");
  var connectorLinesGroup = document.getElementById("connector-lines-group");
  var connectorHitsGroup = document.getElementById("connector-hits-group");
  var connectorPopup = document.getElementById("connector-popup");
  var overlay = document.getElementById("overlay");
  var modal = document.getElementById("modal");
  var modalResizeHandle = document.getElementById("modal-resize-handle");
  var modalTitle = document.getElementById("modal-title");
  var modalNotes = document.getElementById("modal-notes");
  var modalDelete = document.getElementById("modal-delete");
  var cardImageGallery = document.getElementById("card-image-gallery");
  var cardImageInput = document.getElementById("card-image-input");
  var catSwatches = document.querySelectorAll(".cat-icon-btn");

  var state = { cards: [], images: [], connections: [] };
  var panX = 220, panY = 140, scale = 1;
  var activeCardId = null;
  var activeConnectionId = null;
  var selectedCardIds = new Set();
  var selectedImageIds = new Set();
  var selectedShapeIds = new Set();
  var selectedTextNoteIds = new Set();
  var selectedGroupIds = new Set();
  var selectedContainerIds = new Set();
  var selectedEggIds = new Set();

  var CONNECTOR_COLORS = {
    taupe: "#C9824A",
    rose: "#E0527A",
    slate: "#3D7DCC",
    olive: "#C9A227",
    "light-grey": "#B0ABA4",
    "mid-grey": "#7A7570",
    charcoal: "#3A3530",
    black: "#1A1714"
  };

  var CONNECTOR_DASH = {
    solid: "none",
    dashed: "9 6",
    dotted: "0.1 8"
  };

  var TAG_PALETTE = [
    { bg: "#DCEAE3", ink: "#1F4D3D" },
    { bg: "#F2D9DC", ink: "#6B1F2A" },
    { bg: "#F4DCC8", ink: "#7A3B1A" },
    { bg: "#DDE3F2", ink: "#2A3F6B" },
    { bg: "#E8DCF2", ink: "#4A2A6B" },
    { bg: "#F2E8DC", ink: "#6B4A1F" },
    { bg: "#DCF2E8", ink: "#1F6B4A" },
    { bg: "#F2DCDC", ink: "#6B1F1F" }
  ];

  function nextTagColor(usedCount) {
    return TAG_PALETTE[usedCount % TAG_PALETTE.length];
  }

  var CATEGORY_BG = {
    documentary: "#85AED0",
    fiction: "#E891A4",
    music: "#EDCF76",
    idea: "#DDD6C6",
    event: "#E4E3E1",
    games: "#E8B27E"
  };

  var CATEGORY_INK = {
    documentary: "var(--doc-ink)",
    fiction: "var(--fic-ink)",
    music: "var(--mus-ink)",

  function loadState() {

    if (!state.shapes) state.shapes = [];

    });
    if (!state.customChords) state.customChords = {};
    if (!state.eggYears) state.eggYears = [];
    // multi-voicing format { default: id, voicings: [{id, frets, ...}] }
    Object.keys(state.customChords).forEach(function (name) {
      var entry = state.customChords[name];
      if (entry && !entry.voicings) {
        var vid = uid();
        state.customChords[name] = {
          default: vid,
          voicings: [{
            id: vid,
            frets: entry.frets,
            baseFret: entry.baseFret,
            numFrets: entry.numFrets,
            barre: entry.barre
          }]
        };
      }
    });
    state.cards.forEach(function (c) { if (!c.properties) c.properties = {}; });
    state.cards.forEach(function (c) { migrateCardToBlocks(c); });
    var z = 0;
    state.cards.forEach(function (c) { if (typeof c.z !== "number") c.z = z++; });
    state.images.forEach(function (im) { if (typeof im.z !== "number") im.z = z++; });
    state.shapes.forEach(function (s) { if (typeof s.z !== "number") s.z = z++; if (!s.type) s.type = "rectangle"; if (typeof s.rotation !== "number") s.rotation = 0; });
    state.textNotes.forEach(function (n) { if (typeof n.z !== "number") n.z = z++; });
    state.containers.forEach(function (c) { if (!c.color || c.color === "neutral") c.color = "sand"; });
  }

  function getCardGroup(cardId) {
    return state.cardGroups.filter(function (s) { return s.cardIds.indexOf(cardId) !== -1; })[0] || null;
  }

  function getAllItemsByZ() {
    var stackedIds = {};
    state.cardGroups.forEach(function (s) { s.cardIds.forEach(function (id) { stackedIds[id] = true; }); });
    var all = state.cards.filter(function (c) { return !stackedIds[c.id]; }).map(function (c) { return { ref: c, type: "card" }; })
      .concat(state.images.map(function (im) { return { ref: im, type: "image" }; }))
      .concat((state.videos || []).map(function (v) { return { ref: v, type: "video" }; }))
      .concat((state.shapes || []).map(function (s) { return { ref: s, type: "shape" }; }))
      .concat((state.textNotes || []).map(function (n) { return { ref: n, type: "textNote" }; }))
      .concat((state.eggYears || []).map(function (e) { return { ref: e, type: "eggyear" }; }))
      .concat(state.cardGroups.map(function (g) { return { ref: g, type: "group" }; }));
    all.sort(function (a, b) { return (a.ref.z || 0) - (b.ref.z || 0); });
    return all;
  }

  function getMaxZ() {
    var max = -1;
    state.cards.concat(state.images).concat(state.videos || []).concat(state.shapes).concat(state.textNotes || []).concat(state.cardGroups).forEach(function (item) {
      if (typeof item.z === "number" && item.z > max) max = item.z;
    });
    return max;
  }

  function changeStackOrder(item, action) {
    var list = getAllItemsByZ();
    var idx = list.findIndex(function (entry) { return entry.ref === item; });
    if (idx === -1) return;
    var entry = list[idx];
    list.splice(idx, 1);
    if (action === "front") list.push(entry);
    else if (action === "back") list.unshift(entry);
    else if (action === "forward") list.splice(Math.min(idx + 1, list.length), 0, entry);
    else if (action === "backward") list.splice(Math.max(idx - 1, 0), 0, entry);
    list.forEach(function (e, i) { e.ref.z = i; });
    saveState();
    refreshCanvas();
  }

  function saveState() {

  // ---- Undo / redo ----
  var UNDO_LIMIT = 50;
  var undoStack = [];
  var redoStack = [];
  var lastUndoSnapshot = null;
  var undoCaptureTimer = null;
  var undoSuppressed = false;

  function snapshotForUndo() {
    return JSON.stringify({
      cards: state.cards,
      cardGroups: state.cardGroups,
      customChords: state.customChords,
      eggYears: state.eggYears,
      images: state.images,
      videos: state.videos,
      shapes: state.shapes,
      textNotes: state.textNotes,
      containers: state.containers,
      connections: state.connections
    });
  }

  function captureUndoSnapshot() {
    if (undoSuppressed) return;
    // Debounce rapid-fire saves (drag, typing) into a single undo step,
    // but always capture the FIRST state before a burst starts.
    if (undoCaptureTimer) {
      clearTimeout(undoCaptureTimer);
    } else {
      var snap = lastUndoSnapshot;
      if (snap === null) snap = snapshotForUndo();
      if (snap !== undoStack[undoStack.length - 1]) {
        undoStack.push(snap);
        if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        redoStack = [];
      }
    }
    undoCaptureTimer = setTimeout(function () {
      undoCaptureTimer = null;
      lastUndoSnapshot = null;
    }, 600);
    lastUndoSnapshot = snapshotForUndo();
  }

  function applyUndoSnapshot(snapJson) {
    var snap = JSON.parse(snapJson);
    undoSuppressed = true;
    state.cards = snap.cards;
    state.cardGroups = snap.cardGroups;
    state.customChords = snap.customChords;
    state.eggYears = snap.eggYears || [];
    state.images = snap.images;
    state.videos = snap.videos;
    state.shapes = snap.shapes;
    state.textNotes = snap.textNotes || [];
    state.containers = snap.containers;
    state.connections = snap.connections;
    clearSelection();
    closeModal();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    var before = captureItemRects();
    refreshCanvas();
    playFlipAnimation(before);
    undoSuppressed = false;
  }

  function performUndo() {
    if (undoCaptureTimer) { clearTimeout(undoCaptureTimer); undoCaptureTimer = null; lastUndoSnapshot = null; }
    if (!undoStack.length) return;
    var current = snapshotForUndo();
    var prev = undoStack.pop();
    redoStack.push(current);
    applyUndoSnapshot(prev);
  }

  function performRedo() {
    if (!redoStack.length) return;
    var current = snapshotForUndo();
    var next = redoStack.pop();
    undoStack.push(current);
    applyUndoSnapshot(next);
  }

  var EGG_DETAIL_ZOOM_THRESHOLD = 1.5;

  function updateCanvasTransform() {
    canvas.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
    // Keep grid dots aligned with canvas pan
    var gridSize = GRID_SIZE * scale;
    var offX = panX % gridSize;
    var offY = panY % gridSize;
    canvasGrid.style.backgroundSize = gridSize + "px " + gridSize + "px";
    canvasGrid.style.backgroundPosition = offX + "px " + offY + "px";
    // Egg markers reveal labels/photos past a zoom threshold — toggling
    // one class here is cheap on every zoom tick, versus re-rendering
    // every egg's SVG content each time the zoom level changes.
    document.body.classList.toggle("egg-zoomed-in", scale >= EGG_DETAIL_ZOOM_THRESHOLD);
    scheduleImageLOD();
  }

  function applyBoardSize() {

  boardResizeHandle.addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    boardResizeHandle.setPointerCapture(e.pointerId);
    var startX = e.clientX, startY = e.clientY;
    var startW = state.boardSize.width, startH = state.boardSize.height;

    function move(ev) {
      var dx = (ev.clientX - startX) / scale;
      var dy = (ev.clientY - startY) / scale;
      state.boardSize.width = Math.max(400, startW + dx);
      state.boardSize.height = Math.max(300, startH + dy);
      applyBoardSize();
    }

    function up(ev) {
      boardResizeHandle.removeEventListener("pointermove", move);
      boardResizeHandle.removeEventListener("pointerup", up);
      boardResizeHandle.releasePointerCapture(ev.pointerId);
      saveState();
    }

    boardResizeHandle.addEventListener("pointermove", move);
    boardResizeHandle.addEventListener("pointerup", up);
  });
  boardResizeHandle.addEventListener("click", function (e) { e.stopPropagation(); });

  function zoomToFit() {
    var minX = Math.min(0, 0), minY = Math.min(0, 0), maxX = state.boardSize.width, maxY = state.boardSize.height;
    var found = true;

    state.cards.forEach(function (c) {
      if (getCardGroup(c.id)) return;
      minX = Math.min(minX, c.x); minY = Math.min(minY, c.y);
      maxX = Math.max(maxX, c.x + (c.width || 170)); maxY = Math.max(maxY, c.y + (c.height || 120));
      found = true;
    });
    state.images.forEach(function (im) {
      minX = Math.min(minX, im.x); minY = Math.min(minY, im.y);
      maxX = Math.max(maxX, im.x + im.width); maxY = Math.max(maxY, im.y + im.height);
      found = true;
    });
    state.cardGroups.forEach(function (g) {
      var dims = g.viewMode === "table" ? computeTableLayout(g) : computeGroupLayout(g);
      minX = Math.min(minX, g.x); minY = Math.min(minY, g.y);
      maxX = Math.max(maxX, g.x + dims.frameWidth);
      maxY = Math.max(maxY, g.y + (g.collapsed ? GROUP_HEADER_HEIGHT : dims.frameHeight));
      found = true;
    });
    state.shapes.forEach(function (s) {
      minX = Math.min(minX, s.x); minY = Math.min(minY, s.y);
      maxX = Math.max(maxX, s.x + s.width); maxY = Math.max(maxY, s.y + s.height);
      found = true;
    });
    state.containers.forEach(function (c) {
      minX = Math.min(minX, c.x); minY = Math.min(minY, c.y);
      maxX = Math.max(maxX, c.x + c.width); maxY = Math.max(maxY, c.y + c.height);
      found = true;
    });

    if (!found) return;

    var padding = 80;
    var contentW = Math.max(1, maxX - minX + padding * 2);
    var contentH = Math.max(1, maxY - minY + padding * 2);
    var rect = wrap.getBoundingClientRect();
    var scaleX = rect.width / contentW;
    var scaleY = rect.height / contentH;
    var targetScale = Math.max(0.15, Math.min(2, Math.min(scaleX, scaleY)));
    var centerX = (minX + maxX) / 2;
    var centerY = (minY + maxY) / 2;
    var targetPanX = rect.width / 2 - centerX * targetScale;
    var targetPanY = rect.height / 2 - centerY * targetScale;

    var startPanX = panX, startPanY = panY, startScale = scale;
    var duration = 420;
    var startTime = null;

    function ease(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function step(ts) {
      if (!startTime) startTime = ts;
      var t = Math.min(1, (ts - startTime) / duration);
      var e = ease(t);
      panX = startPanX + (targetPanX - startPanX) * e;
      panY = startPanY + (targetPanY - startPanY) * e;
      scale = startScale + (targetScale - startScale) * e;
      updateCanvasTransform();
      if (t < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  }

  // ---- Marquee selection (click-drag on empty canvas) ----
  var isSelecting = false;

  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function liveHighlightSelection(x, y, w, h) {
    document.querySelectorAll(".card, .img-item, .shape-item").forEach(function (el) {
      var id = el.dataset.id;
      if (el.classList.contains("card") && getCardGroup(id)) {
        el.classList.remove("selected");
        return;
      }
      var item = el.classList.contains("card")
        ? state.cards.filter(function (c) { return c.id === id; })[0]
        : el.classList.contains("img-item")
          ? state.images.filter(function (im) { return im.id === id; })[0]
          : state.shapes.filter(function (s) { return s.id === id; })[0];
      if (!item) return;
      el.classList.toggle("selected", rectsOverlap(x, y, w, h, item.x, item.y, item.width, item.height));
    });
    document.querySelectorAll(".card-group-frame").forEach(function (el) {
      var id = el.dataset.id;
      var group = state.cardGroups.filter(function (g) { return g.id === id; })[0];
      if (!group) return;
      var dims = group.viewMode === "table" ? computeTableLayout(group) : computeGroupLayout(group);
      var groupHeight = group.collapsed ? GROUP_HEADER_HEIGHT : dims.frameHeight;
      el.classList.toggle("selected", rectsOverlap(x, y, w, h, group.x, group.y, dims.frameWidth, groupHeight));

  // ---- Copy / paste ----
  var clipboardData = null;

  function copySelection() {
    if (selectedCardIds.size + selectedImageIds.size + selectedShapeIds.size + selectedGroupIds.size === 0) return false;

    var cards = state.cards.filter(function (c) { return selectedCardIds.has(c.id); }).map(function (c) { return JSON.parse(JSON.stringify(c)); });
    var images = state.images.filter(function (im) { return selectedImageIds.has(im.id); }).map(function (im) { return JSON.parse(JSON.stringify(im)); });
    var shapes = state.shapes.filter(function (s) { return selectedShapeIds.has(s.id); }).map(function (s) { return JSON.parse(JSON.stringify(s)); });
    var groups = [];
    var groupCards = [];
    selectedGroupIds.forEach(function (gid) {
      var g = state.cardGroups.filter(function (gr) { return gr.id === gid; })[0];
      if (!g) return;
      groups.push(JSON.parse(JSON.stringify(g)));
      g.cardIds.forEach(function (cid) {
        var c = state.cards.filter(function (cc) { return cc.id === cid; })[0];
        if (c) groupCards.push(JSON.parse(JSON.stringify(c)));
      });
    });

    var copiedCardIds = {};
    cards.forEach(function (c) { copiedCardIds[c.id] = true; });
    groupCards.forEach(function (c) { copiedCardIds[c.id] = true; });
    var connections = state.connections.filter(function (conn) {
      return copiedCardIds[conn.from] && copiedCardIds[conn.to];
    }).map(function (c) { return JSON.parse(JSON.stringify(c)); });

    clipboardData = { cards: cards, images: images, shapes: shapes, groups: groups, groupCards: groupCards, connections: connections };
    return true;
  }

  function pasteClipboard() {
    if (!clipboardData) return false;
    var offset = 28;
    var idMap = {};

    clearSelection();

    clipboardData.cards.forEach(function (c) {
      var newCard = JSON.parse(JSON.stringify(c));
      var oldId = newCard.id;
      newCard.id = uid();
      newCard.x += offset;
      newCard.y += offset;
      newCard.z = getMaxZ() + 1;
      idMap[oldId] = newCard.id;
      state.cards.push(newCard);
      selectedCardIds.add(newCard.id);
    });

    clipboardData.images.forEach(function (im) {
      var newImg = JSON.parse(JSON.stringify(im));
      newImg.id = uid();
      newImg.x += offset;
      newImg.y += offset;
      newImg.z = getMaxZ() + 1;
      state.images.push(newImg);
      selectedImageIds.add(newImg.id);
    });

    clipboardData.shapes.forEach(function (s) {
      var newShape = JSON.parse(JSON.stringify(s));
      newShape.id = uid();
      newShape.x += offset;
      newShape.y += offset;
      newShape.z = getMaxZ() + 1;
      state.shapes.push(newShape);
      selectedShapeIds.add(newShape.id);
    });

    clipboardData.groups.forEach(function (g) {
      var newGroup = JSON.parse(JSON.stringify(g));
      newGroup.id = uid();
      newGroup.x += offset;
      newGroup.y += offset;
      newGroup.z = getMaxZ() + 1;
      newGroup.cardIds = g.cardIds.map(function (oldCardId) {
        var originalCard = clipboardData.groupCards.filter(function (c) { return c.id === oldCardId; })[0];
        if (!originalCard) return null;
        var newCard = JSON.parse(JSON.stringify(originalCard));
        newCard.id = uid();
        idMap[oldCardId] = newCard.id;
        state.cards.push(newCard);
        return newCard.id;
      }).filter(Boolean);
      state.cardGroups.push(newGroup);
      selectedGroupIds.add(newGroup.id);
    });

    clipboardData.connections.forEach(function (conn) {
      var newFrom = idMap[conn.from];
      var newTo = idMap[conn.to];
      if (newFrom && newTo) {
        state.connections.push({ id: uid(), from: newFrom, to: newTo, color: conn.color, style: conn.style });
      }
    });

    saveState();
    refreshCanvas();
    return true;
  }

    var meta = e.metaKey || e.ctrlKey;
    if (!meta) return;
    if (e.key === "c" || e.key === "C") {
      if (copySelection()) e.preventDefault();
    } else if (e.key === "v" || e.key === "V") {
      if (pasteClipboard()) e.preventDefault();

  wrap.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch") return; /* DL TOUCH: touch has its own gestures below */

    if (e.target !== wrap && e.target !== canvas && e.target !== itemsLayer) return;
    if (activeConnectorId) { deselectConnector(); return; }
    isSelecting = true;

    var current = canvasPointFromEvent(e);

    var y = Math.min(selectStart.y, current.y);
    var w = Math.abs(current.x - selectStart.x);
    var h = Math.abs(current.y - selectStart.y);

  // ---- Two-finger scroll pans, pinch (or ctrl/cmd + scroll) zooms ----

  wrap.addEventListener("wheel", function (e) {

    if (e.ctrlKey || e.metaKey) {
      var rect = wrap.getBoundingClientRect();
      var cx = e.clientX - rect.left;
      var cy = e.clientY - rect.top;
      var delta = -e.deltaY * 0.012;
      var newScale = Math.min(5, Math.max(0.15, scale + delta));
      var ratio = newScale / scale;
      panX = cx - (cx - panX) * ratio;
      panY = cy - (cy - panY) * ratio;
      scale = newScale;
    } else {
      panX -= e.deltaX;
      panY -= e.deltaY;
    }
    updateCanvasTransform();
  }, { passive: false });

  function moveOtherSelectedItems(dx, dy, excludeType, excludeId) {

    state.shapes.forEach(function (s) {

    state.cardGroups.forEach(function (g) {

      if (frameEl) { frameEl.style.transition = "none"; frameEl.style.left = g.x + "px"; frameEl.style.top = g.y + "px"; }

  // ---- Dragging helper (shared by cards and images) ----
  function positionNearPoint(el, clientX, clientY) {
    el.style.left = clientX + "px";
    el.style.top = clientY + "px";
    var rect = el.getBoundingClientRect();
    var margin = 8;
    var newLeft = clientX;
    var newTop = clientY;
    if (rect.right > window.innerWidth - margin) newLeft -= (rect.right - (window.innerWidth - margin));
    if (rect.bottom > window.innerHeight - margin) newTop -= (rect.bottom - (window.innerHeight - margin));
    if (newLeft < margin) newLeft = margin;
    if (newTop < margin) newTop = margin;
    el.style.left = newLeft + "px";
    el.style.top = newTop + "px";
  }

  function positionAwayFromItem(el, itemEl) {
    // Temporarily show off-screen to measure
    el.style.visibility = "hidden";
    el.style.left = "-9999px";
    el.style.top = "-9999px";
    el.classList.remove("hidden");
    var popW = el.offsetWidth;
    var popH = el.offsetHeight;
    el.style.visibility = "";

    var itemRect = itemEl ? itemEl.getBoundingClientRect() : { left: window.innerWidth/2, right: window.innerWidth/2, top: window.innerHeight/2, bottom: window.innerHeight/2 };
    var margin = 10;
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var spaceRight  = vw - itemRect.right - margin;
    var spaceLeft   = itemRect.left - margin;
    var spaceBottom = vh - itemRect.bottom - margin;
    var spaceTop    = itemRect.top - margin;

    var left, top;
    if (spaceRight >= popW) {
      left = itemRect.right + margin;
      top  = Math.min(Math.max(margin, itemRect.top), vh - popH - margin);
    } else if (spaceLeft >= popW) {
      left = itemRect.left - popW - margin;
      top  = Math.min(Math.max(margin, itemRect.top), vh - popH - margin);
    } else if (spaceBottom >= popH) {
      top  = itemRect.bottom + margin;
      left = Math.min(Math.max(margin, itemRect.left), vw - popW - margin);
    } else {
      top  = Math.max(margin, itemRect.top - popH - margin);
      left = Math.min(Math.max(margin, itemRect.left), vw - popW - margin);
    }

    el.style.left = left + "px";
    el.style.top  = top  + "px";
  }

  function clearAllTransitionOverrides() {
