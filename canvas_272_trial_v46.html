  document.getElementById("stack-drop-yes").addEventListener("click", function () {
    if (!pendingStackDrop) return;
    var group = state.cardGroups.filter(function (g) { return g.id === pendingStackDrop.groupId; })[0];
    if (group && group.cardIds.indexOf(pendingStackDrop.cardId) === -1) {
      // FLIP: snapshot existing card positions before adding
      var beforePositions = {};
      group.cardIds.forEach(function (id) {
        var el2 = itemsLayer.querySelector('.card[data-id="' + id + '"]');
        if (el2) beforePositions[id] = { top: parseFloat(el2.style.top) };
      });

      group.cardIds.push(pendingStackDrop.cardId);
      saveState();
      refreshCanvas();

      // FLIP: animate existing cards to their new positions
      setTimeout(function () {
        Object.keys(beforePositions).forEach(function (id) {
          var el2 = itemsLayer.querySelector('.card[data-id="' + id + '"]');
          if (!el2) return;
          var newTop = parseFloat(el2.style.top);
          var oldTop = beforePositions[id].top;
          if (Math.abs(newTop - oldTop) < 1) return;
          el2.style.transition = "none";
          el2.style.top = oldTop + "px";
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              el2.style.transition = "";
              el2.style.top = newTop + "px";
            });
          });
        });

        // Pulse frame and pop in new card
        var frameEl = itemsLayer.querySelector('.card-group-frame[data-id="' + group.id + '"]');
        if (frameEl) {
          frameEl.classList.add("stack-just-received");
          frameEl.addEventListener("animationend", function () { frameEl.classList.remove("stack-just-received"); }, { once: true });
        }
        var cardEl = itemsLayer.querySelector('.card[data-id="' + pendingStackDrop.cardId + '"]');
        if (cardEl) {
          cardEl.classList.add("just-joined-stack");
          cardEl.addEventListener("animationend", function () { cardEl.classList.remove("just-joined-stack"); }, { once: true });
        }
      }, 16);
    }
    hideStackDropChip();
  });

  document.getElementById("stack-drop-no").addEventListener("click", hideStackDropChip);

  function getStackFrameAtCanvasPoint(cx, cy, excludeCardId) {
    var found = null;
    state.cardGroups.forEach(function (g) {
      if (g.cardIds.indexOf(excludeCardId) !== -1) return;
      var layout = computeGroupLayout(g);
      var x1 = g.x;
      var y1 = g.y;
      var x2 = g.x + layout.frameWidth;
      var y2 = g.y + (g.collapsed ? GROUP_HEADER_HEIGHT : layout.frameHeight);
      if (cx >= x1 && cx <= x2 && cy >= y1 && cy <= y2) {
        found = g;
      }
    });
    return found;
  }

  function makeDraggable(el, onMove, dragCard, onDragEnd) {
    el.addEventListener("pointerdown", function (e) {
      // For cards, only drag from header — let body clicks through
      if (dragCard && e.target.closest(".card-body")) return;
      e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      el.style.transition = "none";
      el.style.willChange = "left, top";
      var startX = e.clientX, startY = e.clientY;
      var startLeft = parseFloat(el.style.left) || 0;
      var startTop = parseFloat(el.style.top) || 0;
      var moved = false;

      function move(ev) {
        var dx = (ev.clientX - startX) / scale;
        var dy = (ev.clientY - startY) / scale;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
          if (!moved) el.classList.add("is-dragging");
          moved = true;
        }
        var newLeft = startLeft + dx;
        var newTop = startTop + dy;
        if (gridSnapActive) { newLeft = snapVal(newLeft); newTop = snapVal(newTop); }
        el.style.left = newLeft + "px";
        el.style.top = newTop + "px";
        if (onMove) onMove(newLeft, newTop);

        // Stack drop target highlight
        if (dragCard && moved) {
          hideStackDropChip();
          // Check if any corner of the dragged card overlaps a stack
          var cardW = dragCard.width || 160;
          var cardH = dragCard.height || 80;
          var testPoints = [
            { x: newLeft + cardW / 2, y: newTop + cardH / 2 },       // centre
            { x: newLeft + cardW * 0.2, y: newTop + cardH * 0.2 },   // near top-left
            { x: newLeft + cardW * 0.8, y: newTop + cardH * 0.2 },   // near top-right
            { x: newLeft + cardW * 0.2, y: newTop + cardH * 0.8 },   // near bottom-left
            { x: newLeft + cardW * 0.8, y: newTop + cardH * 0.8 }    // near bottom-right
          ];
          var hoveredGroup = null;
          for (var ti = 0; ti < testPoints.length; ti++) {
            hoveredGroup = getStackFrameAtCanvasPoint(testPoints[ti].x, testPoints[ti].y, dragCard.id);
            if (hoveredGroup) break;
          }
          if (hoveredGroup) {
            var frameEl = itemsLayer.querySelector('.card-group-frame[data-id="' + hoveredGroup.id + '"]');
            if (frameEl) frameEl.classList.add("stack-drop-target");
            el._pendingGroup = hoveredGroup;
          } else {
            el._pendingGroup = null;
          }
        }
      }

      function up(ev) {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        el.releasePointerCapture(ev.pointerId);
        el.classList.remove("is-dragging");
        if (moved) {
          el.classList.add("just-landed");
          el.addEventListener("animationend", function () { el.classList.remove("just-landed"); }, { once: true });
        }
        el.style.willChange = "";
        saveState();
        el.dataset.justDragged = moved ? "1" : "0";
        clearAllTransitionOverrides();
        if (moved && onDragEnd) onDragEnd();

        // Show stack drop chip if hovering a group
        if (dragCard && moved && el._pendingGroup) {
          var group = el._pendingGroup;
          el._pendingGroup = null;
          clearStackDropTarget();
          var groupTitle = group.title || "this stack";
          stackDropLabel.textContent = 'Add to "' + groupTitle + '"?';
          pendingStackDrop = { cardId: dragCard.id, groupId: group.id };
          var rect = el.getBoundingClientRect();
          stackDropChip.style.left = (rect.left + rect.width / 2) + "px";
          stackDropChip.style.top = (rect.top + rect.height / 2) + "px";
          stackDropChip.classList.add("visible");
          boardScrollLocked = true;
        } else {
          el._pendingGroup = null;
        }
      }

      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });
  }

  // ---- Connectors ----
  function cardCenter(card) {
    return { x: card.x + card.width / 2, y: card.y + card.height / 2 };
  }

  function itemBounds(id) {
    // Returns { x, y, w, h, cx, cy } for any item
    var card = state.cards.filter(function (c) { return c.id === id; })[0];
    if (card) return { x: card.x, y: card.y, w: card.width, h: card.height, cx: card.x + card.width / 2, cy: card.y + card.height / 2 };
    var shape = (state.shapes || []).filter(function (s) { return s.id === id; })[0];
    if (shape) return { x: shape.x, y: shape.y, w: shape.width, h: shape.height, cx: shape.x + shape.width / 2, cy: shape.y + shape.height / 2 };
    var img = (state.images || []).filter(function (im) { return im.id === id; })[0];
    if (img) return { x: img.x, y: img.y, w: img.width, h: img.height, cx: img.x + img.width / 2, cy: img.y + img.height / 2 };
    var vid = (state.videos || []).filter(function (v) { return v.id === id; })[0];
    if (vid) return { x: vid.x, y: vid.y, w: vid.width, h: vid.height, cx: vid.x + vid.width / 2, cy: vid.y + vid.height / 2 };
    var group = (state.cardGroups || []).filter(function (g) { return g.id === id; })[0];
    if (group) {
      var layout = computeGroupLayout(group);
      return { x: group.x, y: group.y, w: layout.frameWidth, h: layout.frameHeight, cx: group.x + layout.frameWidth / 2, cy: group.y + layout.frameHeight / 2 };
    }
    var container = (state.containers || []).filter(function (c) { return c.id === id; })[0];
    if (container) return { x: container.x, y: container.y, w: container.width, h: container.height, cx: container.x + container.width / 2, cy: container.y + container.height / 2 };
    return null;
  }

  function itemCenter(id) {
    var b = itemBounds(id);
    return b ? { x: b.cx, y: b.cy } : null;
  }

  function edgePoint(bounds, targetX, targetY) {
    // Find where the line from bounds centre toward (targetX, targetY) exits the bounds rect
    var cx = bounds.cx, cy = bounds.cy;
    var dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    var hw = bounds.w / 2, hh = bounds.h / 2;
    var scaleX = dx !== 0 ? hw / Math.abs(dx) : Infinity;
    var scaleY = dy !== 0 ? hh / Math.abs(dy) : Infinity;
    var s = Math.min(scaleX, scaleY);
    return { x: cx + dx * s, y: cy + dy * s };
  }

  function connectionPoints(fromId, toId) {
    var fb = itemBounds(fromId);
    var tb = itemBounds(toId);
    if (!fb || !tb) return null;
    // Always use edge points so arrowheads land on borders
    var a = edgePoint(fb, tb.cx, tb.cy);
    var b = edgePoint(tb, fb.cx, fb.cy);
    return { a: a, b: b };
  }

  function itemFromPoint(clientX, clientY, excludeId) {
    var el = document.elementFromPoint(clientX, clientY);
    if (!el) return null;
    var card = el.closest(".card");
    if (card && card.dataset.id !== excludeId) return card.dataset.id;
    var shape = el.closest(".shape-item");
    if (shape && shape.dataset.id !== excludeId) return shape.dataset.id;
    var img = el.closest(".img-item");
    if (img && img.dataset.id !== excludeId) return img.dataset.id;
    var frame = el.closest(".card-group-frame");
    if (frame && frame.dataset.id !== excludeId) return frame.dataset.id;
    var container = el.closest(".container-box");
    if (container && container.dataset.id !== excludeId) return container.dataset.id;
    return null;
  }

  function canvasPointFromEvent(e) {
    var rect = wrap.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - panX) / scale,
      y: (e.clientY - rect.top - panY) / scale
    };
  }

  function addConnectionDots(el, itemId) {
    ["top", "right", "bottom", "left"].forEach(function(pos) {
      var dot = document.createElement("div");
      dot.className = "conn-dot conn-dot-" + pos;
      dot.dataset.pos = pos;
      el.appendChild(dot);
      dot.addEventListener("pointerdown", function(e) { startConnection(e, itemId, dot); });
      dot.addEventListener("click", function(e) { e.stopPropagation(); });
    });
    if (getComputedStyle(el).pointerEvents === "none") {
      el.style.pointerEvents = "auto";
    }
  }

  function startConnection(e, fromId, handleEl) {
    e.stopPropagation();
    handleEl.setPointerCapture(e.pointerId);
    var fb = itemBounds(fromId);
    // Use the specific edge point of the clicked dot
    var pos = handleEl.dataset && handleEl.dataset.pos;
    var startPt;
    if (pos && fb) {
      var edgePts = {
        top:    { x: fb.x + fb.w / 2, y: fb.y },
        right:  { x: fb.x + fb.w,     y: fb.y + fb.h / 2 },
        bottom: { x: fb.x + fb.w / 2, y: fb.y + fb.h },
        left:   { x: fb.x,            y: fb.y + fb.h / 2 }
      };
      startPt = edgePts[pos] || itemCenter(fromId);
    } else {
      startPt = itemCenter(fromId);
    }

    var tempLine = document.createElementNS(SVG_NS, "line");
    tempLine.setAttribute("x1", startPt.x);
    tempLine.setAttribute("y1", startPt.y);
    tempLine.setAttribute("x2", startPt.x);
    tempLine.setAttribute("y2", startPt.y);
    tempLine.setAttribute("stroke", "#8A7D68");
    tempLine.setAttribute("stroke-width", "1.5");
    tempLine.setAttribute("stroke-dasharray", "4 4");
    connectorLayer.appendChild(tempLine);

    function move(ev) {
      var p = canvasPointFromEvent(ev);
      // Update start to edge point as target moves
      var fb = itemBounds(fromId);
      var start = fb ? edgePoint(fb, p.x, p.y) : startPt;
      tempLine.setAttribute("x1", start.x);
      tempLine.setAttribute("y1", start.y);
      tempLine.setAttribute("x2", p.x);
      tempLine.setAttribute("y2", p.y);
    }

    function up(ev) {
      handleEl.removeEventListener("pointermove", move);
      handleEl.removeEventListener("pointerup", up);
      handleEl.releasePointerCapture(ev.pointerId);
      connectorLayer.removeChild(tempLine);

      var toId = itemFromPoint(ev.clientX, ev.clientY, fromId);
      if (toId) {
        var alreadyExists = state.connections.some(function (c) {
          return (c.from === fromId && c.to === toId) || (c.from === toId && c.to === fromId);
        });
        if (!alreadyExists) {
          state.connections.push({ id: uid(), from: fromId, to: toId, color: "taupe", style: "solid" });
          saveState();
        }
      }
      renderConnections();
    }

    handleEl.addEventListener("pointermove", move);
    handleEl.addEventListener("pointerup", up);
  }

  function isCardConnectorHidden(id) {
    var card = state.cards.filter(function (c) { return c.id === id; })[0];
    if (!card) return false; // non-card items are never hidden
    var group = getCardGroup(id);
    if (!group) return false;
    if (group.collapsed) return true;
    var minSize = estimateMinCardSize(card);
    return card.height <= minSize.minH + 20;
  }

  var activeConnectorId = null;

  function selectConnector(connId) {
    activeConnectorId = connId;
    renderConnections();
  }

  function deselectConnector() {
    activeConnectorId = null;
    renderConnections();
  }

  function renderConnections() {
    connectorLinesGroup.innerHTML = "";
    connectorHitsGroup.innerHTML = "";
    document.querySelectorAll(".conn-bend-handle").forEach(function(el){ el.parentNode && el.parentNode.removeChild(el); });

    // Per-connector colored markers (arrows)
    var defs = connectorLayer.querySelector("defs");

    state.connections.forEach(function (conn) {
      if (isCardConnectorHidden(conn.from) || isCardConnectorHidden(conn.to)) return;
      var pts = connectionPoints(conn.from, conn.to);
      if (!pts) return;
      var a = pts.a, b = pts.b;
      var color = CONNECTOR_COLORS[conn.color] || CONNECTOR_COLORS.taupe;
      var dash = CONNECTOR_DASH[conn.style] || CONNECTOR_DASH.solid;
      var arrow = conn.arrow || "none";
      var isSelected = conn.id === activeConnectorId;

      // Control point for bezier
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var cx = (conn.bendX !== undefined) ? conn.bendX : mx;
      var cy = (conn.bendY !== undefined) ? conn.bendY : my;
      var isBent = conn.bendX !== undefined;

      // Shorten endpoints to leave room for arrowheads
      var ARROW_OFFSET = 9;
      function shortenPt(from, to, offset) {
        var dx = to.x - from.x, dy = to.y - from.y;
        var len = Math.sqrt(dx*dx + dy*dy);
        if (len < offset * 2) return to;
        return { x: to.x - dx/len * offset, y: to.y - dy/len * offset };
      }
      var drawA = (arrow === "start" || arrow === "both") ? shortenPt(b, a, ARROW_OFFSET) : a;
      var drawB = (arrow === "end"   || arrow === "both") ? shortenPt(a, b, ARROW_OFFSET) : b;

      var pathD = isBent
        ? "M " + drawA.x + " " + drawA.y + " Q " + cx + " " + cy + " " + drawB.x + " " + drawB.y
        : "M " + drawA.x + " " + drawA.y + " L " + drawB.x + " " + drawB.y;

      // Per-connector arrow markers with correct colour
      var markEndId = null, markStartId = null;
      if (arrow !== "none" && defs) {
        var safeColor = color.replace(/[^a-zA-Z0-9]/g, "");
        if (arrow === "end" || arrow === "both") {
          markEndId = "arw-e-" + safeColor;
          if (!defs.querySelector("#" + markEndId)) {
            var m = document.createElementNS(SVG_NS, "marker");
            m.setAttribute("id", markEndId);
            m.setAttribute("markerWidth", "12"); m.setAttribute("markerHeight", "12");
            m.setAttribute("refX", "9"); m.setAttribute("refY", "6");
            m.setAttribute("orient", "auto");
            m.setAttribute("markerUnits", "userSpaceOnUse");
            var p = document.createElementNS(SVG_NS, "path");
            p.setAttribute("d", "M1,1 L10,6 L1,11");
            p.setAttribute("fill", "none"); p.setAttribute("stroke", color);
            p.setAttribute("stroke-width", "2.5");
            p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
            m.appendChild(p); defs.appendChild(m);
          }
        }
        if (arrow === "start" || arrow === "both") {
          markStartId = "arw-s-" + safeColor;
          if (!defs.querySelector("#" + markStartId)) {
            var m2 = document.createElementNS(SVG_NS, "marker");
            m2.setAttribute("id", markStartId);
            m2.setAttribute("markerWidth", "12"); m2.setAttribute("markerHeight", "12");
            m2.setAttribute("refX", "3"); m2.setAttribute("refY", "6");
            m2.setAttribute("orient", "auto");
            m2.setAttribute("markerUnits", "userSpaceOnUse");
            var p2 = document.createElementNS(SVG_NS, "path");
            p2.setAttribute("d", "M11,1 L2,6 L11,11");
            p2.setAttribute("fill", "none"); p2.setAttribute("stroke", color);
            p2.setAttribute("stroke-width", "2.5");
            p2.setAttribute("stroke-linecap", "round"); p2.setAttribute("stroke-linejoin", "round");
            m2.appendChild(p2); defs.appendChild(m2);
          }
        }
      }

      // Visible path
      var visible = document.createElementNS(SVG_NS, "path");
      visible.setAttribute("d", pathD);
      visible.setAttribute("stroke", color);
      visible.setAttribute("stroke-width", isSelected ? "4" : "3");
      visible.setAttribute("stroke-linecap", "round");
      visible.setAttribute("stroke-dasharray", dash);
      visible.setAttribute("fill", "none");
      visible.setAttribute("filter", "url(#line-shadow)");
      if (markEndId) visible.setAttribute("marker-end", "url(#" + markEndId + ")");
      if (markStartId) visible.setAttribute("marker-start", "url(#" + markStartId + ")");
      visible.setAttribute("data-conn-id", conn.id);
      visible.style.pointerEvents = "none";
      connectorLinesGroup.appendChild(visible);

      // Selection highlight
      if (isSelected) {
        var sel = document.createElementNS(SVG_NS, "path");
        sel.setAttribute("d", pathD);
        sel.setAttribute("stroke", "rgba(74,144,226,0.3)");
        sel.setAttribute("stroke-width", "8");
        sel.setAttribute("fill", "none");
        sel.style.pointerEvents = "none";
        connectorLinesGroup.insertBefore(sel, visible);
      }

      // Hit path — left click selects, right click opens menu
      var hit = document.createElementNS(SVG_NS, "path");
      hit.setAttribute("d", pathD);
      hit.setAttribute("stroke", "transparent");
      hit.setAttribute("stroke-width", "16");
      hit.setAttribute("fill", "none");
      hit.setAttribute("data-conn-id", conn.id);
      hit.style.pointerEvents = "stroke";
      hit.style.cursor = "pointer";
      hit.addEventListener("click", function (e) {
        e.stopPropagation();
        if (activeConnectorId === conn.id) {
          deselectConnector();
        } else {
          closeConnectorPopup();
          selectConnector(conn.id);
        }
      });
      hit.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
        selectConnector(conn.id);
        openConnectorPopup(conn, e.clientX, e.clientY);
      });
      connectorHitsGroup.appendChild(hit);

      // Bend handle — only show when selected
      if (isSelected) {
        var wrap = document.getElementById("canvas");
        var wrapRect = wrap.getBoundingClientRect();
        var bendHandle = document.createElement("div");
        bendHandle.className = "conn-bend-handle";
        // Place at visual midpoint of bezier curve (t=0.5): 0.25*a + 0.5*cp + 0.25*b
        var hx = 0.25*drawA.x + 0.5*cx + 0.25*drawB.x;
        var hy = 0.25*drawA.y + 0.5*cy + 0.25*drawB.y;
        bendHandle.style.left = hx + "px";
        bendHandle.style.top  = hy + "px";
        wrap.appendChild(bendHandle);

        (function(conn, bendHandle) {
          bendHandle.addEventListener("pointerdown", function(e) {
            e.stopPropagation();
            bendHandle.setPointerCapture(e.pointerId);
            bendHandle.style.cursor = "grabbing";
            // Calculate offset from pointer to handle centre in canvas coords
            var wr = wrap.getBoundingClientRect();
            var startHx = (e.clientX - wr.left - panX) / scale;
            var startHy = (e.clientY - wr.top  - panY) / scale;
            var handleCx = parseFloat(bendHandle.style.left);
            var handleCy = parseFloat(bendHandle.style.top);
            var offsetX = handleCx - startHx;
            var offsetY = handleCy - startHy;
            function move(ev) {
              var hx = (ev.clientX - wr.left - panX) / scale + offsetX;
              var hy = (ev.clientY - wr.top  - panY) / scale + offsetY;
              bendHandle.style.left = hx + "px";
              bendHandle.style.top  = hy + "px";
              var freshPts = connectionPoints(conn.from, conn.to);
              if (freshPts) {
                var fa = freshPts.a, fb2 = freshPts.b;
                var ar = conn.arrow || "none";
                var OFF = 9;
                function shPt(from, to) {
                  var dx = to.x-from.x, dy = to.y-from.y, len = Math.sqrt(dx*dx+dy*dy);
                  return len < OFF*2 ? to : { x: to.x-dx/len*OFF, y: to.y-dy/len*OFF };
                }
                var da = (ar==="start"||ar==="both") ? shPt(fb2, fa) : fa;
                var db = (ar==="end"  ||ar==="both") ? shPt(fa, fb2) : fb2;
                var cpx = 2*hx - 0.5*da.x - 0.5*db.x;
                var cpy = 2*hy - 0.5*da.y - 0.5*db.y;
                conn.bendX = cpx; conn.bendY = cpy;
                var newD = "M "+da.x+" "+da.y+" Q "+cpx+" "+cpy+" "+db.x+" "+db.y;
                connectorLinesGroup.querySelectorAll("path[data-conn-id='"+conn.id+"']").forEach(function(p){ p.setAttribute("d", newD); });
                connectorHitsGroup.querySelectorAll("path[data-conn-id='"+conn.id+"']").forEach(function(p){ p.setAttribute("d", newD); });
              }
            }
            function up(ev) {
              bendHandle.removeEventListener("pointermove", move);
              bendHandle.removeEventListener("pointerup", up);
              bendHandle.releasePointerCapture(ev.pointerId);
              bendHandle.style.cursor = "grab";
              saveState();
              renderConnections();
            }
            bendHandle.addEventListener("pointermove", move);
            bendHandle.addEventListener("pointerup", up);
          });
          bendHandle.addEventListener("dblclick", function(e) {
            e.stopPropagation();
            delete conn.bendX; delete conn.bendY;
            saveState();
            renderConnections();
          });
        })(conn, bendHandle);
      }
    });
  }

  function openConnectorPopup(conn, clientX, clientY) {
    closeStackMenu();
    closeCanvasColorPopup();
    closeGroupCreatePopup();
    boardScrollLocked = true;
    connectorHitsGroup.style.pointerEvents = "none";
    document.querySelectorAll(".conn-color-swatch").forEach(function (sw) {
      sw.classList.toggle("selected", sw.dataset.color === (conn.color || "taupe"));
    });
    document.querySelectorAll(".conn-style-btn").forEach(function (btn) {
      btn.classList.toggle("selected", btn.dataset.style === (conn.style || "solid"));
    });
    document.querySelectorAll(".conn-arrow-btn").forEach(function (btn) {
      btn.classList.toggle("selected", btn.dataset.arrow === (conn.arrow || "none"));
    });
    connectorPopup.classList.remove("hidden");
    activeConnectionId = conn.id;
    activeConnectorId = conn.id;
    positionNearPoint(connectorPopup, clientX, clientY);
  }

  function closeConnectorPopup() {
    connectorPopup.classList.add("hidden");
    activeConnectionId = null;
    boardScrollLocked = false;
    connectorHitsGroup.style.pointerEvents = "all";
  }


  document.querySelectorAll(".conn-color-swatch").forEach(function (sw) {
    sw.addEventListener("click", function (e) {
      e.stopPropagation();
      var conn = state.connections.filter(function (c) { return c.id === activeConnectionId; })[0];
      if (conn) {
        conn.color = sw.dataset.color;
        saveState();
        renderConnections();
      }
      closeConnectorPopup();
    });
  });

  document.querySelectorAll(".conn-style-btn").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var conn = state.connections.filter(function (c) { return c.id === activeConnectionId; })[0];
      if (conn) {
        conn.style = btn.dataset.style;
        saveState();
        renderConnections();
      }
      closeConnectorPopup();
    });
  });

  document.querySelectorAll(".conn-arrow-btn").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var conn = state.connections.filter(function (c) { return c.id === activeConnectionId; })[0];
      if (conn) {
        conn.arrow = btn.dataset.arrow;
        saveState();
        renderConnections();
        document.querySelectorAll(".conn-arrow-btn").forEach(function(b){ b.classList.toggle("selected", b.dataset.arrow === btn.dataset.arrow); });
      }
    });
  });

  document.getElementById("connector-delete").addEventListener("click", function (e) {
    e.stopPropagation();

    var color2 = (shape && shape.color2) ? (SHAPE_COLORS[shape.color2] || null) : null;

    var parent = visual || fillEl.parentNode;
    if (parent) {
      var old = parent.querySelector(".shape-svg-outline");
      if (old) parent.removeChild(old);
    }

    // Shot plan shapes — render as SVG icons, not clip-paths
    if (type.indexOf("fp-") === 0) {
      fillEl.style.clipPath = "none";
      fillEl.style.borderRadius = "0";
      fillEl.style.background = "none";
      // Remove old fp svg
      if (parent) {
        var oldFp = parent.querySelector(".fp-shape-svg");
        if (oldFp) parent.removeChild(oldFp);
      }
      var fpSvg = buildFpShapeSVG(type, color, fillStyle, shape);
      if (fpSvg && parent) {
        fpSvg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;";
        fpSvg.classList.add("fp-shape-svg");
        parent.appendChild(fpSvg);
      }
      return;
    }

    // Border radius / clip path
    if (type === "rectangle") {
      var radius = Math.round(d * 50);
      fillEl.style.borderRadius = radius + "px";
      fillEl.style.clipPath = "none";
    } else if (type === "circle") {
      var rx = Math.round(Math.max(10, d * 100));
      fillEl.style.borderRadius = rx + "% / 50%";
      fillEl.style.clipPath = "none";
    } else {
      fillEl.style.borderRadius = "0";
      fillEl.style.clipPath = getDeformClipPath(typeof shape === "string" ? { type: shape } : shape);
    }

    var isClipped = fillEl.style.clipPath && fillEl.style.clipPath !== "none";

    if (fillStyle === "solid") {
      fillEl.style.background = fillColor;
      fillEl.style.border = "none";
      fillEl.style.outline = "none";
    } else {

      fillEl.style.border = "none";
      fillEl.style.outline = "none";

  function applyShapeFrost(shape) {
    var shapeEl = itemsLayer.querySelector('.shape-item[data-id="' + shape.id + '"]');
    if (!shapeEl) return;
    var visual = shapeEl.querySelector(".shape-visual");
    var fill = shapeEl.querySelector(".shape-fill");
    var frostEl = shapeEl.querySelector(".shape-frost");

    if (shape.frost && shape.frost > 0) {
      var frost = shape.frost;
      var opacity = (shape.opacity !== undefined) ? shape.opacity : 1;

      // Control transparency via fill opacity only — don't touch background
      if (fill) {
        var fillAlpha = Math.max(0.08, 1 - frost * 0.75);
        fill.style.opacity = (fillAlpha * opacity).toFixed(2);
      }

      if (!frostEl) {
        frostEl = document.createElement("div");
        frostEl.className = "shape-frost";
        var container = visual || shapeEl;
        container.appendChild(frostEl);
      }

      var sheenAlpha = (frost * 0.55 * opacity).toFixed(2);
      var glowAlpha = (frost * 0.12 * opacity).toFixed(2);
      var edgeAlpha = (frost * 0.8 * opacity).toFixed(2);
      frostEl.style.background =
        "linear-gradient(160deg, rgba(255,255,255," + sheenAlpha + ") 0%, rgba(255,255,255,0) 55%)";
      frostEl.style.boxShadow =
        "inset 0 1px 0 rgba(255,255,255," + edgeAlpha + "), " +
        "inset 0 0 20px rgba(255,255,255," + glowAlpha + ")";
      if (fill) {
        frostEl.style.borderRadius = fill.style.borderRadius || "";
        frostEl.style.clipPath = fill.style.clipPath || "";
      }

    } else {
      if (frostEl) { frostEl.parentNode.removeChild(frostEl); }
      if (fill) {
        fill.style.opacity = (shape.opacity !== undefined && shape.opacity < 1) ? shape.opacity : "";
      }
    }
  }

      var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return r + "," + g + "," + b;
    }
    var rgb = hexToRgb(baseHex);
    var rgb2 = color2 ? hexToRgb(color2) : null;

    var bgOpacity = opacity * (fillStyle === "solid" ? 0.18 : 0);
    var borderColor = "rgba(" + rgb + "," + Math.min(1, opacity * 0.7) + ")";

    if (fillStyle === "solid") {
      if (color2 && rgb2) {
        el.style.background = "linear-gradient(135deg, rgba(" + rgb + "," + bgOpacity + ") 0%, rgba(" + rgb2 + "," + bgOpacity + ") 100%)";
      } else {
        el.style.background = "rgba(" + rgb + "," + bgOpacity + ")";
      }
    } else {
      el.style.background = "transparent";
    }

    var borderStyle = fillStyle === "outline-dashed" ? "dashed" : fillStyle === "outline-dotted" ? "dotted" : "solid";
    el.style.borderColor = borderColor;
    el.style.borderStyle = borderStyle;
    el.style.opacity = "";
  }

  function renderContainer(container) {
    var el = document.createElement("div");
    el.className = "container-box" + (selectedContainerIds.has(container.id) ? " selected" : "");
    el.style.left = container.x + "px";
    el.style.top = container.y + "px";
    el.style.width = container.width + "px";
    el.style.height = container.height + "px";
    el.dataset.id = container.id;
    applyContainerStyle(el, container);

    var label = document.createElement("input");
    label.className = "container-label";
    label.placeholder = "Container";
    label.value = container.title || "";
    label.style.width = Math.max(60, container.width) + "px";
    label.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    label.addEventListener("click", function (e) { e.stopPropagation(); });
    label.addEventListener("input", function () { container.title = label.value; });
    label.addEventListener("change", function () { saveState(); });
    el.appendChild(label);

    var handle = document.createElement("div");
    handle.className = "resize-handle";
    handle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    el.appendChild(handle);

    itemsLayer.appendChild(el);

    function isWithinContainer(x, y, w, h) {
      var ccx = x + (w || 0) / 2;
      var ccy = y + (h || 0) / 2;
      return ccx >= container.x && ccx <= container.x + container.width &&
             ccy >= container.y && ccy <= container.y + container.height;
    }

    el.addEventListener("pointerdown", function (e) {
      if (e.target === label) return;
      e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      el.style.transition = "none";

      // Selection
      if (!e.shiftKey) clearSelection();
      selectedContainerIds.add(container.id);
      el.classList.add("selected");

      var startX = e.clientX, startY = e.clientY;
      var startCX = container.x, startCY = container.y;

      var members = [];
      var groupCardIds = {};
      state.cardGroups.forEach(function (g) {
        var layout = computeGroupLayout(g);
        var fw = layout.frameWidth, fh = layout.frameHeight;
        if (isWithinContainer(g.x, g.y, fw, fh)) {
          members.push({ item: g, sel: ".card-group-frame", startX: g.x, startY: g.y, isGroup: true });
          g.cardIds.forEach(function (cid) { groupCardIds[cid] = true; });
        }
      });
      state.cards.forEach(function (c) {
        if (getCardGroup(c.id)) return;
        if (groupCardIds[c.id]) return;
        if (isWithinContainer(c.x, c.y, c.width || 170, c.height || 90)) members.push({ item: c, sel: ".card", startX: c.x, startY: c.y });
      });
      state.images.forEach(function (im) {
        if (isWithinContainer(im.x, im.y, im.width, im.height)) members.push({ item: im, sel: ".img-item", startX: im.x, startY: im.y });
      });
      state.shapes.forEach(function (s) {
        if (isWithinContainer(s.x, s.y, s.width, s.height)) members.push({ item: s, sel: ".shape-item", startX: s.x, startY: s.y });
      });

      function move(ev) {
        var dx = (ev.clientX - startX) / scale;
        var dy = (ev.clientY - startY) / scale;
        container.x = startCX + dx;
        container.y = startCY + dy;
        el.style.left = container.x + "px";
        el.style.top = container.y + "px";

        members.forEach(function (m) {
          m.item.x = m.startX + dx;
          m.item.y = m.startY + dy;
          if (m.isGroup) {
            var frameEl = itemsLayer.querySelector('.card-group-frame[data-id="' + m.item.id + '"]');
            if (frameEl) { frameEl.style.transition = "none"; frameEl.style.left = m.item.x + "px"; frameEl.style.top = m.item.y + "px"; }
            syncGroupDashedBorder(m.item.id);
            var layout = computeGroupLayout(m.item);
            layout.rows.forEach(function (row) {
              var cardEl = itemsLayer.querySelector('.card[data-id="' + row.card.id + '"]');
              if (cardEl) { cardEl.style.transition = "none"; cardEl.style.left = row.x + "px"; cardEl.style.top = row.y + "px"; }
            });
          } else {
            var memberEl = itemsLayer.querySelector(m.sel + '[data-id="' + m.item.id + '"]');
            if (memberEl) { memberEl.style.transition = "none"; memberEl.style.left = m.item.x + "px"; memberEl.style.top = m.item.y + "px"; }
          }
        });
        renderConnections();
      }

      function up(ev) {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        el.releasePointerCapture(ev.pointerId);
        saveState();
        clearAllTransitionOverrides();
      }

      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });

    handle.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      el.style.transition = "none";
      var startX = e.clientX, startY = e.clientY;
      var startW = container.width, startH = container.height;

      function move(ev) {
        var dx = (ev.clientX - startX) / scale;
        var dy = (ev.clientY - startY) / scale;
        container.width = Math.max(80, snapVal(startW + dx));
        container.height = Math.max(60, snapVal(startH + dy));
        el.style.width = container.width + "px";
        el.style.height = container.height + "px";
        label.style.width = Math.max(60, container.width) + "px";
      }

      function up(ev) {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.releasePointerCapture(ev.pointerId);
        saveState();
        clearAllTransitionOverrides();
      }

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
    handle.addEventListener("click", function (e) { e.stopPropagation(); });

    el.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openStackMenu(container, "container", e.clientX, e.clientY);
    });

    addConnectionDots(el, container.id);
    return el;
  }

  function deleteCanvasItem(item, type) {
    if (type === "image") {
      var imgIdx = state.images.indexOf(item);
      if (imgIdx !== -1) state.images.splice(imgIdx, 1);
    } else if (type === "shape") {
      var shapeIdx = state.shapes.indexOf(item);
      if (shapeIdx !== -1) state.shapes.splice(shapeIdx, 1);
    } else if (type === "container") {
      var containerIdx = state.containers.indexOf(item);
      if (containerIdx !== -1) state.containers.splice(containerIdx, 1);
    } else if (type === "textNote") {
      var noteIdx = state.textNotes.indexOf(item);
      if (noteIdx !== -1) state.textNotes.splice(noteIdx, 1);
      selectedTextNoteIds.delete(item.id);
    } else {
      return;
    }
    // Clean up any connections involving this item
    state.connections = state.connections.filter(function (c) {
      return c.from !== item.id && c.to !== item.id;
    });
    saveState();
    refreshCanvas();
  }

  // ---- Block system ----
  var VALID_CHORD_RE = /^[A-G][#b]?(m|maj|min|sus|aug|dim|add|M)?[0-9]*(\/[A-G][#b]?)?$/;
  function repairMisparsedSectionLabels(card) {
    if (!card.blocks) return;
    card.blocks.forEach(function (block) {
      if (block.type !== "song" || !block.verses) return;
      var repaired = [];
      var current = null; // verse currently being built

      function startVerse(label) {
        current = { label: label, pairs: [] };
        repaired.push(current);
      }

      block.verses.forEach(function (verse) {
        startVerse(verse.label);
        (verse.pairs || []).forEach(function (pair) {
          var isMisparsedLabel =
            pair.lyric === "" &&
            pair.chords && pair.chords.length === 1 &&
            pair.chords[0].offset === 0 &&
            !VALID_CHORD_RE.test(pair.chords[0].text);
          if (isMisparsedLabel) {
            startVerse(pair.chords[0].text);
          } else {
            current.pairs.push(pair);
          }
        });
      });

      block.verses = repaired.filter(function (v) { return v.pairs.length || v.label; });
    });
  }

  function migrateCardToBlocks(card) {
    if (card.blocks) { repairMisparsedSectionLabels(card); return; }
    card.blocks = [];
    if (card.notes && card.notes.trim()) {
      card.blocks.push({ id: uid(), type: "text", content: card.notes });
    }
    if (card.images && card.images.length) {
      card.blocks.push({ id: uid(), type: "image", images: card.images.slice() });
    }
    // No default empty block — user adds blocks as needed
  }

  function saveBlocksToCard(card) {
    if (!card.blocks) return;
    // Keep legacy fields in sync for canvas rendering
    var textParts = [];
    card.images = [];
    card.blocks.forEach(function (b) {
      if (b.type === "text") textParts.push(b.content || "");
      if (b.type === "image") card.images = card.images.concat(b.images || []);
      if (b.type === "song") {
        textParts.push(songBlockToRaw(b));
      }
      if (b.type === "screenplay" && b.lines) {
        textParts.push(b.lines.map(function (l) { return l.text; }).filter(Boolean).join("\n"));
      }
      if (b.type === "contact" && b.name) {
        textParts.push([b.name, b.role, b.org, b.email, b.phone].filter(Boolean).join(", "));
      }
    });
    card.notes = textParts.join("\n\n");
  }

  // ---- Song parsing / serialising ----
  // Storage format: array of verse objects
  // verse: { label: string|null, pairs: [{chords: [{text, offset}], lyric: string}] }
  // Raw markup format: [Chord]lyric text  (Ultimate Guitar style)

  // ---- Chord fingering table parser ----
  // Handles UG-style "Name: fretstring" blocks, e.g.
  //   D:     xx0232     G/B:    x20033
  //   Dsus4: xx0233     A7sus4: x02033
  // fretstring is 6 chars, low-E to high-e, each x|digit. Multiple entries
  // may share a line separated by whitespace. Frets 10+ aren't representable
  // in this dense single-char format, so we cap interpretation at 0-9 and
  // skip lines that don't cleanly match — better to skip than guess wrong.
  var CHORD_NAME_RE = "[A-G][#b]?[A-Za-z0-9]*(?:/[A-G][#b]?[A-Za-z0-9]*)?";
  var FINGERING_ENTRY_RE = new RegExp("(" + CHORD_NAME_RE + "):\\s*([x0-9]{6})", "g");

  function parseFingeringTable(text) {
    var results = [];
    var m;
    FINGERING_ENTRY_RE.lastIndex = 0;
    while ((m = FINGERING_ENTRY_RE.exec(text)) !== null) {
      var name = m[1];
      var fretStr = m[2];
      // fretStr is low-E to high-e already (left to right as printed)
      var frets = fretStr.split("").map(function (ch) {
        return ch === "x" ? -1 : parseInt(ch, 10);
      });
      // Determine sensible baseFret/numFrets window for display
      var soundingFrets = frets.filter(function (f) { return f > 0; });
      var maxFret = soundingFrets.length ? Math.max.apply(null, soundingFrets) : 0;
      var minFret = soundingFrets.length ? Math.min.apply(null, soundingFrets) : 1;
      var baseFret = (minFret > 3) ? minFret : 1;
      var numFrets = Math.max(4, (maxFret - baseFret + 1));
      if (numFrets > 6) numFrets = 6;
      results.push({
        name: name,
        // stored high-e first to match the rest of the chord data convention
        frets: frets.slice().reverse(),
        baseFret: baseFret,
        numFrets: numFrets,
        barre: null
      });
    }
    return results;
  }

  function importFingeringTable(text) {
    var entries = parseFingeringTable(text);
    if (!entries.length) return 0;
    if (!state.customChords) state.customChords = {};
    entries.forEach(function (e) {
      var entry = state.customChords[e.name];
      if (!entry) {
        entry = { default: null, voicings: [] };
        state.customChords[e.name] = entry;
      }
      var vid = uid();
      entry.voicings.push({
        id: vid,
        frets: e.frets,
        baseFret: e.baseFret,
        numFrets: e.numFrets,
        barre: e.barre
      });
      entry.default = vid; // most recently imported becomes the suggested voicing
    });
    return entries.length;
  }

  function flashChordImportToast(count) {
    var toast = document.createElement("div");
    toast.className = "chord-import-toast";
    toast.textContent = count === 1 ? "Saved 1 chord voicing" : "Saved " + count + " chord voicings";
    document.body.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add("show"); });
    setTimeout(function () {
      toast.classList.remove("show");
      setTimeout(function () { toast.remove(); }, 300);
    }, 2200);
  }

  function extractAndImportFingeringLines(text) {
    var fingeringLineRe = new RegExp("^(\\s*" + CHORD_NAME_RE + ":\\s*[x0-9]{6}\\s*)+$");
    var lines = text.split("\n");
    var lyricLines = [];
    var fingeringText = [];
    lines.forEach(function (line) {
      if (fingeringLineRe.test(line) && line.trim()) {
        fingeringText.push(line);
      } else {
        lyricLines.push(line);
      }
    });
    var count = fingeringText.length ? importFingeringTable(fingeringText.join("\n")) : 0;
    return { lyricText: lyricLines.join("\n"), importedCount: count };
  }

  // ---- Chord transposition ----
  var CHROMATIC_SHARP = ["A","A#","B","C","C#","D","D#","E","F","F#","G","G#"];
  var CHROMATIC_FLAT  = ["A","Bb","B","C","Db","D","Eb","E","F","Gb","G","Ab"];
  var NOTE_TO_INDEX = {
    "A":0, "A#":1, "Bb":1, "B":2, "Cb":2, "B#":3, "C":3, "C#":4, "Db":4,
    "D":5, "D#":6, "Eb":6, "E":7, "Fb":7, "E#":8, "F":8, "F#":9, "Gb":9,
    "G":10, "G#":11, "Ab":11
  };
  var TRANSPOSE_ROOT_RE = /^([A-G][#b]?)(.*)$/;

  function transposeChordName(name, semitones, preferFlats) {
    if (!semitones) return name;
    var parts = name.split("/");
    var transposedParts = parts.map(function (part, idx) {
      var m = TRANSPOSE_ROOT_RE.exec(part);
      if (!m) return part; // not a recognisable note root — leave untouched
      var root = m[1];
      var rest = m[2];
      var idx0 = NOTE_TO_INDEX[root];
      if (idx0 === undefined) return part;
      var newIdx = ((idx0 + semitones) % 12 + 12) % 12;
      var newRoot = preferFlats ? CHROMATIC_FLAT[newIdx] : CHROMATIC_SHARP[newIdx];
      return newRoot + rest;
    });
    return transposedParts.join("/");
  }

  function transposeSongBlock(block, semitones) {
    if (!semitones || !block.verses) return;
    // Use flats if the song's key/most common roots look flat-flavoured;
    // simplest reliable heuristic: keep sharps unless original chords already use flats
    var usesFlats = false;
    (block.verses || []).forEach(function (verse) {
      (verse.pairs || []).forEach(function (pair) {
        (pair.chords || []).forEach(function (c) {
          if (c.text && c.text.indexOf("b") !== -1 && /^[A-G]b/.test(c.text.split("/")[0])) usesFlats = true;
        });
      });
    });
    block.verses.forEach(function (verse) {
      (verse.pairs || []).forEach(function (pair) {
        (pair.chords || []).forEach(function (c) {
          if (c.text) c.text = transposeChordName(c.text, semitones, usesFlats);
        });
      });
    });
    block.transposeSteps = (block.transposeSteps || 0) + semitones;
  }

  function parseUGRaw(raw) {
    // Handles two UG formats:
    // 1. Print format: chord-only line above lyric line  ("F         G\nOh Randy...")
    // 2. Inline format: [Chord] markers within lyric line ("[F]Oh [G]Randy...")
    // Also handles [Verse 1], [Chorus] section labels and blank-line verse breaks.

    var lines = raw.split("\n");
    var verses = [];
    var currentVerse = { label: null, pairs: [] };
    var pendingChordLine = null; // holds a chord-only line waiting for its lyric

    function isChordLine(line) {
      // A chord line contains only chord names and spaces — no general lowercase words
      var stripped = line.trim();
      if (!stripped) return false;
      // Must have at least one chord root (A-G)
      if (!/[A-G]/.test(stripped)) return false;
      // Split into tokens and check each one looks like a chord
      var tokens = stripped.split(/\s+/);
      if (!tokens.length) return false;
      var chordPattern = /^[A-G][#b]?(m|maj|min|sus|aug|dim|add|M)?[0-9]*(\/[A-G][#b]?)?$/;
      return tokens.every(function(t) { return t === "" || chordPattern.test(t); });
    }

    function parseChordPositions(chordLine) {
      var chords = [];
      var re = /([A-G][#b]?(?:m|maj|min|sus|aug|dim|add|M)?[0-9]*(?:\/[A-G][#b]?)?)/g;
      var m;
      while ((m = re.exec(chordLine)) !== null) {
        chords.push({ text: m[1], offset: m.index });
      }
      return chords;
    }

    function pushVerse() {
      if (pendingChordLine !== null) {
        // Orphaned chord line with no lyric after it
        currentVerse.pairs.push({ chords: parseChordPositions(pendingChordLine), lyric: "" });
        pendingChordLine = null;
      }
      if (currentVerse.pairs.length) verses.push(currentVerse);
    }

    var i = 0;
    while (i < lines.length) {
      var line = lines[i];

      // Section label: [Verse 1], [Chorus], [Bridge] etc.
      // Only treat as a chord (not a section label) if the bracket contents are a single valid chord token
      if (/^\[[^\]]+\]\s*$/.test(line) && !/^\[[A-G][#b]?(m|maj|min|sus|aug|dim|add|M)?[0-9]*(\/[A-G][#b]?)?\]\s*$/.test(line)) {
        pushVerse();
        currentVerse = { label: line.replace(/^\[|\]\s*$/g, "").trim(), pairs: [] };
        pendingChordLine = null;
        i++; continue;
      }

      // Blank line = verse break
      if (line.trim() === "") {
        if (pendingChordLine !== null || currentVerse.pairs.length) {
          pushVerse();
          currentVerse = { label: null, pairs: [] };
        }
        i++; continue;
      }

      // Inline [Chord] format
      if (/\[[A-G][^\]]*\]/.test(line)) {
        if (pendingChordLine !== null) {
          currentVerse.pairs.push({ chords: parseChordPositions(pendingChordLine), lyric: "" });
          pendingChordLine = null;
        }
        currentVerse.pairs.push(parseInlineLine(line));
        i++; continue;
      }

      // Chord-only line (print format)
      if (isChordLine(line)) {
        if (pendingChordLine !== null) {
          // Two chord lines in a row — flush first as orphan
          currentVerse.pairs.push({ chords: parseChordPositions(pendingChordLine), lyric: "" });
        }
        pendingChordLine = line;
        i++; continue;
      }

      // Lyric line
      if (pendingChordLine !== null) {
        // Pair the pending chord line with this lyric
        currentVerse.pairs.push({ chords: parseChordPositions(pendingChordLine), lyric: line });
        pendingChordLine = null;
      } else {
        currentVerse.pairs.push({ chords: [], lyric: line });
      }
      i++;
    }

    pushVerse();
    if (!verses.length) verses.push({ label: null, pairs: [{ chords: [], lyric: raw }] });
    return verses;
  }

  function parseInlineLine(line) {
    // Convert "[G]Here comes the [C]sun" into chords with character offsets into lyric
    var chords = [];
    var firstChordPos = line.search(/\[[A-G][^\]]*\]/);
    var lyric = firstChordPos > 0 ? line.slice(0, firstChordPos) : "";
    var searchStr = line.slice(firstChordPos >= 0 ? firstChordPos : 0);
    var r2 = /\[([A-G][^\]]*)\]([^\[]*)/g;
    var m;
    while ((m = r2.exec(searchStr)) !== null) {
      chords.push({ text: m[1], offset: lyric.length });
      lyric += m[2];
    }
    return { chords: chords, lyric: lyric };
  }

  function songBlockToRaw(block) {
    if (!block.verses) return "";
    return block.verses.map(function (v) {
      var out = [];
      if (v.label) out.push("[" + v.label + "]");
      v.pairs.forEach(function (p) {
        if (p.chords.length) {
          var inlineLine = "";
          var lyric = p.lyric || "";
          var lastPos = 0;
          var sorted = p.chords.slice().sort(function (a, b) { return a.offset - b.offset; });
          sorted.forEach(function (c) {
            inlineLine += lyric.slice(lastPos, c.offset) + "[" + c.text + "]";
            lastPos = c.offset;
          });
          inlineLine += lyric.slice(lastPos);
          out.push(inlineLine);
        } else {
          out.push(p.lyric || "");
        }
      });
      return out.join("\n");
    }).join("\n\n");
  }

    "Cmaj7":{ frets: [0,0,0,2,3,-1], baseFret: 1 },
    "D":    { frets: [2,3,2,0,-1,-1], baseFret: 1 },
    "Dm":   { frets: [1,3,2,0,-1,-1], baseFret: 1 },
    "D7":   { frets: [2,1,2,0,-1,-1], baseFret: 1 },
    "Dmaj7":{ frets: [2,2,2,0,-1,-1], baseFret: 1 },
    "Dsus2":{ frets: [0,3,2,0,-1,-1], baseFret: 1 },
    "Dsus4":{ frets: [3,3,2,0,-1,-1], baseFret: 1 },
    "E":    { frets: [0,0,1,2,2,0], baseFret: 1 },
    "Em":   { frets: [0,0,0,2,2,0], baseFret: 1 },
    "E7":   { frets: [0,0,1,0,2,0], baseFret: 1 },
    "Emaj7":{ frets: [0,0,1,1,2,0], baseFret: 1 },
    "Esus4":{ frets: [0,0,2,2,2,0], baseFret: 1 },
    "F":    { frets: [1,1,2,3,3,1], baseFret: 1, barre: 1 },
    "Fm":   { frets: [1,1,1,3,3,1], baseFret: 1, barre: 1 },
    "F7":   { frets: [1,1,2,1,3,1], baseFret: 1, barre: 1 },
    "Fmaj7":{ frets: [0,1,2,3,3,1], baseFret: 1 },
    "G":    { frets: [3,0,0,0,2,3], baseFret: 1 },
    "Gm":   { frets: [3,3,3,5,5,3], baseFret: 3, barre: 3 },
    "G7":   { frets: [1,0,0,0,2,3], baseFret: 1 },
    "Gmaj7":{ frets: [2,0,0,0,2,3], baseFret: 1 },
    "Gsus4":{ frets: [3,1,0,0,2,3], baseFret: 1 },
    "A":    { frets: [0,2,2,2,0,-1], baseFret: 1 },
    "Am":   { frets: [0,1,2,2,0,-1], baseFret: 1 },
    "A7":   { frets: [0,2,0,2,0,-1], baseFret: 1 },
    "Amaj7":{ frets: [0,2,1,2,0,-1], baseFret: 1 },
    "Asus2":{ frets: [0,0,2,2,0,-1], baseFret: 1 },
    "Asus4":{ frets: [0,3,2,2,0,-1], baseFret: 1 },
    "B":    { frets: [2,4,4,4,2,2], baseFret: 2, barre: 2 },
    "Bm":   { frets: [2,3,4,4,2,2], baseFret: 2, barre: 2 },
    "B7":   { frets: [2,0,2,1,2,-1], baseFret: 1 },
    "Cadd9":{ frets: [0,3,0,2,3,-1], baseFret: 1 },
    "Gadd9":{ frets: [3,0,2,0,2,3], baseFret: 1 },
    "Em7":  { frets: [0,0,0,2,2,0], baseFret: 1 },
    "Am7":  { frets: [0,1,0,2,0,-1], baseFret: 1 },
    "Dm7":  { frets: [1,1,2,0,-1,-1], baseFret: 1 },
    "Bm7":  { frets: [2,2,2,4,2,2], baseFret: 2, barre: 2 },

  function getUniqueChordsFromBlock(block) {
    var seen = {};
    var order = [];
    (block.verses || []).forEach(function (verse) {
      (verse.pairs || []).forEach(function (pair) {
        (pair.chords || []).forEach(function (c) {
          if (c.text && !seen[c.text]) {
            seen[c.text] = true;
            order.push(c.text);
          }
        });
      });
    });
    return order;
  }

  function getDefaultVoicing(chordName) {
    var entry = state.customChords && state.customChords[chordName];
    if (entry && entry.voicings && entry.voicings.length) {
      var def = entry.voicings.filter(function (v) { return v.id === entry.default; })[0];
      return def || entry.voicings[entry.voicings.length - 1];
    }
    return CHORD_LIBRARY[chordName] || null;

  function buildChordDiagramSVG(chordNameOrData, scale) {
    scale = scale || 1;
    var data = (typeof chordNameOrData === "string") ? getDefaultVoicing(chordNameOrData) : chordNameOrData;
    if (!data) return null;

    // Reverse frets so low E (index 5) is on the left
    var frets = data.frets.slice().reverse();
    var barre = data.barre || null;
    var baseFret = data.baseFret || 1;

    var strings = 6;
    var numFrets = data.numFrets || 4;
    var cellW = 14 * scale;
    var cellH = 13 * scale;
    var padL = 10 * scale;
    var padT = 12 * scale;
    var padB = 4 * scale;
    var dotR = 4.5 * scale;
    var w = padL + (strings - 1) * cellW + padL;
    var h = padT + numFrets * cellH + padB;

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);

    function el(tag, attrs) {
      var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      return e;
    }

    // Nut or baseFret indicator
    if (baseFret === 1) {
      svg.appendChild(el("rect", { x: padL, y: padT - 3 * scale, width: (strings - 1) * cellW, height: 3 * scale, fill: "#3D332A", rx: 1 }));
    } else {
      var txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", padL - 5 * scale);
      txt.setAttribute("y", padT + cellH * 0.65);
      txt.setAttribute("font-size", 7 * scale);
      txt.setAttribute("fill", "#8A7D68");
      txt.setAttribute("text-anchor", "end");
      txt.setAttribute("font-family", "Inter, sans-serif");
      txt.textContent = baseFret + "fr";
      svg.appendChild(txt);
    }

    // Fret lines
    for (var f = 0; f <= numFrets; f++) {
      svg.appendChild(el("line", {
        x1: padL, y1: padT + f * cellH,
        x2: padL + (strings - 1) * cellW, y2: padT + f * cellH,
        stroke: "#C4B8A4", "stroke-width": scale
      }));
    }

    // String lines
    for (var s = 0; s < strings; s++) {
      svg.appendChild(el("line", {
        x1: padL + s * cellW, y1: padT,
        x2: padL + s * cellW, y2: padT + numFrets * cellH,
        stroke: "#C4B8A4", "stroke-width": scale
      }));
    }

    // Open / muted markers above nut
    frets.forEach(function (fret, si) {
      var x = padL + si * cellW;
      var y = padT - 6 * scale;
      if (fret === 0) {
        svg.appendChild(el("circle", { cx: x, cy: y, r: 2.5 * scale, fill: "none", stroke: "#8A7D68", "stroke-width": scale }));
      } else if (fret === -1) {
        svg.appendChild(el("text", { x: x, y: y + 2 * scale, "font-size": 7 * scale, fill: "#8A7D68", "text-anchor": "middle", "font-family": "Inter, sans-serif" }));
        var xt = el("text", { x: x, y: y + 2.5 * scale, "font-size": 7 * scale, fill: "#8A7D68", "text-anchor": "middle", "font-family": "Inter, sans-serif" });
        xt.textContent = "×";
        svg.appendChild(xt);
      }
    });

    // Barre
    if (barre !== null) {
      var barreRelFret = barre - baseFret + 1;
      var by = padT + (barreRelFret - 0.5) * cellH;
      var barreStrings = frets.map(function (f, i) { return f === barre ? i : -1; }).filter(function (i) { return i >= 0; });
      if (barreStrings.length >= 2) {
        var bx1 = padL + barreStrings[0] * cellW;
        var bx2 = padL + barreStrings[barreStrings.length - 1] * cellW;
        svg.appendChild(el("rect", { x: bx1, y: by - 4 * scale, width: bx2 - bx1, height: 8 * scale, rx: 4 * scale, fill: "#3D332A" }));
      }
    }

    // Finger dots
    frets.forEach(function (fret, si) {
      if (fret <= 0) return;
      if (barre !== null && fret === barre) return; // covered by barre bar
      var relFret = fret - baseFret + 1;
      var cx = padL + si * cellW;
      var cy = padT + (relFret - 0.5) * cellH;
      svg.appendChild(el("circle", { cx: cx, cy: cy, r: dotR, fill: "#3D332A" }));
    });

    return svg;
  }

  // ---- Month colour system ----
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONTH_COLOURS = ["#C8C8D0","#8FA3B8","#C94040","#5A9E4A","#A8405A","#D4793A","#E8A830","#D45830","#9E4830","#8A8A90","#5C3D28","#3A3A42"];
  var MONTH_INK =    ["#3D332A","#1A2A38","#FBF8F0","#FBF8F0","#FBF8F0","#FBF8F0","#3D332A","#FBF8F0","#FBF8F0","#FBF8F0","#FBF8F0","#FBF8F0"];

  /* DL TRIAL: darker label colours so pale months (Jan, Feb, Oct) read on paper */
  var EGG_MONTH_LABEL = ["#6E6E7C","#4A6784","#B23030","#3D7C2F","#922E48","#B85A1E","#A56A00","#BC4420","#8A3B24","#65656D","#5C3D28","#3A3A42"];
  function monthColour(monthIndex) { return MONTH_COLOURS[monthIndex] || "#E8E8EC"; }

  // Shades a hex colour lighter (positive percent) or darker (negative)
  // — used for the day-boundary ticks, which want a variant of the
  // month's own colour rather than a completely separate one.
  function shadeColour(hex, percent) {
    var num = parseInt(hex.replace("#",""), 16);
    var r = (num >> 16) & 0xFF, g = (num >> 8) & 0xFF, bch = num & 0xFF;
    r = Math.min(255, Math.max(0, Math.round(r + 255*percent)));
    g = Math.min(255, Math.max(0, Math.round(g + 255*percent)));
    bch = Math.min(255, Math.max(0, Math.round(bch + 255*percent)));
    return "rgb(" + r + "," + g + "," + bch + ")";
  }
  function monthInk(monthIndex) { return MONTH_INK[monthIndex] || "#3D332A"; }

  function parseDate(str) {
    if (!str) return null;
    var d = new Date(str + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function formatDateShort(d) {
    if (!d) return "";
    return d.getDate() + " " + MONTH_SHORT[d.getMonth()] + " " + d.getFullYear();
  }

  function formatDateMedium(d) {
    if (!d) return "";
    return MONTH_SHORT[d.getMonth()] + " " + d.getDate();
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
  }

  function durationLabel(startDate, endDate) {
    if (!startDate || !endDate) return "";
    var days = daysBetween(startDate, endDate);
    if (days < 0) return "";
    if (days === 0) return "1 day";
    if (days === 1) return "2 days";
    if (days < 7) return (days + 1) + " days";
    var weeks = Math.round(days / 7);
    return weeks === 1 ? "1 week" : weeks + " weeks";
  }

  function getCardStartDate(card) { return parseDate(card.startDate); }
  function getCardEndDate(card) { return parseDate(card.endDate) || getCardStartDate(card); }

  function getActiveCard() {
    return activeCardId ? state.cards.filter(function (c) { return c.id === activeCardId; })[0] : null;
  }

  // ---- Block drag auto-scroll ----
  var blockScrollRaf = null;
  var blockScrollClientY = 0;
  function startBlockAutoScroll(clientY) {
    blockScrollClientY = clientY;
    if (blockScrollRaf) return; // already running — just update clientY above
    var container = document.getElementById("blocks-container");
    if (!container) return;
    function step() {
      var rect = container.getBoundingClientRect();
      var zone = 80;
      var speed = 0;
      if (blockScrollClientY < rect.top + zone) {
        speed = -((zone - (blockScrollClientY - rect.top)) / zone) * 32;
      } else if (blockScrollClientY > rect.bottom - zone) {
        speed = ((zone - (rect.bottom - blockScrollClientY)) / zone) * 32;
      }
      if (speed !== 0) container.scrollTop += speed;
      blockScrollRaf = requestAnimationFrame(step);
    }
    blockScrollRaf = requestAnimationFrame(step);
  }
  function stopBlockAutoScroll() {
    if (blockScrollRaf) { cancelAnimationFrame(blockScrollRaf); blockScrollRaf = null; }
  }

  // ---- Build a block DOM element ----
  function startBlockDrag(e, blockEl, block, card) {
    if (e.button !== undefined && e.button !== 0) return;
    var container = document.getElementById("blocks-container");
    if (!container) return;
    e.preventDefault(); e.stopPropagation();
    var handle = e.currentTarget;
    try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    blockEl.classList.add("dragging");
    var ind = document.createElement("div");
    ind.className = "block-drop-indicator";
    ind.style.cssText = "height:4px;background:#A14C5A;border-radius:2px;pointer-events:none;flex-shrink:0;";
    var lastY = e.clientY, active = true, raf = 0, targetBefore = null;
    function place(y) {
      if (ind.parentNode) ind.parentNode.removeChild(ind);
      var others = Array.prototype.slice.call(container.querySelectorAll(":scope > .card-block")).filter(function (el) { return el !== blockEl; });
      var before = null;
      for (var i = 0; i < others.length; i++) {
        var r = others[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) { before = others[i]; break; }
      }
      targetBefore = before;
      if (before) container.insertBefore(ind, before); else container.appendChild(ind);
    }
    function tick() {
      if (!active) return;
      var cr = container.getBoundingClientRect();
      if (lastY < cr.top + 40) container.scrollTop -= 14;
      else if (lastY > cr.bottom - 40) container.scrollTop += 14;
      place(lastY);
      raf = requestAnimationFrame(tick);
    }
    function move(ev) { lastY = ev.clientY; }
    function finish(ev) {
      active = false; cancelAnimationFrame(raf);
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", finish);
      handle.removeEventListener("pointercancel", finish);
      try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
      if (ind.parentNode) ind.parentNode.removeChild(ind);
      blockEl.classList.remove("dragging");
      var fromIdx = card.blocks.findIndex(function (b) { return b.id === block.id; });
      if (fromIdx === -1) return;
      var moved = card.blocks.splice(fromIdx, 1)[0];
      var toIdx = targetBefore ? card.blocks.findIndex(function (b) { return b.id === targetBefore.dataset.blockId; }) : card.blocks.length;
      if (toIdx === -1) toIdx = card.blocks.length;
      card.blocks.splice(toIdx, 0, moved);
      if (toIdx !== fromIdx) { saveBlocksToCard(card); saveState(); refreshCanvas(); }
      renderBlocksContainer(card);
    }
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
    place(lastY);
    raf = requestAnimationFrame(tick);
  }

      ta.addEventListener("click", function () {

      });
      blockEl.appendChild(ta);

    } else if (block.type === "image") {
      block.images = block.images || [];

    } else if (block.type === "song") {
      var inner = document.createElement("div");
      inner.className = "song-block-inner";

      var inner = document.createElement("div");
      inner.className = "video-block-inner";
      blockEl.appendChild(inner);
      renderVideoBlock(block, blockEl);
    } else if (block.type === "screenplay") {
      var inner = document.createElement("div");
      inner.className = "screenplay-block-inner";
      blockEl.appendChild(inner);
      renderScreenplayBlock(block, blockEl, card);
    } else if (block.type === "map") {
      var inner = document.createElement("div");
      inner.className = "map-block-inner";
      blockEl.appendChild(inner);

    } else if (block.type === "contact") {
      var inner = document.createElement("div");
      inner.className = "contact-block-inner";
      blockEl.appendChild(inner);
      renderContactBlock(block, blockEl, card);
    }

    // Drag-to-reorder (pointer based: mouse, pen and touch)
    handle.addEventListener("pointerdown", function (e) { startBlockDrag(e, blockEl, block, card); });

    return blockEl;
  }

  function renderImageBlockGallery(gallery, block, card) {
    gallery.innerHTML = "";
    (block.images || []).forEach(function (imgObj) {
      var thumb = document.createElement("div");
      thumb.className = "card-image-thumb";
      var imgTag = document.createElement("img");
      imgTag.loading = "lazy"; imgTag.decoding = "async";
      imgTag.src = imgObj.thumb || imgObj.src;
      thumb.appendChild(imgTag);
      var removeBtn = document.createElement("button");
      removeBtn.className = "thumb-remove";
      removeBtn.textContent = "\u00d7";
      removeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        block.images = block.images.filter(function (im) { return im.id !== imgObj.id; });
        saveBlocksToCard(card); saveState(); refreshCanvas();
        renderImageBlockGallery(gallery, block, card);
      });
      thumb.appendChild(removeBtn);
      gallery.appendChild(thumb);
    });

    // Add image button
    var addBtn = document.createElement("label");
    addBtn.className = "block-image-add";
    addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.hidden = true;
    inp.addEventListener("change", function (e) {
      var files = Array.from(e.target.files);
      var pending = files.length;
      if (!pending) return;
      files.forEach(function (file) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          compressAndUploadImage(ev.target.result, 1400, 0.8, function (finalSrc, thumbSrc, tinySrc) {
            block.images = block.images || [];
            block.images.push({ id: uid(), src: finalSrc, thumb: thumbSrc || undefined });
            pending--;
            if (!pending) {
              saveBlocksToCard(card); saveState(); refreshCanvas();
              renderImageBlockGallery(gallery, block, card);
            }
          }, true);
        };
        reader.readAsDataURL(file);
      });
      inp.value = "";
    });
    addBtn.appendChild(inp);
    gallery.appendChild(addBtn);
  }

  function autoResizeTextarea(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  }

  function handleTextBlockKeydown(e, ta, block, card) {
    if (e.key !== "Enter") return;
    var pos = ta.selectionStart;
    var text = ta.value;
    var lineStart = text.lastIndexOf("\n", pos - 1) + 1;
    var currentLine = text.slice(lineStart, pos);
    var checkMatch = currentLine.match(/^(\[[ x]\]\s)/);
    var bulletMatch = currentLine.match(/^(-\s)/);
    var prefix = checkMatch ? "[ ] " : (bulletMatch ? "- " : null);
    if (!prefix) return;
    var matchedLength = checkMatch ? checkMatch[0].length : bulletMatch[0].length;
    if (currentLine.slice(matchedLength).trim() === "") {
      e.preventDefault();
      var before = text.slice(0, lineStart);
      var after = text.slice(pos);
      ta.value = before + after;
      ta.selectionStart = ta.selectionEnd = lineStart;
      block.content = ta.value;
      return;
    }
    e.preventDefault();
    var insertion = "\n" + prefix;
    ta.value = text.slice(0, pos) + insertion + text.slice(pos);
    ta.selectionStart = ta.selectionEnd = pos + insertion.length;
    block.content = ta.value;
    autoResizeTextarea(ta);
  }

  function handleTextBlockClick(ta, block) {
    var pos = ta.selectionStart;
    var text = ta.value;
    var lineStart = text.lastIndexOf("\n", pos - 1) + 1;
    var lineEnd = text.indexOf("\n", pos);
    if (lineEnd === -1) lineEnd = text.length;
    var line = text.slice(lineStart, lineEnd);
    var match = line.match(/^\[([ x])\]/);
    if (match && (pos - lineStart) <= 3) {
      var newChar = match[1] === " " ? "x" : " ";
      var newLine = "[" + newChar + "]" + line.slice(3);
      ta.value = text.slice(0, lineStart) + newLine + text.slice(lineEnd);
      block.content = ta.value;
      saveState();
    }
  }

  function insertIntoFocusedTextBlock(prefix) {
    var container = document.getElementById("blocks-container");
    var ta = container.querySelector(".block-text textarea:focus");
    if (!ta) {
      // Insert into first text block or create one
      var firstText = container.querySelector(".block-text textarea");
      if (firstText) { firstText.focus(); ta = firstText; }
      else { addBlock("text"); return; }
    }
    ta.focus();
    var pos = ta.selectionStart;
    var text = ta.value;
    var needsNewline = pos > 0 && text.charAt(pos - 1) !== "\n";
    var insertion = (needsNewline ? "\n" : "") + prefix;
    ta.value = text.slice(0, pos) + insertion + text.slice(pos);
    var newPos = pos + insertion.length;
    ta.selectionStart = ta.selectionEnd = newPos;
    ta.dispatchEvent(new Event("input"));
  }

  function addBlock(type) {
    var card = getActiveCard();
    if (!card) return;
    var block = { id: uid(), type: type };
    if (type === "text") block.content = "";
    if (type === "image") block.images = [];
    if (type === "song") block.verses = [];
    if (type === "video") { block.videoId = null; block.videoUrl = ""; }
    if (type === "map") { block.lat = 51.505; block.lng = -0.09; block.zoom = 13; block.markers = []; }
    if (type === "screenplay") block.lines = [{ id: uid(), lineType: "scene", text: "" }];
    if (type === "contact") { block.name = ""; block.role = ""; block.org = ""; block.email = ""; block.phone = ""; block.linkedin = ""; block.bio = ""; block.photo = ""; block.birthday = ""; }
    card.blocks.push(block);
    saveBlocksToCard(card); saveState(); refreshCanvas();
    renderBlocksContainer(card);
    // Focus the new block
    setTimeout(function () {
      var container = document.getElementById("blocks-container");

  function openCardFromOrigin(id, originEl) {
    openCard(id);

    var originRect = originEl.getBoundingClientRect();
    var originCenterX = originRect.left + originRect.width / 2;
    var originCenterY = originRect.top + originRect.height / 2;

    modal.style.transition = "none";
    var modalRect = modal.getBoundingClientRect();
    var modalCenterX = modalRect.left + modalRect.width / 2;
    var modalCenterY = modalRect.top + modalRect.height / 2;
    var dx = originCenterX - modalCenterX;
    var dy = originCenterY - modalCenterY;
    var scaleRatio = Math.max(0.08, Math.min(1, originRect.width / modalRect.width));

    modal.style.transform = "translate(" + dx + "px, " + dy + "px) scale(" + scaleRatio + ") rotateY(-85deg)";
    modal.style.opacity = "0";
    modal.getBoundingClientRect();

    requestAnimationFrame(function () {
      modal.style.transition = "transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease";
      modal.style.transform = "translate(0px, 0px) scale(1) rotateY(0deg)";
      modal.style.opacity = "1";
      // Re-render blocks in case the modal was scaled during initial render
      var card = getActiveCard();
      if (card) renderBlocksContainer(card);
    });

    function cleanup() {
      modal.style.transition = "";
      modal.style.transform = "";
      modal.style.opacity = "";
      modal.removeEventListener("transitionend", cleanup);
    }
    modal.addEventListener("transitionend", cleanup);
  }

      modal.style.transition = "";
      modal.style.transform = "";
      modal.style.opacity = "";
      modal.removeEventListener("transitionend", cleanup);
    }
    modal.addEventListener("transitionend", cleanup);

  // ---- Performance mode ----
  var perfOverlay = document.getElementById("perf-overlay");

  function openPerfMode(songBlock) {
    var card = getActiveCard();
    if (!card) return;
    migrateCardToBlocks(card);

    perfSongTitle.textContent = (songBlock && songBlock.songTitle) ? songBlock.songTitle : (card.title || "Untitled");
    perfSongArtist.textContent = (songBlock && songBlock.songArtist) ? songBlock.songArtist : "";

    perfDiagrams.innerHTML = "";
    if (songBlock) {
      var uniqueChords = getUniqueChordsFromBlock(songBlock);
      uniqueChords.forEach(function (name) {

        var wrap = document.createElement("div");
