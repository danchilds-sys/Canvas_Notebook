  function renderMapBlock(block, blockEl, card) {
    block.lat = block.lat !== undefined ? block.lat : 51.505;
    block.lng = block.lng !== undefined ? block.lng : -0.09;
    block.zoom = block.zoom || 13;
    block.markers = block.markers || [];

    var inner = blockEl.querySelector(".map-block-inner");
    inner.innerHTML = "";

    // Search row
    var searchRow = document.createElement("div");
    searchRow.className = "map-block-search-row";
    var searchInput = document.createElement("input");
    searchInput.className = "map-block-search-input";
    searchInput.placeholder = "Search location…";
    searchInput.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    searchInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); doSearch(); }
    });
    var searchBtn = document.createElement("button");
    searchBtn.className = "map-block-search-btn";
    searchBtn.textContent = "Go";
    searchBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    searchBtn.addEventListener("click", function(e){ e.stopPropagation(); doSearch(); });
    searchRow.appendChild(searchInput);
    searchRow.appendChild(searchBtn);
    inner.appendChild(searchRow);

    // Map container
    var mapDiv = document.createElement("div");
    mapDiv.className = "map-block-map";
    var mapId = "map-" + block.id;
    mapDiv.id = mapId;
    inner.appendChild(mapDiv);

    // Hint
    var hint = document.createElement("div");
    hint.className = "map-block-hint";
    hint.textContent = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ? "Tap the map to unlock it, then tap to add a pin · Touch outside to scroll again" : "Click to add pin · Right-click pin to remove · Ctrl/Cmd + scroll to zoom";
    inner.appendChild(hint);

    loadLeaflet(function() {
      // Destroy previous map instance if any
      if (mapDiv._leafletMap) {
        mapDiv._leafletMap.remove();
        mapDiv._leafletMap = null;
      }

      /* DL v29e: the map must not swallow page scrolling. Wheel/two-finger scroll passes through (Ctrl/Cmd + wheel zooms); on touch screens the map is locked until tapped. */
      var coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      var touchLocked = coarse;
      var map = L.map(mapDiv, { zoomControl: true, scrollWheelZoom: false, dragging: !coarse, touchZoom: !coarse, tap: false }).setView([block.lat, block.lng], block.zoom);
      var wheelAcc = 0;
      mapDiv.addEventListener("wheel", function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault(); e.stopPropagation();
        wheelAcc += -e.deltaY;
        if (Math.abs(wheelAcc) > 50) { map.setZoom(map.getZoom() + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; }
      }, { passive: false });
      function setMapActive(on) {
        touchLocked = !on;
        if (on) { map.dragging.enable(); map.touchZoom.enable(); mapDiv.style.outline = "3px solid #2F9E62"; mapDiv.style.outlineOffset = "-3px"; }
        else { map.dragging.disable(); map.touchZoom.disable(); mapDiv.style.outline = ""; }
      }
      if (coarse) {
        document.addEventListener("pointerdown", function outside(e) {
          if (!document.body.contains(mapDiv)) { document.removeEventListener("pointerdown", outside); return; }
          if (!mapDiv.contains(e.target) && !touchLocked) setMapActive(false);
        });
      }
      mapDiv._leafletMap = map;
      if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); }).observe(mapDiv); /* DL v29: keep 4:3 map tiles correct on resize */

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
        maxZoom: 19
      }).addTo(map);

      // Add existing markers
      var leafletMarkers = [];
      function addMarker(lat, lng, label) {
        var m = L.marker([lat, lng]).addTo(map);
        if (label) m.bindPopup(label);
        m.on("contextmenu", function() {
          map.removeLayer(m);
          block.markers = block.markers.filter(function(mk){ return mk.lat !== lat || mk.lng !== lng; });
          saveBlocksToCard(card); saveState(); refreshCanvas();
        });
        leafletMarkers.push(m);
        return m;
      }

      block.markers.forEach(function(mk){ addMarker(mk.lat, mk.lng, mk.label); });

      // Click to add marker
      map.on("click", function(e) {
        if (touchLocked) { setMapActive(true); return; } /* first tap on a touch screen only unlocks the map */
        var lat = e.latlng.lat, lng = e.latlng.lng;
        block.markers.push({ lat: lat, lng: lng, label: "" });
        addMarker(lat, lng, "");
        block.lat = lat; block.lng = lng;
        saveBlocksToCard(card); saveState(); refreshCanvas();
      });

      // Save view on move/zoom
      map.on("moveend zoomend", function() {
        var c = map.getCenter();
        block.lat = c.lat; block.lng = c.lng;
        block.zoom = map.getZoom();
        saveBlocksToCard(card); saveState();
      });

      // Stop board panning when interacting with map
      mapDiv.addEventListener("pointerdown", function(e){ e.stopPropagation(); boardScrollLocked = true; });
      mapDiv.addEventListener("pointerup", function(){ boardScrollLocked = false; });
      mapDiv.addEventListener("wheel", function(e){ e.stopPropagation(); }, { passive: false });
    });

    function doSearch() {
      var q = searchInput.value.trim();
      if (!q) return;
      fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(q))
        .then(function(r){ return r.json(); })
        .then(function(results) {
          if (!results.length) { alert("Location not found"); return; }
          var r = results[0];
          var lat = parseFloat(r.lat), lng = parseFloat(r.lon);
          block.lat = lat; block.lng = lng;
          var map = mapDiv._leafletMap;
          if (map) map.setView([lat, lng], 13);
          searchInput.value = "";
          saveBlocksToCard(card); saveState();
        })
        .catch(function(){ alert("Search failed"); });
    }
  }

  function renderScreenplayBlock(block, blockEl, card) {
    block.lines = block.lines || [{ id: uid(), lineType: "scene", text: "" }];
    var inner = blockEl.querySelector(".screenplay-block-inner");
    inner.innerHTML = "";

    var LINE_TYPES = ["scene", "action", "character", "parenthetical", "dialogue", "transition"];
    var LINE_LABELS = { scene: "SC", action: "AC", character: "CH", parenthetical: "PA", dialogue: "DL", transition: "TR" };

    function saveAndRefresh() {
      // Sync plain text preview to block
      block.content = block.lines.map(function (l) { return l.text; }).join("\n");
      saveBlocksToCard(card); saveState(); refreshCanvas();
    }

    function renderLine(line, idx) {
      var row = document.createElement("div");
      row.className = "screenplay-line type-" + line.lineType;
      row.dataset.lineId = line.id;

      var typeLabel = document.createElement("span");
      typeLabel.className = "screenplay-line-type";
      typeLabel.textContent = LINE_LABELS[line.lineType] || line.lineType.slice(0,2).toUpperCase();
      row.appendChild(typeLabel);

      var ta = document.createElement("textarea");
      ta.className = "screenplay-line-text";
      ta.value = line.text || "";
      ta.rows = 1;
      ta.style.height = "auto";
      setTimeout(function () {
        ta.style.height = Math.max(ta.scrollHeight, 20) + "px";
      }, 0);
      ta.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      ta.addEventListener("input", function () {
        line.text = ta.value;
        ta.style.height = "auto";
        ta.style.height = Math.max(ta.scrollHeight, 20) + "px";
        saveAndRefresh();
      });
      ta.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          // Auto-advance: scene→action, character→dialogue, dialogue→character, else action
          var nextType = { scene: "action", action: "action", character: "dialogue",
            parenthetical: "dialogue", dialogue: "character", transition: "action" }[line.lineType] || "action";
          var newLine = { id: uid(), lineType: nextType, text: "" };
          block.lines.splice(idx + 1, 0, newLine);
          saveAndRefresh();
          renderScreenplayBlock(block, blockEl, card);
          // Focus next line
          setTimeout(function () {
            var rows = inner.querySelectorAll(".screenplay-line-text");
            if (rows[idx + 1]) rows[idx + 1].focus();
          }, 0);
        } else if (e.key === "Backspace" && ta.value === "" && block.lines.length > 1) {
          e.preventDefault();
          block.lines.splice(idx, 1);
          saveAndRefresh();
          renderScreenplayBlock(block, blockEl, card);
          setTimeout(function () {
            var rows = inner.querySelectorAll(".screenplay-line-text");
            var prevIdx = Math.max(0, idx - 1);
            if (rows[prevIdx]) { rows[prevIdx].focus(); var len = rows[prevIdx].value.length; rows[prevIdx].setSelectionRange(len, len); }
          }, 0);
        } else if (e.key === "Tab") {
          e.preventDefault();
          // Cycle through line types
          var cur = LINE_TYPES.indexOf(line.lineType);
          line.lineType = LINE_TYPES[(cur + (e.shiftKey ? -1 + LINE_TYPES.length : 1)) % LINE_TYPES.length];
          saveAndRefresh();
          renderScreenplayBlock(block, blockEl, card);
          setTimeout(function () {
            var rows = inner.querySelectorAll(".screenplay-line-text");
            if (rows[idx]) rows[idx].focus();
          }, 0);
        }
      });
      row.appendChild(ta);
      inner.appendChild(row);
    }

    block.lines.forEach(function (line, idx) { renderLine(line, idx); });

    // Add line buttons
    var addRow = document.createElement("div");
    addRow.className = "screenplay-add-line";
    LINE_TYPES.forEach(function (type) {
      var btn = document.createElement("button");
      btn.className = "screenplay-add-btn";
      btn.textContent = type.charAt(0).toUpperCase() + type.slice(1);
      btn.title = "Add " + type + " line";
      btn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      btn.addEventListener("click", function () {
        block.lines.push({ id: uid(), lineType: type, text: "" });
        saveAndRefresh();
        renderScreenplayBlock(block, blockEl, card);
        setTimeout(function () {
          var rows = inner.querySelectorAll(".screenplay-line-text");
          if (rows[rows.length - 1]) rows[rows.length - 1].focus();
        }, 0);
      });
      addRow.appendChild(btn);
    });

    // Read button
    var readBtn = document.createElement("button");
    readBtn.className = "screenplay-add-btn";
    readBtn.style.cssText = "margin-left:auto;background:rgba(61,51,42,0.1);";
    readBtn.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px;"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="10" y1="11" x2="14" y2="11"/></svg>Read';
    readBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    readBtn.addEventListener("click", function() { openScriptMode(block); });
    addRow.appendChild(readBtn);

    inner.appendChild(addRow);
  }

  // then smoothly transition matching elements from their old spot to the new one. ----
  function captureItemRects() {
    var rects = {};
    document.querySelectorAll(".card, .img-item, .shape-item, .card-group-frame, .card-group-table").forEach(function (el) {
      var id = el.dataset.id;
      if (!id) return;
      rects[id + (el.classList.contains("card-group-table") ? ":table" : "")] = {
        left: parseFloat(el.style.left) || 0,
        top: parseFloat(el.style.top) || 0,
        width: parseFloat(el.style.width) || 0,
        height: parseFloat(el.style.height) || 0
      };
    });
    return rects;
  }

  function playFlipAnimation(beforeRects) {
    requestAnimationFrame(function () {
      var toAnimate = [];
      document.querySelectorAll(".card, .img-item, .shape-item, .card-group-frame, .card-group-table").forEach(function (el) {
        var id = el.dataset.id + (el.classList.contains("card-group-table") ? ":table" : "");
        var before = beforeRects[id];
        if (!before) return;
        var afterLeft = parseFloat(el.style.left) || 0;
        var afterTop = parseFloat(el.style.top) || 0;
        var afterWidth = parseFloat(el.style.width) || 0;
        var afterHeight = parseFloat(el.style.height) || 0;
        if (before.left === afterLeft && before.top === afterTop && before.width === afterWidth && before.height === afterHeight) return;

        el.style.transition = "none";
        el.style.left = before.left + "px";
        el.style.top = before.top + "px";
        el.style.width = before.width + "px";
        el.style.height = before.height + "px";
        toAnimate.push({ el: el, left: afterLeft, top: afterTop, width: afterWidth, height: afterHeight });
      });
      if (!toAnimate.length) return;
      toAnimate.forEach(function (item) { item.el.getBoundingClientRect(); });
      requestAnimationFrame(function () {
        toAnimate.forEach(function (item) {
          item.el.style.transition = "";
          item.el.style.left = item.left + "px";
          item.el.style.top = item.top + "px";
          item.el.style.width = item.width + "px";
          item.el.style.height = item.height + "px";
        });
      });
    });
  }

  document.getElementById("image-input").addEventListener("change", function (e) {
    var files = Array.from(e.target.files);
    if (!files.length) return;
    var rect = wrap.getBoundingClientRect();
    var cx = (rect.width / 2 - panX) / scale;
    var cy = (rect.height / 2 - panY) / scale;
    var pending = files.length;
    var addedAny = false;
    files.forEach(function (file, i) {
      var reader = new FileReader();
      reader.onload = function (ev) {
        compressAndUploadImage(ev.target.result, 1400, 0.8, function (finalSrc, thumbSrc, tinySrc) {
          // Cascade multiple images so they don't land in an identical
          // stack — small deterministic offset per index, same spirit as
          // the jitter already used when adding cards.
          var offset = i * 28;
          var img = {
            id: uid(),
            src: finalSrc,
            thumb: thumbSrc || undefined,
            tiny: tinySrc || undefined,
            x: cx - 110 + offset,
            y: cy - 82 + offset,
            width: 220,
            height: 165,
            rotation: Math.round((Math.random() * 8 - 4) * 10) / 10,
            z: getMaxZ() + 1
          };
          state.images.push(img);
          addedAny = true;

    saveState();
    var index = getBoardsIndex();
    var newId = uid();
    var newTitle = "Board " + (index.length + 1);

    index = index.filter(function(b){ return b.id !== boardId; });
    saveBoardsIndex(index);

    if (currentBoardId === boardId) switchBoard(index[0].id);

  // wherever a base64 photo might be lurking) and collect a getter/setter
  // pair for each one, so we can replace in place once uploaded. Shared by
  // the migrate-to-Supabase button and by restore, since a restored backup
  // can just as easily contain un-migrated base64 photos as a live board can.
  function collectImageTargets(node, targets) {
    if (!node || typeof node !== "object") return;
    Object.keys(node).forEach(function(key){
      var val = node[key];
      if (typeof val === "string" && val.indexOf("data:image") === 0) {
        (function(n, k){
          targets.push({
            getSrc: function(){ return n[k]; },
            setSrc: function(v){ n[k] = v; }
          });
        })(node, key);
      } else if (val && typeof val === "object") {
        collectImageTargets(val, targets);
      }
    });
  }

  // v38: quietly builds any missing small versions for the board that is
  // open, in the background, so the Optimise button is never needed for it.
  // It never blocks the UI, never alerts, and retries next time on failure.
  var __autoSmallRunning = false;
  function autoSmallVersions() {
    if (__autoSmallRunning || pendingImageUploads > 0 || !state) return;
    var boardId = currentBoardId, data = state, all = [];
    (data.images || []).forEach(function(o){ if (o) all.push({ o: o, needTiny: true }); });
    (data.cards || []).forEach(function(c){
      (c.images || []).forEach(function(o){ if (o) all.push({ o: o, needTiny: false }); });
      (c.blocks || []).forEach(function(bl){
        if (bl.type === "image") (bl.images || []).forEach(function(o){ if (o) all.push({ o: o, needTiny: false }); });
      });
    });
    var todo = all.filter(function(t){
      var o = t.o;
      return typeof o.src === "string" && o.src.indexOf("http") === 0 && (!o.thumb || (t.needTiny && !o.tiny));
    });
    if (!todo.length) return;
    __autoSmallRunning = true;
    var done = 0, next = 0, total = todo.length, since = 0;
    function persist() {
      if (currentBoardId === boardId) { try { saveState(); } catch(e) {} }
      else { try { localStorage.setItem(BOARD_PREFIX + boardId, JSON.stringify(data)); } catch(e) {} }
    }
    function finish() {
      __autoSmallRunning = false;
      persist();
      if (currentBoardId === boardId) applyImageLOD();
    }
    function work() {
      if (next >= total) return;
      var t = todo[next++], o = t.o;
      var source = (o.thumb && t.needTiny) ? o.thumb : o.src;
      fetch(source).then(function(r){ return r.blob(); }).then(function(blob){
        return new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ res(null); }; fr.readAsDataURL(blob); });
      }).then(function(dataUrl){
        if (!dataUrl) return null;
        return new Promise(function(res){ makeSmallVersions(dataUrl, !o.thumb, function(th, ti){ res({ th: th, ti: ti }); }); });
      }).then(function(r){
        if (r) {
          if (r.th) o.thumb = r.th;
          if (r.ti && t.needTiny) o.tiny = r.ti;
        }
      }).catch(function(err){ console.warn("Auto small-version build failed for one photo", err); })
      .then(function(){
        done++; since++;
        if (since >= 10 && done < total) { since = 0; persist(); if (currentBoardId === boardId) applyImageLOD(); }
        if (done === total) finish(); else work();
      });
    }
    for (var k = 0; k < Math.min(2, total); k++) work();
  }
  setTimeout(autoSmallVersions, 4000);

  function runSmallVersionBackfill() {
    var jobs = [], all = [];
    getBoardsIndex().forEach(function(b){
      var isCurrent = (b.id === currentBoardId);
      var data = isCurrent ? state : JSON.parse(localStorage.getItem(BOARD_PREFIX + b.id) || "{}");
      var job = { board: b, data: data, isCurrent: isCurrent };
      jobs.push(job);
      (data.images || []).forEach(function(o){ if (o) all.push({ o: o, needTiny: true }); });
      (data.cards || []).forEach(function(c){
        (c.images || []).forEach(function(o){ if (o) all.push({ o: o, needTiny: false }); });
        (c.blocks || []).forEach(function(bl){
          if (bl.type === "image") (bl.images || []).forEach(function(o){ if (o) all.push({ o: o, needTiny: false }); });
        });
      });
    });
    var todo = all.filter(function(t){
      var o = t.o;
      return typeof o.src === "string" && o.src.indexOf("http") === 0 && (!o.thumb || (t.needTiny && !o.tiny));
    });
    if (!todo.length) { alert("Nothing to do: no locally-stored photos, and every photo already has small versions."); return; }

    pendingImageUploads++;
    var done = 0, made = 0, next = 0, total = todo.length;
    function finish() {
      pendingImageUploads--;
      jobs.forEach(function(job){
        if (job.isCurrent) { saveState(); }
        else { try { localStorage.setItem(BOARD_PREFIX + job.board.id, JSON.stringify(job.data)); } catch(err) { console.warn("Could not save board", job.board.id, err); } }
      });
      refreshCanvas();
      alert("Built small versions for " + made + " of " + total + " photo(s)." + (made < total ? " " + (total - made) + " couldn't be processed (they'll be retried next time you press the button)." : ""));
    }
    function work() {
      if (next >= total) return;
      var t = todo[next++], o = t.o;
      var source = o.thumb && t.needTiny ? o.thumb : o.src;
      fetch(source).then(function(r){ return r.blob(); }).then(function(blob){
        return new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ res(null); }; fr.readAsDataURL(blob); });
      }).then(function(dataUrl){
        if (!dataUrl) return null;
        return new Promise(function(res){ makeSmallVersions(dataUrl, !o.thumb, function(th, ti){ res({ th: th, ti: ti }); }); });
      }).then(function(r){
        if (r && (r.th || r.ti)) {
          if (r.th) o.thumb = r.th;
          if (r.ti && t.needTiny) o.tiny = r.ti;
          made++;
        }
      }).catch(function(err){ console.warn("Small-version backfill failed for one photo", err); })
      .then(function(){
        done++;
        if (done % 5 === 0 || done === total) console.log("Small versions: " + done + "/" + total);
        if (done === total) finish(); else work();
      });
    }
    for (var k = 0; k < Math.min(3, total); k++) work();
  }

  document.getElementById("compress-images-btn").addEventListener("click", function(e){
    e.stopPropagation();
    if (pendingImageUploads > 0) { alert("An upload is already in progress — please wait a moment and try again."); return; }
    if (!confirm("This will scan every board, move any photos still stored locally to Supabase, and build small versions of photos so big boards stay fast. This can take a while for a lot of images. Continue?")) return;

    var index = getBoardsIndex();
    var globalBdays = loadGlobalBirthdays();
    var boardJobs = index.map(function(b){
      var isCurrent = (b.id === currentBoardId);
      var data = isCurrent ? state : JSON.parse(localStorage.getItem(BOARD_PREFIX + b.id) || "{}");
      var targets = [];
      collectImageTargets(data, targets);
      return { board: b, data: data, isCurrent: isCurrent, targets: targets };
    });
    globalBdays.forEach(function(bd){
      if (bd.photo && bd.photo.indexOf("data:image") === 0) {
        boardJobs.push({ board: null, data: null, isCurrent: false, isBirthdays: true,
          targets: [{ getSrc: function(){ return bd.photo; }, setSrc: function(v){ bd.photo = v; } }] });
      }
    });

    var allTargets = [];
    boardJobs.forEach(function(job){ job.targets.forEach(function(t){ t._job = job; allTargets.push(t); }); });

    if (!allTargets.length) { runSmallVersionBackfill(); return; }

    var total = allTargets.length;
    var done = 0;
    var migrated = 0;
    var sizeBefore = allTargets.reduce(function(sum, t){ return sum + (t.getSrc() || "").length; }, 0);

    allTargets.forEach(function(t){
      var src = t.getSrc();
      compressAndUploadImage(src, 1400, 0.8, function(finalSrc){
        if (finalSrc && finalSrc.indexOf("data:image") !== 0) migrated++; // only counts as migrated if it's now a real URL, not a fallback data URL
        t.setSrc(finalSrc);
        done++;
        if (done % 5 === 0 || done === total) console.log("Migration progress: " + done + "/" + total);
        if (done === total) finishMigration();
      });
    });

    function finishMigration(){
      var sizeAfter = allTargets.reduce(function(sum, t){ return sum + (t.getSrc() || "").length; }, 0);
      var freedMB = ((sizeBefore - sizeAfter) / 1024 / 1024 * 0.75).toFixed(1);
      saveGlobalBirthdays(globalBdays);
      boardJobs.forEach(function(job){
        if (job.isBirthdays) return;
        if (job.isCurrent) { saveState(); }
        else { try { localStorage.setItem(BOARD_PREFIX + job.board.id, JSON.stringify(job.data)); } catch(err) { console.warn("Could not save board", job.board.id, err); } }
      });
      refreshCanvas();
      if (migrated === total) {
        alert("Migrated all " + total + " photo(s) to Supabase, freeing about " + freedMB + "MB of local storage.");
      } else {
        alert("Migrated " + migrated + " of " + total + " photo(s) to Supabase (freeing about " + freedMB + "MB). " + (total - migrated) + " couldn't upload and stayed local — check the console for details.");
      }
    }
  });

  // ---- Full backup / restore ----
  // Saves already happen constantly, but they're all writing to the same
  // fragile localStorage — this gives Dan an actual out-of-band copy he can
  // keep, independent of browser storage quirks, quota, or accidental
  // clearing. Includes every board (current one read from live `state` so
  // nothing mid-edit is missed), the boards index, and global birthdays.
  document.getElementById("backup-btn").addEventListener("click", function(e){
    e.stopPropagation();
    saveState(); // make sure the current board's in-memory state is flushed first
    var index = getBoardsIndex();
    var boards = {};
    index.forEach(function(b){
      var raw = (b.id === currentBoardId) ? JSON.stringify(state) : localStorage.getItem(BOARD_PREFIX + b.id);
      if (raw) boards[b.id] = JSON.parse(raw);
    });
    var backup = {
      backupVersion: 1,
      exportedAt: new Date().toISOString(),
      boardsIndex: index,
      boards: boards,
      globalBirthdays: loadGlobalBirthdays(),
      calendarFeed: (window.__dlFeedLoad ? window.__dlFeedLoad() : null)
    };
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    a.href = url;
    a.download = "canvas-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  document.getElementById("restore-btn").addEventListener("click", function(e){
    e.stopPropagation();
    document.getElementById("restore-file-input").click();
  });

  document.getElementById("restore-file-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var backup;
      try { backup = JSON.parse(ev.target.result); }
      catch(err) { alert("That file doesn't look like a valid backup (couldn't parse as JSON)."); return; }
      if (!backup || !backup.boards || !backup.boardsIndex) { alert("That file doesn't look like a valid canvas backup."); return; }
      var boardCount = Object.keys(backup.boards).length;
      if (!confirm("This will REPLACE all " + boardCount + " board(s) currently stored in this browser with the ones from this backup (from " + (backup.exportedAt || "unknown date") + "). This cannot be undone. Continue?")) return;

      // A backup can be much larger than localStorage's ~5-10MB ceiling if
      // it was taken while some photos hadn't finished migrating to
      // Supabase yet — the backup file itself has no size limit (it's just
      // a download), but writing 78MB of embedded base64 straight into
      // localStorage will always fail regardless of how much space is
      // freed first. So: find every embedded photo across the whole
      // backup, upload it to Supabase exactly like the migrate tool does,
      // and only write the (now small) result to localStorage.
      var targets = [];
      Object.keys(backup.boards).forEach(function(boardId){
        collectImageTargets(backup.boards[boardId], targets);
      });
      if (backup.globalBirthdays) collectImageTargets({ list: backup.globalBirthdays }, targets);

      function finishRestore(){
        try {
          Object.keys(backup.boards).forEach(function(boardId){
            localStorage.setItem(BOARD_PREFIX + boardId, JSON.stringify(backup.boards[boardId]));
          });
          saveBoardsIndex(backup.boardsIndex);
          if (backup.globalBirthdays) saveGlobalBirthdays(backup.globalBirthdays);
          if (backup.calendarFeed && window.__dlFeedSave) window.__dlFeedSave(backup.calendarFeed);
          alert("Restored " + boardCount + " board(s). Reloading now.");
          location.reload();
        } catch(err) {
          alert("Restore failed: " + err.message + ". Even after uploading embedded photos to Supabase, the remaining data was too large for this browser's storage. Try removing some cards/boards from the backup, or contact support.");
        }
      }

      if (!targets.length) { finishRestore(); return; }

      var done = 0;
      var total = targets.length;
      var progressAlertShown = false;
      if (total > 5 && !progressAlertShown) {
        progressAlertShown = true;
        console.log("Restore: uploading " + total + " embedded photo(s) to Supabase before writing to local storage — this may take a little while.");
      }
      targets.forEach(function(t){
        var src = t.getSrc();
        compressAndUploadImage(src, 1400, 0.8, function(finalSrc){
          t.setSrc(finalSrc);
          done++;
          if (done % 5 === 0 || done === total) console.log("Restore migration progress: " + done + "/" + total);
          if (done === total) finishRestore();
        });
      });
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("custom-font-file-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) { pendingFontUploadCallback = null; return; }
    var cb = pendingFontUploadCallback;
    pendingFontUploadCallback = null;
    var displayName = file.name.replace(/\.(ttf|otf|woff2?|)$/i, "");
    // Font-family names can't safely contain arbitrary characters (spaces
    // are fine, but quotes/semicolons would break the CSS value) — strip
    // anything that isn't alphanumeric/space/hyphen, and tack on a short
    // random suffix so two fonts with the same filename never collide.
    var familyName = displayName.replace(/[^a-zA-Z0-9 \-]/g, "") + "-" + Math.random().toString(36).slice(2, 7);

    uploadFileToSupabase(file, function(url){
      if (!url) {
        alert("Couldn't upload \"" + file.name + "\" — check your connection and try again. (Custom fonts need Supabase to be reachable; they aren't stored locally.)");
        if (cb) cb(null);
        e.target.value = "";
        return;
      }
      var entry = { name: displayName, familyName: familyName, url: url };
      registerCustomFont(entry);
      var list = loadCustomFonts();
      list.push(entry);
      saveCustomFonts(list);
      if (cb) cb({ label: displayName, value: "'" + familyName + "', sans-serif" });
      e.target.value = "";
    });
  });

  document.getElementById("focus-mode-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    toggleFocusMode(!document.body.classList.contains("focus-mode"));
  });
  document.getElementById("restore-ui-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    toggleFocusMode(false);

  document.getElementById("boards-new-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    createNewBoard();
  });

  document.addEventListener("pointerdown", function(e) {
    if (!boardsPanel.classList.contains("hidden") && !boardsPanel.contains(e.target) && e.target.id !== "boards-btn") {
      closeBoardsPanel();
    }
  });

  // Initialise board system
  getCurrentBoardId();
  STORE_KEY = BOARD_PREFIX + currentBoardId;

  loadState();
  applyCanvasColor(state.canvasColor);
  applyBoardSize();
  seedIfEmpty();
  boardTitleInput.value = state.boardTitle;
  resizeBoardTitleInput();
  updateCanvasTransform();
  refreshCanvas();

  // ===== DL TOUCH: touchscreen gestures (pointerType "touch" only; mouse, pen and trackpad behave as before) =====
  //  one-finger drag on empty board  = pan
  //  long-press (0.4s) then drag      = selection box
  //  tap on empty board               = clear selection
  //  two fingers                      = pinch zoom + pan
  //  long-press on an item            = its right-click menu (Safari never fires contextmenu on touch)
  //  double-tap                       = double-click (resize-handle reset, shape text edit, egg zoom reset)
  (function () {
    var BOARD_LONG_MS = 400, ITEM_LONG_MS = 500, SLOP = 8, DTAP_MS = 320, DTAP_DIST = 28;
    var MIN_SCALE = 0.15, MAX_SCALE = 5;
    var ITEM_SEL = ".card, .img-item, .shape-item, .container-box, .text-note-item";
    var NATIVE_SEL = "input, textarea, select, button, a, [contenteditable=''], [contenteditable='true']";
    var pts = {}, mode = null, downId = null, boardTimer = null, pinch = null;
    var sx = 0, sy = 0, spx = 0, spy = 0;
    var itemTimer = null, itemDownId = null, itemTarget = null, itemX = 0, itemY = 0;
    var lastTap = null, lastTouchAt = 0, suppressClickUntil = 0;

    wrap.style.touchAction = "none";

    function isBg(t) { return t === wrap || t === canvas || t === itemsLayer; }
    function count() { return Object.keys(pts).length; }
    function clearBoardTimer() { if (boardTimer) { clearTimeout(boardTimer); boardTimer = null; } }
    function clearItemTimer() { if (itemTimer) { clearTimeout(itemTimer); itemTimer = null; } itemDownId = null; itemTarget = null; }
    function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {} }

    function startSelectMode() {
      boardTimer = null;
      if (mode !== "pending") return;
      mode = "select";
      isSelecting = true;
      try { wrap.setPointerCapture(downId); } catch (err) {}
      selectStart = canvasPointFromEvent({ clientX: sx, clientY: sy });
      selectionBox.style.left = selectStart.x + "px";
      selectionBox.style.top = selectStart.y + "px";
      var s = 18 / scale;
      selectionBox.style.width = s + "px";
      selectionBox.style.height = s + "px";
      selectionBox.style.display = "block";
      buzz();
    }

    function startPinch() {
      var ids = Object.keys(pts), a = pts[ids[0]], b = pts[ids[1]];
      var rect = wrap.getBoundingClientRect();
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      pinch = {
        d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
        scale: scale,
        cx: (mx - rect.left - panX) / scale,
        cy: (my - rect.top - panY) / scale
      };
    }

    window.addEventListener("pointerdown", function (e) {
      if (e.pointerType !== "touch" || !wrap.contains(e.target) || boardScrollLocked) return;
      lastTouchAt = Date.now();
      if (e.target.closest && e.target.closest(NATIVE_SEL)) return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var n = count();

      if (n === 1) {
        if (isBg(e.target)) {
          if (activeConnectorId) { deselectConnector(); return; }
          mode = "pending"; downId = e.pointerId;
          sx = e.clientX; sy = e.clientY; spx = panX; spy = panY;
          clearBoardTimer();
          boardTimer = setTimeout(startSelectMode, BOARD_LONG_MS);
        } else {
          var it = e.target.closest && e.target.closest(ITEM_SEL);
          if (it) {
            clearItemTimer();
            itemDownId = e.pointerId; itemTarget = e.target; itemX = e.clientX; itemY = e.clientY;
            itemTimer = setTimeout(function () {
              var t = itemTarget; itemTimer = null;
              if (!t) return;
              buzz();
              suppressClickUntil = Date.now() + 700;
              lastTap = null;
              t.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: itemX, clientY: itemY, view: window }));
            }, ITEM_LONG_MS);
          }
        }
      } else if (n === 2 && (mode === "pending" || mode === "pan" || mode === "select" || mode === "pinch")) {
        // second finger: cancel whatever the first finger was doing and pinch instead
        e.stopPropagation();
        clearBoardTimer();
        if (isSelecting) { isSelecting = false; selectionBox.style.display = "none"; clearSelection(); }
        mode = "pinch";
        startPinch();
      } else if (n >= 2) {
        clearItemTimer();
      }
    }, true);

    window.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "touch" || !pts[e.pointerId]) return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };

      if (itemTimer && e.pointerId === itemDownId && Math.hypot(e.clientX - itemX, e.clientY - itemY) > SLOP) clearItemTimer();

      if (mode === "pending" && e.pointerId === downId) {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > SLOP) { clearBoardTimer(); mode = "pan"; }
      }
      if (mode === "pan" && e.pointerId === downId) {
        panX = spx + (e.clientX - sx);
        panY = spy + (e.clientY - sy);
        updateCanvasTransform();
      } else if (mode === "pinch" && pinch && count() >= 2) {
        var ids = Object.keys(pts), a = pts[ids[0]], b = pts[ids[1]];
        var d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var rect = wrap.getBoundingClientRect();
        var ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinch.scale * d / pinch.d));
        panX = (mx - rect.left) - pinch.cx * ns;
        panY = (my - rect.top) - pinch.cy * ns;
        scale = ns;
        updateCanvasTransform();
      }
    }, true);

    function onEnd(e) {
      if (e.pointerType !== "touch") return;
      var wasTracked = !!pts[e.pointerId];
      var hadItemTimer = !!itemTimer && e.pointerId === itemDownId;
      delete pts[e.pointerId];
      if (e.pointerId === itemDownId) clearItemTimer();
      if (!wasTracked) return;

      if (mode === "pending" && e.pointerId === downId) {
        // plain tap on empty board
        clearBoardTimer(); mode = null; downId = null;
        if (e.type === "pointerup") { clearSelection(); hideGroupSuggestChip(); }
      } else if ((mode === "pan" || mode === "select") && e.pointerId === downId) {
        clearBoardTimer(); mode = null; downId = null;   // the existing pointerup handler finishes a selection box
      } else if (mode === "pinch") {
        mode = null; downId = null; pinch = null; clearBoardTimer();
      }

      // double-tap -> dblclick
      if (e.type === "pointerup" && wrap.contains(e.target) && !(e.target.closest && e.target.closest(NATIVE_SEL))) {
        var now = Date.now();
        if (lastTap && now - lastTap.t < DTAP_MS && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < DTAP_DIST && (e.target === lastTap.el || lastTap.el.contains(e.target) || e.target.contains(lastTap.el))) {
          lastTap = null;
          e.target.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, cancelable: true, clientX: e.clientX, clientY: e.clientY, view: window }));
        } else {
          lastTap = { t: now, x: e.clientX, y: e.clientY, el: e.target };
        }
      }
    }
    window.addEventListener("pointerup", onEnd, true);
    window.addEventListener("pointercancel", onEnd, true);

    // After a long-press menu, swallow the click that follows the lift
    window.addEventListener("click", function (e) {
      if (Date.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
    }, true);

      if (e.isTrusted && Date.now() - lastTouchAt < 900) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, true);

    // Stop Safari zooming the whole page (which pushes the fixed menus off screen)
    // Desktop Safari sends trackpad pinch as gesture events (not ctrl+wheel): use them to zoom the board.
    var gzScale0 = 1;
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
      document.addEventListener(ev, function (e) {

  /* ---- filters, bar, render ---- */
