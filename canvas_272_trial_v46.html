        wrap.appendChild(svg);
        wrap.appendChild(label);
        perfDiagrams.appendChild(wrap);
      });
    }

    // Use the specific song block if passed, else collect all song blocks
    var units = [];
    if (songBlock && songBlock.verses && songBlock.verses.length) {
      songBlock.verses.forEach(function (v) { units.push({ kind: "verse", verse: v }); });
    } else {
      (card.blocks || []).forEach(function (block) {
        if (block.type === "song" && block.verses && block.verses.length) {
          block.verses.forEach(function (v) { units.push({ kind: "verse", verse: v }); });
        } else if (block.type === "text" && block.content && block.content.trim()) {
          units.push({ kind: "text", content: block.content });
        }
      });
    }

    // Split into three balanced columns by unit count
    var third = Math.ceil(units.length / 3);
    var cols = [units.slice(0, third), units.slice(third, third * 2), units.slice(third * 2)];

    perfColumns.innerHTML = "";
    // Build the (empty) column elements first and attach them to the grid
    // before filling them in, so their real rendered width is measurable —
    // a detached element has no layout to measure yet.
    var colEls = cols.map(function () {
      var col = document.createElement("div");
      col.className = "perf-col";
      perfColumns.appendChild(col);
      return col;
    });
    var charsPerLine = getPerfCharsPerLine(colEls[0]);
    cols.forEach(function (colUnits, i) {
      var col = colEls[i];
      colUnits.forEach(function (unit) {
        if (unit.kind === "verse") {
          col.appendChild(renderPerfVerse(unit.verse, charsPerLine));
        } else {
          var el = document.createElement("div");
          el.className = "perf-text-block";
          el.textContent = unit.content;
          col.appendChild(el);
        }
      });
    });

    perfOverlay.classList.add("open");

    // Request fullscreen
    if (perfOverlay.requestFullscreen) perfOverlay.requestFullscreen().catch(function(){});
    else if (perfOverlay.webkitRequestFullscreen) perfOverlay.webkitRequestFullscreen();
  }

  // How many monospace characters fit across a rehearsal-mode column,
  // measured against the CHORD line's font (15px, the wider of the two
  // fonts used here) — using the wider font as the constraint guarantees
  // a chord line can never overflow, even though the lyric font beneath
  // it is 1px smaller and would technically fit a character or two more.
  var _perfCharWidthCache = null;
  function getPerfCharsPerLine(colEl) {
    if (_perfCharWidthCache === null) {
      var probe = document.createElement("span");
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;" +
        "font-family:'Courier New',Courier,monospace;font-size:15px;font-weight:700;";
      probe.textContent = "0123456789";
      document.body.appendChild(probe);
      _perfCharWidthCache = probe.getBoundingClientRect().width / 10;
      document.body.removeChild(probe);
    }
    var innerWidth = 0;
    if (colEl) {
      var cs = getComputedStyle(colEl);
      innerWidth = colEl.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
    }
    // Fall back to a sane default if measurement comes back empty (e.g.
    // the overlay hasn't laid out yet for some reason) rather than
    // skipping wrapping altogether.
    if (!innerWidth || !_perfCharWidthCache) return 45;
    return Math.max(10, Math.floor(innerWidth / _perfCharWidthCache));
  }

  // Wraps a lyric string and its aligned chord string together, breaking
  // both at the SAME character position every time (preferring the last
  // space at or before the limit, so words don't get cut mid-way) — this
  // is what keeps a chord sitting directly above its correct syllable even
  // once a long line needs to wrap onto a second visual row.
  function wrapChordLyricPair(lyric, chordStr, charsPerLine) {
    // Wrapping decisions follow the LYRIC's length only — a chord sitting
    // at or past the end of the lyric text (a "hanging" chord marking a
    // change just as the line finishes) must never force an extra row of
    // its own; it rides along on the final segment, however far it
    // stretches the chord row, so chronological (left-to-right) order is
    // always preserved.
    var len = lyric.length;
    if (len === 0) return [{ lyric: lyric, chord: chordStr }];
    var lines = [];
    var pos = 0;
    while (pos < len) {
      var end = Math.min(pos + charsPerLine, len);
      if (end < len) {
        var breakAt = -1;
        for (var i = end; i > pos; i--) {
          if (lyric[i] === " ") { breakAt = i; break; }
        }
        if (breakAt > pos) end = breakAt;
      }
      var isLast = (end >= len);
      lines.push({
        lyric: lyric.slice(pos, end),
        chord: isLast ? chordStr.slice(pos) : chordStr.slice(pos, end)
      });
      pos = end;
      while (lyric[pos] === " ") pos++; // don't start the next visual line with a leading space
    }
    return lines;
  }

  function renderPerfVerse(verse, charsPerLine) {
    var verseEl = document.createElement("div");
    verseEl.className = "perf-verse";
    if (verse.label) {
      var label = document.createElement("div");
      label.className = "perf-section-label";
      label.textContent = verse.label;
      verseEl.appendChild(label);
    }
    (verse.pairs || []).forEach(function (pair) {
      var pairEl = document.createElement("div");
      pairEl.className = "perf-pair";

      var lyric = pair.lyric || "";
      var sorted = (pair.chords || []).slice().sort(function (a, b) { return a.offset - b.offset; });
      var chordStr = "";
      if (sorted.length) {
        var pos = 0;
        sorted.forEach(function (chord) {
          var spaces = chord.offset - pos;
          if (spaces > 0) chordStr += Array(spaces + 1).join(" ");
          chordStr += chord.text;
          pos = chord.offset + chord.text.length;
        });
      }

      var subLines = wrapChordLyricPair(lyric, chordStr, charsPerLine || 45);
      subLines.forEach(function (sub, i) {
        if (sub.chord.trim()) {
          var chordLine = document.createElement("div");
          chordLine.className = "perf-chord-line";
          chordLine.style.color = "#A14C5A";
          chordLine.textContent = sub.chord;
          pairEl.appendChild(chordLine);
        }
        var lyricLine = document.createElement("div");
        lyricLine.className = "perf-lyric-line";
        lyricLine.textContent = sub.lyric || "\u00a0";
        // Only the final wrapped segment of this original line gets the
        // normal spacing gap before the next line starts — the in-between
        // wrap continuations should sit tight against each other.
        if (i < subLines.length - 1) lyricLine.style.marginBottom = "0";
        pairEl.appendChild(lyricLine);
      });

      verseEl.appendChild(pairEl);
    });
    return verseEl;
  }

  modalResizeHandle.addEventListener("pointerdown", function (e) {
    e.stopPropagation();
    modalResizeHandle.setPointerCapture(e.pointerId);
    var startX = e.clientX, startY = e.clientY;
    var startRect = modal.getBoundingClientRect();
    var startW = startRect.width, startH = startRect.height;

    function move(ev) {
      var newW = Math.max(300, startW + (ev.clientX - startX));
      var newH = Math.max(320, startH + (ev.clientY - startY));
      modal.style.width = newW + "px";
      modal.style.height = newH + "px";
    }

    function up(ev) {
      modalResizeHandle.removeEventListener("pointermove", move);
      modalResizeHandle.removeEventListener("pointerup", up);
      modalResizeHandle.releasePointerCapture(ev.pointerId);
      var finalRect = modal.getBoundingClientRect();
      state.modalSize = { width: finalRect.width, height: finalRect.height };

  // ---- Card groups (visual stacks) ----
  var GROUP_HEADER_HEIGHT = 40;
  var GROUP_PADDING = 8;
  var GROUP_GAP = 8;
  var GROUP_HEADER_CHROME = 160;
  var GROUP_MIN_WIDTH = 280;
  var TABLE_ROW_HEIGHT = 32;
  var TABLE_NAME_COL_WIDTH = 130;
  var TABLE_COL_WIDTH = 110;
  var TABLE_ADD_COL_WIDTH = 28;

  function getColWidth(prop) {
    if (prop.type === "derived" && prop.source === "perfMode") return 140;
    if (prop.type === "derived" && prop.source === "capoFret") return 80;
    return TABLE_COL_WIDTH;
  }

  var groupTitleMeasureEl = document.createElement("span");
  groupTitleMeasureEl.style.position = "absolute";
  groupTitleMeasureEl.style.visibility = "hidden";
  groupTitleMeasureEl.style.left = "-9999px";
  groupTitleMeasureEl.style.top = "-9999px";
  groupTitleMeasureEl.style.whiteSpace = "pre";
  groupTitleMeasureEl.style.fontFamily = "var(--dl-bold)"; /* DL: stack/table titles use the bold display font */
  groupTitleMeasureEl.style.fontWeight = "800";
  groupTitleMeasureEl.style.fontSize = "15px";
  groupTitleMeasureEl.style.letterSpacing = "-0.01em";
  document.body.appendChild(groupTitleMeasureEl);

  function measureGroupTitleWidth(text, isCardTitle) {
    /* DL: card titles are Public Sans 700 16px; stack/table titles are the bold display font 800 15px */
    groupTitleMeasureEl.style.fontFamily = isCardTitle ? '"Public Sans", "Inter", sans-serif' : "var(--dl-bold)";
    groupTitleMeasureEl.style.fontWeight = isCardTitle ? "700" : "800";
    groupTitleMeasureEl.style.fontSize = isCardTitle ? "16px" : "15px";
    groupTitleMeasureEl.style.letterSpacing = isCardTitle ? "-0.01em" : "-0.01em";
    groupTitleMeasureEl.textContent = text || "";
    return groupTitleMeasureEl.scrollWidth;
  }

  function computeTableLayout(group) {
    var cards = group.cardIds.map(function (id) {
      return state.cards.filter(function (c) { return c.id === id; })[0];
    }).filter(Boolean);
    var colsWidth = group.properties.reduce(function (sum, p) { return sum + getColWidth(p); }, 0);
    var bodyWidth = TABLE_NAME_COL_WIDTH + colsWidth + TABLE_ADD_COL_WIDTH;

    var titleText = (group.title && group.title.length) ? group.title : "Untitled stack";
    var titleNeeds = measureGroupTitleWidth(titleText) + GROUP_HEADER_CHROME;
    bodyWidth = Math.max(bodyWidth, titleNeeds);

    // Never narrower than the notebook layout would be, so the header never overflows the frame
    var notebookLayout = computeGroupLayout(group);
    bodyWidth = Math.max(bodyWidth, notebookLayout.frameWidth);

    var bodyHeight = TABLE_ROW_HEIGHT * (cards.length + 1) + 26;
    return { cards: cards, bodyWidth: bodyWidth, bodyHeight: bodyHeight, frameWidth: bodyWidth, frameHeight: GROUP_HEADER_HEIGHT + bodyHeight };
  }

  function computeGroupLayout(group) {
    var cards = group.cardIds.map(function (id) {
      return state.cards.filter(function (c) { return c.id === id; })[0];
    }).filter(Boolean);
    var width = GROUP_MIN_WIDTH;
    if (group.manualWidth) {
      width = Math.max(GROUP_MIN_WIDTH - GROUP_PADDING * 2, group.manualWidth - GROUP_PADDING * 2);
    } else {
      cards.forEach(function (c) { width = Math.max(width, c.width || 170); });
    }

    var titleText = (group.title && group.title.length) ? group.title : "Untitled stack";
    var titleNeeds = measureGroupTitleWidth(titleText) + GROUP_HEADER_CHROME;
    width = Math.max(width, titleNeeds - GROUP_PADDING * 2);

    var frameWidth = width + GROUP_PADDING * 2;
    var y = group.y + GROUP_HEADER_HEIGHT + GROUP_PADDING;
    var rows = cards.map(function (c) {
      // Always stretch card to fill available width
      var row = { card: c, x: group.x + GROUP_PADDING, y: y, width: width };
      y += (c.height || 90) + GROUP_GAP;
      return row;
    });
    var frameHeight = (cards.length ? y - GROUP_GAP : y) + GROUP_PADDING - group.y;
    return { cards: cards, rows: rows, frameWidth: frameWidth, frameHeight: frameHeight };
  }

  function syncGroupDashedBorder(groupId) {
    var db = itemsLayer.querySelector('.card-group-dashed-border[data-id="' + groupId + '"]');
    var frame = itemsLayer.querySelector('.card-group-frame[data-id="' + groupId + '"]');
    var group = state.cardGroups.filter(function (g) { return g.id === groupId; })[0];
    if (!db || !frame || !group) return;
    var frameH = parseFloat(frame.style.height);
    var tableEl = itemsLayer.querySelector('.card-group-table[data-id="' + groupId + '"]');
    if (tableEl) frameH += tableEl.offsetHeight;
    var timelineEl = itemsLayer.querySelector('.card-group-timeline[data-id="' + groupId + '"]');
    if (timelineEl) frameH += timelineEl.offsetHeight;
    var calendarEl = itemsLayer.querySelector('.card-group-calendar[data-id="' + groupId + '"]');
    if (calendarEl) frameH += calendarEl.offsetHeight;
    db.style.transition = "none";
    db.style.left = (group.x - 4) + "px";
    db.style.top = (group.y - 4) + "px";
    db.style.width = (parseFloat(frame.style.width) + 8) + "px";
    db.style.height = (frameH + 8) + "px";
  }

  function renderCardGroup(group) {
    var isTable = group.viewMode === "table";
    var isTimeline = group.viewMode === "timeline";
    var isCalendar = group.viewMode === "calendar";
    var isSpecialView = isTable || isTimeline || isCalendar;
    var layout = isTable ? computeTableLayout(group) : computeGroupLayout(group);
    var frameWidth = group.manualWidth
      ? group.manualWidth
      : isTimeline ? TIMELINE_WIDTH : isCalendar ? 420 : layout.frameWidth;

    var frame = document.createElement("div");
    frame.className = "card-group-frame" + (isTable ? " table-mode" : "") + (selectedGroupIds.has(group.id) ? " selected" : "");
    frame.style.left = group.x + "px";
    frame.style.top = group.y + "px";
    frame.style.width = frameWidth + "px";
    frame.style.height = (group.collapsed ? GROUP_HEADER_HEIGHT : (isSpecialView ? GROUP_HEADER_HEIGHT : layout.frameHeight)) + "px";

    notebookBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    notebookBtn.addEventListener("click", function (e) {
      e.stopPropagation();

    var unstackBtn = document.createElement("button");
    unstackBtn.className = "unstack-btn";
    unstackBtn.title = "Unstack";
    unstackBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l5-5 5 5"/><path d="M7 16l5 5 5-5"/></svg>';
    unstackBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    unstackBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var hasTableData = isTable && (group.properties.length > 0 ||
        group.cardIds.some(function (cid) {
          var c = state.cards.filter(function (cc) { return cc.id === cid; })[0];
          return c && c.properties && Object.keys(c.properties).length > 0;
        }));
      if (!hasTableData) {
        unstackGroup(group);
        return;
      }
      // Show inline confirmation
      unstackBtn.style.display = "none";
      var confirm = document.createElement("div");
      confirm.className = "unstack-confirm";
      confirm.innerHTML = '<span>Lose table data?</span>';
      var yesBtn = document.createElement("button");
      yesBtn.className = "unstack-confirm-yes";
      yesBtn.textContent = "Unstack";
      var noBtn = document.createElement("button");
      noBtn.className = "unstack-confirm-no";
      noBtn.textContent = "✕";
      confirm.appendChild(yesBtn);
      confirm.appendChild(noBtn);
      header.appendChild(confirm);

      function cleanup() { confirm.remove(); unstackBtn.style.display = ""; }
      yesBtn.addEventListener("click", function (ev) { ev.stopPropagation(); cleanup(); unstackGroup(group); });
      noBtn.addEventListener("click", function (ev) { ev.stopPropagation(); cleanup(); });
      yesBtn.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
      noBtn.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
    });
    header.appendChild(unstackBtn);

    // Connect handle on stack frame
    addConnectionDots(frame, group.id);

    // X-axis resize handle
    var groupResizeHandle = document.createElement("div");
    groupResizeHandle.className = "group-resize-handle";
    groupResizeHandle.innerHTML = '<svg viewBox="0 0 8 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="2" y2="14"/><line x1="6" y1="2" x2="6" y2="14"/></svg>';
    frame.appendChild(groupResizeHandle);
    groupResizeHandle.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      groupResizeHandle.setPointerCapture(e.pointerId);
      var startX = e.clientX;
      var startWidth = layout.frameWidth;
      frame.style.transition = "none";
      function move(ev) {
        var dx = (ev.clientX - startX) / scale;
        var newWidth = Math.max(GROUP_MIN_WIDTH, snapVal(startWidth + dx));
        group.manualWidth = newWidth;
        frame.style.width = newWidth + "px";
        // Update calendar width if in calendar view
        if (isCalendar) {
          var calEl = itemsLayer.querySelector('.card-group-calendar[data-id="' + group.id + '"]');
          if (calEl) calEl.style.width = newWidth + "px";
        }
        // Update timeline scroll wrap width if in timeline view
        if (isTimeline) {
          var tlEl = itemsLayer.querySelector('.card-group-timeline[data-id="' + group.id + '"]');
          if (tlEl) {
            tlEl.style.width = newWidth + "px";
            var sw = tlEl.querySelector(".timeline-scroll-wrap");
            if (sw) sw.style.width = newWidth + "px";
          }
        }
        syncDashedBorder();
        if (!isSpecialView) {
          var newLayout = computeGroupLayout(group);
          newLayout.rows.forEach(function (row) {
            var cardEl = itemsLayer.querySelector('.card[data-id="' + row.card.id + '"]');
            if (cardEl) {
              cardEl.style.transition = "none";
              cardEl.style.width = row.width + "px";
            }
          });
        }
      }
      function up(ev) {
        groupResizeHandle.removeEventListener("pointermove", move);
        groupResizeHandle.removeEventListener("pointerup", up);
        groupResizeHandle.releasePointerCapture(ev.pointerId);
        // Apply final width to cards in state and re-render
        var finalLayout = computeGroupLayout(group);
        finalLayout.rows.forEach(function (row) {
          row.card.width = row.width;
        });
        saveState();
        refreshCanvas();
      }
      groupResizeHandle.addEventListener("pointermove", move);
      groupResizeHandle.addEventListener("pointerup", up);
    });
    groupResizeHandle.addEventListener("click", function (e) { e.stopPropagation(); });

    frame.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openStackMenu(group, "group", e.clientX, e.clientY);
    });

    function syncDashedBorder() {
      syncGroupDashedBorder(group.id);
    }

    function startGroupDrag(e, captureEl) {
      e.stopPropagation();
      if (!selectedGroupIds.has(group.id)) {
        clearSelection();
        selectedGroupIds.add(group.id);
        frame.classList.add("selected");
      }
      captureEl.setPointerCapture(e.pointerId);
      frame.style.transition = "none";
      var startX = e.clientX, startY = e.clientY;
      var startGX = group.x, startGY = group.y;
      var moved = false;

      function move(ev) {
        var dx = (ev.clientX - startX) / scale;
        var dy = (ev.clientY - startY) / scale;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
          if (!moved) frame.classList.add("is-dragging");
          moved = true;
        }
        var newGX = startGX + dx;
        var newGY = startGY + dy;
        var incDx = newGX - group.x;
        var incDy = newGY - group.y;
        group.x = newGX;
        group.y = newGY;
        frame.style.left = group.x + "px";
        frame.style.top = group.y + "px";
        syncDashedBorder();
        if (isTable) {
          var tableEl = itemsLayer.querySelector('.card-group-table[data-id="' + group.id + '"]');
          if (tableEl) {
            tableEl.style.transition = "none";
            tableEl.style.left = group.x + "px";
            tableEl.style.top = (group.y + GROUP_HEADER_HEIGHT) + "px";
          }
        } else if (isTimeline) {
          var timelineEl = itemsLayer.querySelector('.card-group-timeline[data-id="' + group.id + '"]');
          if (timelineEl) {
            timelineEl.style.transition = "none";
            timelineEl.style.left = group.x + "px";
            timelineEl.style.top = (group.y + GROUP_HEADER_HEIGHT) + "px";
          }
        } else if (isCalendar) {
          var calendarEl = itemsLayer.querySelector('.card-group-calendar[data-id="' + group.id + '"]');
          if (calendarEl) {
            calendarEl.style.transition = "none";
            calendarEl.style.left = group.x + "px";
            calendarEl.style.top = (group.y + GROUP_HEADER_HEIGHT) + "px";
          }
        } else {
          var newLayout = computeGroupLayout(group);
          newLayout.rows.forEach(function (row) {
            var cardEl = itemsLayer.querySelector('.card[data-id="' + row.card.id + '"]');
            if (cardEl) { cardEl.style.transition = "none"; cardEl.style.left = row.x + "px"; cardEl.style.top = row.y + "px"; }
          });
        }
        moveOtherSelectedItems(incDx, incDy, "group", group.id);
        renderConnections();
      }

      function up(ev) {
        captureEl.removeEventListener("pointermove", move);
        captureEl.removeEventListener("pointerup", up);
        captureEl.releasePointerCapture(ev.pointerId);
        frame.classList.remove("is-dragging");
        if (moved) {
          frame.classList.add("just-landed");
          frame.addEventListener("animationend", function () { frame.classList.remove("just-landed"); }, { once: true });
        }
        saveState();
        clearAllTransitionOverrides();
      }

      captureEl.addEventListener("pointermove", move);
      captureEl.addEventListener("pointerup", up);
    }

    // Drag bar — always draggable
    dragBar.addEventListener("pointerdown", function (e) {
      startGroupDrag(e, dragBar);
    });

    frame.appendChild(header);

    // Dashed border sits as a sibling BELOW the glass frame so mix-blend-mode composites against the canvas
    var dashedBorder = document.createElement("div");
    dashedBorder.className = "card-group-dashed-border";
    dashedBorder.style.left = (group.x - 4) + "px";
    dashedBorder.style.top = (group.y - 4) + "px";
    dashedBorder.style.width = (layout.frameWidth + 8) + "px";
    dashedBorder.style.height = ((group.collapsed ? GROUP_HEADER_HEIGHT : layout.frameHeight) + 8) + "px";
    dashedBorder.dataset.id = group.id;
    itemsLayer.appendChild(dashedBorder);
    itemsLayer.appendChild(frame);

    header.addEventListener("pointerdown", function (e) {
      if (e.target === titleInput || (e.target.closest && (e.target.closest(".unstack-btn") || e.target.closest(".group-collapse-btn") || e.target.closest(".group-view-toggle") || e.target.closest(".connect-handle")))) return;
      startGroupDrag(e, header);
    });

    if (!group.collapsed) {
      if (isTable) {
        renderGroupTable(group, frame);
      } else if (group.viewMode === "timeline") {
        renderGroupTimeline(group, frame, frameWidth);
      } else if (group.viewMode === "calendar") {
        renderGroupCalendar(group, frame, frameWidth);
      } else {
        layout.rows.forEach(function (row) {
          renderCard(row.card, { x: row.x, y: row.y, width: row.width });
        });
      }
    }
  }

  function addCardToGroup(group) {
    var isEventView = group.viewMode === "timeline" || group.viewMode === "calendar";
    var card = {
      id: uid(),
      title: "",
      notes: "",
      category: isEventView ? "event" : "idea",
      x: group.x,
      y: group.y,
      properties: {},
      z: getMaxZ() + 1
    };
    if (isEventView && group.calendarMonth) {
      var d = new Date(group.calendarMonth.year, group.calendarMonth.month, 1);
      card.startDate = d.toISOString().slice(0, 10);
      card.endDate = card.startDate;
    }
    state.cards.push(card);
    group.cardIds.push(card.id);
    migrateCardToBlocks(card);
    saveState();
    var beforeAddRow = captureItemRects();
    refreshCanvas();
    playFlipAnimation(beforeAddRow);
  }

  function getDerivedCellValue(card, source) {
    var songBlock = (card.blocks || []).filter(function (b) { return b.type === "song"; })[0];
    if (!songBlock) return "";
    if (source === "songArtist") return songBlock.songArtist || "";
    if (source === "capoFret") {
      var f = songBlock.capoFret;
      return (f && f > 0) ? "Fret " + f : "";
    }
    if (source === "perfMode") return songBlock ? "play" : "";
    return "";
  }

  function renderTableCellContent(cell, card, prop) {
    cell.innerHTML = "";
    var value = card.properties[prop.id];

    if (prop.type === "derived") {
      if (prop.source === "perfMode") {
        cell.classList.add("perf-cell");
        var songBlock = (card.blocks || []).filter(function (b) { return b.type === "song"; })[0];
        if (songBlock) {
          var pill = document.createElement("button");
          pill.className = "table-perf-pill";
          pill.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Rehearsal';
          pill.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
          pill.addEventListener("click", function (e) {
            e.stopPropagation();
            activeCardId = card.id;
            openPerfMode(songBlock);
          });
          cell.appendChild(pill);
        }
        return;
      }
      cell.classList.add("derived-cell");
      var derivedVal = getDerivedCellValue(card, prop.source);
      cell.textContent = derivedVal || "—";
      return;
    }

    if (prop.type === "select") {
      var opt = value ? (prop.options || []).filter(function (o) { return o.id === value; })[0] : null;
      if (opt) {
        var pill = document.createElement("span");
        pill.className = "table-tag-pill";
        pill.style.background = opt.color.bg;
        pill.style.color = opt.color.ink;
        pill.textContent = opt.label;
        pill.addEventListener("click", function (e) {
          e.stopPropagation();
          openOptionPicker(prop, card, cell);
        });
        cell.appendChild(pill);
      } else {
        var empty = document.createElement("span");
        empty.className = "table-tag-empty";
        empty.textContent = "+";
        empty.addEventListener("click", function (e) {
          e.stopPropagation();
          openOptionPicker(prop, card, cell);
        });
        cell.appendChild(empty);
      }
      return;
    }

    var span = document.createElement("span");
    span.textContent = value || "";
    span.style.width = "100%";
    span.style.minHeight = "16px";
    span.style.cursor = "text";
    cell.appendChild(span);
    cell.addEventListener("click", function cellClick(e) {
      e.stopPropagation();
      cell.removeEventListener("click", cellClick);
      var input = document.createElement("input");
      input.className = "table-cell-input";
      input.type = prop.type === "number" ? "number" : "text";
      input.value = value || "";
      cell.innerHTML = "";
      cell.appendChild(input);
      input.focus();
      input.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
      input.addEventListener("blur", function () {
        card.properties[prop.id] = input.value;
        saveState();
        renderTableCellContent(cell, card, prop);
      });
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") input.blur();
      });
    });
  }

  function renderGroupTable(group, frame) {
    var tableLayout = computeTableLayout(group);
    var table = document.createElement("div");
    table.className = "card-group-table";
    table.style.left = group.x + "px";
    table.style.top = (group.y + GROUP_HEADER_HEIGHT) + "px";
    table.style.width = tableLayout.bodyWidth + "px";
    table.style.height = tableLayout.bodyHeight + "px";
    table.dataset.id = group.id;
    table.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    var headerRow = document.createElement("div");
    headerRow.className = "table-row table-header-row";

    var nameHeaderCell = document.createElement("div");
    nameHeaderCell.className = "table-header-cell";
    nameHeaderCell.style.width = TABLE_NAME_COL_WIDTH + "px";
    nameHeaderCell.textContent = "Name";
    headerRow.appendChild(nameHeaderCell);

    group.properties.forEach(function (prop) {
      var cell = document.createElement("div");
      cell.className = "table-header-cell";
      cell.style.width = getColWidth(prop) + "px";
      cell.style.position = "relative";
      var nameSpan = document.createElement("span");
      nameSpan.textContent = prop.name;
      nameSpan.style.flex = "1";
      nameSpan.style.minWidth = "0";
      nameSpan.style.overflow = "hidden";
      nameSpan.style.textOverflow = "ellipsis";
      nameSpan.style.whiteSpace = "nowrap";
      cell.style.display = "flex";
      cell.style.alignItems = "center";
      var delBtn = document.createElement("button");
      delBtn.className = "table-col-delete-btn";
      delBtn.title = "Delete column";
      delBtn.innerHTML = "×";
      delBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      delBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        group.properties = group.properties.filter(function (p) { return p.id !== prop.id; });
        saveState();
        var before = captureItemRects();
        refreshCanvas();
        playFlipAnimation(before);
      });
      cell.appendChild(nameSpan);
      cell.appendChild(delBtn);
      headerRow.appendChild(cell);
    });

    var addColBtn = document.createElement("button");
    addColBtn.className = "table-add-col-btn";
    addColBtn.title = "Add column";
    addColBtn.textContent = "+";
    addColBtn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      openPropertyCreatePopup(group);
    });
    addColBtn.addEventListener("click", function (e) {
      e.stopPropagation();
    });
    headerRow.appendChild(addColBtn);

    table.appendChild(headerRow);

    tableLayout.cards.forEach(function (card) {
      card.properties = card.properties || {};
      var row = document.createElement("div");
      row.className = "table-row";

      var nameCell = document.createElement("div");
      nameCell.className = "table-cell table-name-cell";
      nameCell.style.width = TABLE_NAME_COL_WIDTH + "px";
      nameCell.textContent = card.title || "Untitled";
      nameCell.addEventListener("click", function (e) {
        e.stopPropagation();
        openCardFromOrigin(card.id, nameCell);
      });
      row.appendChild(nameCell);

      group.properties.forEach(function (prop) {
        var cell = document.createElement("div");
        cell.className = "table-cell";
        cell.style.width = getColWidth(prop) + "px";
        renderTableCellContent(cell, card, prop);
        row.appendChild(cell);
      });

      table.appendChild(row);
    });

    var addRowBtn = document.createElement("button");
    addRowBtn.className = "table-add-row-btn";
    addRowBtn.textContent = "+ New";
    addRowBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      addCardToGroup(group);
    });
    table.appendChild(addRowBtn);

    itemsLayer.appendChild(table);

    // Correct height to actual content after paint, then re-sync dashed border
    requestAnimationFrame(function () {
      var realH = table.scrollHeight;
      if (realH && realH !== tableLayout.bodyHeight) {
        table.style.height = realH + "px";
        syncGroupDashedBorder(group.id);
      }
    });
  }

  // ---- Timeline view ----
  var TIMELINE_DAY_WIDTH = 28; // px per day
  var TIMELINE_CARD_HEIGHT = 52;
  var TIMELINE_CARD_ROW_GAP = 8;
  var TIMELINE_WIDTH = 900;

  function renderGroupTimeline(group, frame, frameWidth) {
    frameWidth = frameWidth || TIMELINE_WIDTH;
    var cards = group.cardIds.map(function (id) {
      return state.cards.filter(function (c) { return c.id === id; })[0];
    }).filter(function (c) { return c && c.startDate; });

    var timeline = document.createElement("div");
    timeline.className = "card-group-timeline";
    timeline.style.left = group.x + "px";
    timeline.style.top = (group.y + GROUP_HEADER_HEIGHT) + "px";
    timeline.style.width = frameWidth + "px";
    timeline.dataset.id = group.id;
    timeline.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    if (!cards.length) {
      var empty = document.createElement("div");
      empty.className = "timeline-empty";
      empty.textContent = "No dated events yet — open a card and set a date to see it here.";
      timeline.appendChild(empty);
      itemsLayer.appendChild(timeline);
      requestAnimationFrame(function () { syncGroupDashedBorder(group.id); });
      return;
    }

    // Date range: pad 2 weeks either side of earliest/latest
    var allStarts = cards.map(function (c) { return getCardStartDate(c); }).filter(Boolean);
    var allEnds = cards.map(function (c) { return getCardEndDate(c); }).filter(Boolean);
    if (!allStarts.length) return;
    var minDate = new Date(Math.min.apply(null, allStarts.map(function (d) { return d.getTime(); })));
    var maxDate = new Date(Math.max.apply(null, allEnds.map(function (d) { return d.getTime(); })));
    // Snap minDate to start of its month so month headers align with card positions
    minDate = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    maxDate.setDate(maxDate.getDate() + 14);
    // Snap maxDate to end of its month for a clean right edge
    maxDate = new Date(maxDate.getFullYear(), maxDate.getMonth() + 1, 0);
    var totalDays = daysBetween(minDate, maxDate) + 1;

    // Minimum dayWidth so the full timeline never exceeds the visible frame width
    var minDayWidth = Math.max(1, frameWidth / totalDays);
    var dayWidth = Math.max(minDayWidth, group.timelineZoom || TIMELINE_DAY_WIDTH);

    function dateToX(d) {
      return daysBetween(minDate, d) * dayWidth;
    }

    var innerWidth = totalDays * dayWidth;

    var CARD_TOP_OFFSET = 42;
    var ROW_HEIGHT = TIMELINE_CARD_HEIGHT + TIMELINE_CARD_ROW_GAP;
    // AXIS_HEIGHT, ADD_BTN_HEIGHT, totalHeight declared after row packing — hoisted as var, set before use

    var scrollWrap = document.createElement("div");
    scrollWrap.className = "timeline-scroll-wrap";
    scrollWrap.style.width = frameWidth + "px";
    scrollWrap.addEventListener("wheel", function (e) {
      e.stopPropagation();
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        // Pinch gesture — slower zoom, anchored to cursor
        var zoomDelta = -e.deltaY * 0.18;
        var newDayWidth = Math.min(120, Math.max(minDayWidth, dayWidth + zoomDelta));
        if (Math.abs(newDayWidth - dayWidth) < 0.01) return;

        // Anchor: find which day is under the cursor, keep it there after zoom
        var swRect = scrollWrap.getBoundingClientRect();
        var cursorVisualX = e.clientX - swRect.left; // px from left edge of visible scroll area
        var cursorX = scrollWrap.scrollLeft + cursorVisualX;
        var cursorDay = cursorX / dayWidth;

        dayWidth = newDayWidth;
        group.timelineZoom = newDayWidth;

        var newInnerWidth = totalDays * dayWidth;
        inner.style.width = newInnerWidth + "px";
        axis.style.width = newInnerWidth + "px";

        // Reposition month headers
        var headers = axis.querySelectorAll(".timeline-month-header");
        var mc = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
        headers.forEach(function (h) {
          var nextM = new Date(mc.getFullYear(), mc.getMonth() + 1, 1);
          var mw = daysBetween(mc, nextM) * dayWidth;
          h.style.width = mw + "px";
          h.style.minWidth = mw + "px";
          var bar = h.querySelector(".timeline-month-colour-bar");
          if (bar) bar.style.width = (mw - 16) + "px";
          mc = nextM;
        });

        // Reposition today line
        var tl = inner.querySelector(".timeline-today-line");
        if (tl) tl.style.left = daysBetween(minDate, today) * dayWidth + "px";

        // Day row: show/hide and reposition
        var showDays = dayWidth >= DAY_SHOW_THRESHOLD;
        if (dayRow) {
          if (!showDays) {
            dayRow.style.display = "none";
          } else {
            dayRow.style.display = "";
            var newDayRowH = dayWidth >= DAY_SHOW_WEEKDAY ? 36 : 26;
            dayRow.style.height = newDayRowH + "px";
            var cells = dayRow.querySelectorAll(".timeline-day-cell");
            var cellDate = new Date(minDate);
            cells.forEach(function (cell) {
              cell.style.left = dateToX(cellDate) + "px";
              cell.style.width = dayWidth + "px";
              cell.style.height = newDayRowH + "px";
              var wdEl = cell.querySelector(".timeline-day-weekday");
              if (dayWidth >= DAY_SHOW_WEEKDAY) {
                if (wdEl) { wdEl.style.display = ""; wdEl.textContent = getWeekdayLabel(cellDate); }
              } else if (wdEl) {
                wdEl.style.display = "none";
              }
              cellDate = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate() + 1);
            });
          }
        } else if (showDays) {
          // Build day row from scratch
          var newDayRowH2 = dayWidth >= DAY_SHOW_WEEKDAY ? 36 : 26;
          dayRow = document.createElement("div");
          dayRow.className = "timeline-day-row";
          dayRow.style.width = newInnerWidth + "px";
          dayRow.style.height = newDayRowH2 + "px";
          dayRow.style.position = "relative";
          var dc = new Date(minDate);
          while (dc <= maxDate) {
            var dcX = dateToX(dc);
            var dcIsToday = dc.getTime() === today.getTime();
            var dcIsWeekend = dc.getDay() === 0 || dc.getDay() === 6;
            var dcCell = document.createElement("div");
            dcCell.className = "timeline-day-cell" + (dcIsToday ? " today" : "") + (dcIsWeekend ? " weekend" : "");
            dcCell.style.cssText = "position:absolute;left:" + dcX + "px;width:" + dayWidth + "px;height:" + newDayRowH2 + "px;box-sizing:border-box;";
            var dcWd = document.createElement("span");
            dcWd.className = "timeline-day-weekday";
            dcWd.textContent = getWeekdayLabel(dc);
            dcWd.style.display = dayWidth >= DAY_SHOW_WEEKDAY ? "" : "none";
            dcCell.appendChild(dcWd);
            var dcNum = document.createElement("span");
            dcNum.className = "timeline-day-num";
            dcNum.textContent = dc.getDate();
            dcCell.appendChild(dcNum);
            dayRow.appendChild(dcCell);
            dc = new Date(dc.getFullYear(), dc.getMonth(), dc.getDate() + 1);
          }
          // Insert after axis
          var axisEl = inner.querySelector(".timeline-axis");
          if (axisEl && axisEl.nextSibling) {
            inner.insertBefore(dayRow, axisEl.nextSibling);
          } else {
            inner.appendChild(dayRow);
          }
        }

        // Reposition card wrappers with live row recalculation
        cardsArea.style.width = newInnerWidth + "px";

        // Recalculate rows at new dayWidth
        var liveRowEnds = [];
        var livePositions = cardPositions.map(function (pos) {
          var newX = dateToX(pos.sd);
          var newDurW = daysBetween(pos.sd, pos.ed) * dayWidth + dayWidth;
          var newTitleW = measureGroupTitleWidth(pos.card.title || "Untitled", true) + 20;
          var newW = Math.min(300, Math.max(72, newDurW, newTitleW));
          var newRow = -1;
          for (var r = 0; r < liveRowEnds.length; r++) {
            if (liveRowEnds[r] <= newX - 10) { newRow = r; break; }
          }
          if (newRow === -1) { newRow = liveRowEnds.length; liveRowEnds.push(0); }
          liveRowEnds[newRow] = newX + newW;
          return { x: newX, w: newW, row: newRow };
        });

        // Update total height for new row count
        var newTotalRows = liveRowEnds.length;
        var newTotalH = Math.max(80, newTotalRows * ROW_HEIGHT + CARD_TOP_OFFSET + ADD_BTN_HEIGHT + 14);
        var newFullH = AXIS_HEIGHT + newTotalH;
        cardsArea.style.height = newTotalH + "px";
        inner.style.height = newFullH + "px";
        scrollWrap.style.height = newFullH + "px";
        timeline.style.height = newFullH + "px";

        cardsArea.querySelectorAll(".timeline-card-wrapper").forEach(function (wrapper, i) {
          if (!livePositions[i]) return;
          var lp = livePositions[i];
          var newStemH = 30 + lp.row * ROW_HEIGHT;
          var newDotTop = -(42 + lp.row * ROW_HEIGHT);
          wrapper.style.transition = "top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)";
          wrapper.style.left = lp.x + "px";
          wrapper.style.top = (CARD_TOP_OFFSET + lp.row * ROW_HEIGHT) + "px";
          wrapper.style.width = lp.w + "px";
          var cardEl = wrapper.querySelector(".timeline-event-card");
          if (cardEl) cardEl.style.width = lp.w + "px";
          var stemEl = wrapper.querySelector(".timeline-card-stem");
          var dotEl = wrapper.querySelector(".timeline-card-dot");
          var isRangeCard = cardPositions[i] && daysBetween(cardPositions[i].sd, cardPositions[i].ed) > 0;
          var newPillTop = newDotTop + 12;

          if (stemEl) {
            stemEl.style.transition = "height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)";
            if (isRangeCard) {
              stemEl.style.top = (newDotTop + 12) + "px";
              stemEl.style.height = newStemH + "px";
            } else {
              stemEl.style.top = (newDotTop + 12) + "px";
              stemEl.style.height = newStemH + "px";
            }
          }
          if (dotEl) {
            dotEl.style.transition = "top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)";
            if (isRangeCard) {
              var newPillW = daysBetween(cardPositions[i].sd, cardPositions[i].ed) * dayWidth + dayWidth;
              dotEl.style.top = newDotTop + "px";
              dotEl.style.width = newPillW + "px";
            } else {
              dotEl.style.top = newDotTop + "px";
            }
          }
        });

        // Restore scroll anchored to cursor position
        scrollWrap.scrollLeft = cursorDay * dayWidth - cursorVisualX;
        // Sync dashed border to new timeline height
        syncGroupDashedBorder(group.id);

        // Debounced save
        clearTimeout(scrollWrap._zoomSaveTimer);
        scrollWrap._zoomSaveTimer = setTimeout(function () { saveState(); }, 400);
      } else {
        scrollWrap.scrollLeft += e.deltaY + e.deltaX;
      }
    }, { passive: false });
    scrollWrap.style.height = "220px";

    var inner = document.createElement("div");
    inner.className = "timeline-inner";
    inner.style.width = innerWidth + "px";
    inner.style.height = "220px";

    // Month headers axis
    var axis = document.createElement("div");
    axis.className = "timeline-axis";
    axis.style.width = innerWidth + "px";

    var cur = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    while (cur <= maxDate) {
      var nextMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
      var mStartX = dateToX(cur);
      var mEndX = dateToX(nextMonth);
      var mWidth = mEndX - mStartX;
      var mIdx = cur.getMonth();

      var mHeader = document.createElement("div");
      mHeader.className = "timeline-month-header";
      mHeader.style.width = mWidth + "px";
      mHeader.style.minWidth = mWidth + "px";
      mHeader.style.flexShrink = "0";
      // January gets a tinted background as a year-boundary marker
      if (mIdx === 0) mHeader.style.background = "rgba(180,180,195,0.18)";

      var mLabel = document.createElement("span");
      mLabel.className = "timeline-month-label";
      mLabel.style.color = monthColour(mIdx);
      mLabel.textContent = MONTH_SHORT[mIdx].toUpperCase();

      var mYear = document.createElement("span");
      mYear.className = "timeline-month-year";
      mYear.textContent = cur.getFullYear();

      var mBar = document.createElement("div");
      mBar.className = "timeline-month-colour-bar";
      mBar.style.background = monthColour(mIdx);
      mBar.style.width = (mWidth - 16) + "px";

      mHeader.appendChild(mLabel);
      mHeader.appendChild(mYear);
      mHeader.appendChild(mBar);
      axis.appendChild(mHeader);

      cur = nextMonth;
    }
    inner.appendChild(axis);

    // Day sub-row — shows when zoomed in enough
    // Today — used in day row and today line
    var today = new Date();
    today.setHours(0,0,0,0);

    var DAY_ROW_HEIGHT = 0;
    var DAY_SHOW_THRESHOLD = 12;   // show day numbers
    var DAY_SHOW_WEEKDAY = 28;     // show 2-letter weekday (Mo, Tu...)
    var DAY_SHOW_3LETTER = 48;     // show 3-letter weekday (Mon, Tue...)
    var DAY_SHOW_FULL = 80;        // show full weekday (Monday, Tuesday...)
    var WEEKDAY_SHORT2 = ["Su","Mo","Tu","We","Th","Fr","Sa"];
    var WEEKDAY_SHORT3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var WEEKDAY_FULL   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    function getWeekdayLabel(d) {
      if (dayWidth >= DAY_SHOW_FULL) return WEEKDAY_FULL[d.getDay()];
      if (dayWidth >= DAY_SHOW_3LETTER) return WEEKDAY_SHORT3[d.getDay()];
      return WEEKDAY_SHORT2[d.getDay()];
    }

    var dayRow = null;
    if (dayWidth >= DAY_SHOW_THRESHOLD) {
      DAY_ROW_HEIGHT = dayWidth >= DAY_SHOW_WEEKDAY ? 36 : 26;
      dayRow = document.createElement("div");
      dayRow.className = "timeline-day-row";
      dayRow.style.width = innerWidth + "px";
      dayRow.style.height = DAY_ROW_HEIGHT + "px";
      dayRow.style.position = "relative";

      var d = new Date(minDate);
      while (d <= maxDate) {
        var dayX = dateToX(d);
        var isToday = d.getTime() === today.getTime();
        var isWeekend = d.getDay() === 0 || d.getDay() === 6;
        var dayCell = document.createElement("div");
        dayCell.className = "timeline-day-cell" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "");
        dayCell.style.position = "absolute";
        dayCell.style.left = dayX + "px";
        dayCell.style.width = dayWidth + "px";
        dayCell.style.height = DAY_ROW_HEIGHT + "px";
        dayCell.style.boxSizing = "border-box";

        var wdEl = document.createElement("span");
        wdEl.className = "timeline-day-weekday";
        wdEl.textContent = getWeekdayLabel(d);
        wdEl.style.display = dayWidth >= DAY_SHOW_WEEKDAY ? "" : "none";
        dayCell.appendChild(wdEl);

        var numEl = document.createElement("span");
        numEl.className = "timeline-day-num";
        numEl.textContent = d.getDate();
        dayCell.appendChild(numEl);

        dayRow.appendChild(dayCell);
        d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      }
      inner.appendChild(dayRow);
    }

    // Today line
    if (today >= minDate && today <= maxDate) {
      var todayLine = document.createElement("div");
      todayLine.className = "timeline-today-line";
      todayLine.style.left = dateToX(today) + "px";
      inner.appendChild(todayLine);
    }

    // Layout cards to avoid vertical overlap using row packing
    var cardsArea = document.createElement("div");
    cardsArea.className = "timeline-cards-area";
    cardsArea.style.width = innerWidth + "px";
    var sorted = cards.slice().sort(function (a, b) {
      return (a.startDate || "") < (b.startDate || "") ? -1 : 1;
    });

    // Row packing: assign each card to the first row where it fits
    var rowEnds = []; // tracks rightmost x+w per row
    var cardPositions = sorted.map(function (card) {
      var sd = getCardStartDate(card);
      var ed = getCardEndDate(card);
      var x = dateToX(sd);
      var durationW = daysBetween(sd, ed) * dayWidth + dayWidth;
      var titleW = measureGroupTitleWidth(card.title || "Untitled", true) + 20; // 10px padding each side
      var w = Math.max(72, durationW, titleW);
      var row = -1;
      for (var r = 0; r < rowEnds.length; r++) {
        if (rowEnds[r] <= x - 10) { row = r; break; }
      }
      if (row === -1) { row = rowEnds.length; rowEnds.push(0); }
      rowEnds[row] = x + w;
      return { card: card, x: x, w: w, row: row, sd: sd, ed: ed };
    });

    var AXIS_HEIGHT = 58 + DAY_ROW_HEIGHT;
    var ADD_BTN_HEIGHT = 34;
    var totalHeight = Math.max(80, CARD_TOP_OFFSET + rowEnds.length * ROW_HEIGHT + 36);
    var fullHeight = AXIS_HEIGHT + totalHeight + ADD_BTN_HEIGHT;

    cardsArea.style.height = totalHeight + "px";
    inner.style.width = innerWidth + "px";
    inner.style.height = fullHeight + "px";
    scrollWrap.style.height = fullHeight + "px";
    timeline.style.height = fullHeight + "px";

    cardPositions.forEach(function (pos) {
      var mIdx = pos.sd.getMonth();
      var colour = monthColour(mIdx);

      // Wrapper sits at the card position, dot always at fixed height above axis
      var stemHeight = 30 + pos.row * ROW_HEIGHT;
      var dotTop = -(42 + pos.row * ROW_HEIGHT);

      var wrapper = document.createElement("div");
      wrapper.style.cssText = "position:absolute;left:" + pos.x + "px;top:" + (CARD_TOP_OFFSET + pos.row * ROW_HEIGHT) + "px;overflow:visible;width:" + Math.min(pos.w, 300) + "px;";
      wrapper.className = "timeline-card-wrapper";
      wrapper.dataset.idx = String(cardPositions.indexOf(pos));
      wrapper.dataset.cardId = pos.card.id;

      // Time offset within the day (0-1): positions dot/stem within the day cell
      var timeOffset = 0;
      if (pos.card.startTime) {
        var tp = pos.card.startTime.split(":");
        timeOffset = (parseInt(tp[0], 10) * 60 + parseInt(tp[1] || 0, 10)) / (24 * 60);
      }
      var dotOffsetX = Math.round(timeOffset * dayWidth);

      // Vertical stem — height extends per row so dot always sits just below axis
      var stem = document.createElement("div");
      stem.className = "timeline-card-stem";
      stem.style.cssText = "position:absolute;left:" + (dotOffsetX + 9) + "px;top:" + (dotTop + 12) + "px;width:2px;height:" + stemHeight + "px;background:" + colour + ";opacity:0.75;border-radius:1px;pointer-events:none;mix-blend-mode:multiply;";

      var dot = document.createElement("div");
      dot.className = "timeline-card-dot";
      var isRange = pos.ed && daysBetween(pos.sd, pos.ed) > 0;
      if (isRange) {
        // Pill at same y as circles, stem from pill bottom-left to card
        var pillW = daysBetween(pos.sd, pos.ed) * dayWidth + dayWidth;
        dot.style.cssText = "position:absolute;left:" + (dotOffsetX + 2) + "px;top:" + dotTop + "px;width:" + pillW + "px;height:12px;border-radius:999px;background:" + colour + ";opacity:0.75;mix-blend-mode:multiply;pointer-events:none;";
        stem.style.left = (dotOffsetX + 7) + "px";
        stem.style.top = (dotTop + 12) + "px";
        stem.style.height = stemHeight + "px"; // from pill bottom to card top
      } else {
        dot.style.cssText = "position:absolute;left:" + (dotOffsetX + 4) + "px;top:" + dotTop + "px;width:12px;height:12px;border-radius:50%;background:" + colour + ";opacity:0.9;mix-blend-mode:multiply;pointer-events:none;";
      }

      var cardEl = document.createElement("div");
      cardEl.className = "timeline-event-card";
      cardEl.style.top = "0";
      cardEl.style.width = Math.min(pos.w, 300) + "px";

      var tab = document.createElement("div");
      tab.className = "timeline-event-card-tab";
      tab.style.background = colour;

      var body = document.createElement("div");
      body.className = "timeline-event-card-body";

      var titleEl = document.createElement("div");
      titleEl.className = "timeline-event-card-title";
      titleEl.textContent = pos.card.title || "Untitled";

      var dateEl = document.createElement("div");
      dateEl.className = "timeline-event-card-date";
      var dur = durationLabel(pos.sd, pos.ed);
      dateEl.textContent = formatDateMedium(pos.sd) + (dur ? " · " + dur : "");

      body.appendChild(titleEl);
      body.appendChild(dateEl);
      cardEl.appendChild(tab);
      cardEl.appendChild(body);

      cardEl.addEventListener("click", function (e) {
        e.stopPropagation();
        openCardFromOrigin(pos.card.id, cardEl);
      });

      wrapper.appendChild(stem);
      wrapper.appendChild(dot);
      wrapper.appendChild(cardEl);

      // White gap above this card — covers passing stems, but slots out the card's own stem
      var ownStemLeft = dotOffsetX + 9; // x of this card's stem centre
      var gapDiv = document.createElement('div');
      gapDiv.style.cssText = 'position:absolute;left:0;right:0;top:-5px;height:5px;z-index:5;pointer-events:none;background:linear-gradient(to right,var(--card-paper) ' + (ownStemLeft - 1) + 'px,transparent ' + (ownStemLeft - 1) + 'px,transparent ' + (ownStemLeft + 7) + 'px,var(--card-paper) ' + (ownStemLeft + 7) + 'px);';
      wrapper.appendChild(gapDiv);

      cardsArea.appendChild(wrapper);
    });

    inner.appendChild(cardsArea);

    var addBtn = document.createElement("button");
    addBtn.className = "timeline-add-btn";
    addBtn.textContent = "+ New event";
    addBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    addBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var card = { id: uid(), title: "", notes: "", category: "event", startDate: null, endDate: null, x: group.x, y: group.y, properties: {}, z: getMaxZ() + 1 };
      state.cards.push(card);
      group.cardIds.push(card.id);
      migrateCardToBlocks(card);
      saveState();
      openCardFromOrigin(card.id, addBtn);
    });
    inner.appendChild(addBtn);
    scrollWrap.appendChild(inner);
    timeline.appendChild(scrollWrap);
    itemsLayer.appendChild(timeline);

    requestAnimationFrame(function () {
      // Scroll so earliest event has ~80px left margin
      var earliestX = dateToX(allStarts.reduce(function (min, d) { return d < min ? d : min; }));
      scrollWrap.scrollLeft = Math.max(0, earliestX - 80);
      syncGroupDashedBorder(group.id);
    });
  }

  // ---- Calendar view ----
  function renderGroupCalendar(group, frame, frameWidth) {
    frameWidth = frameWidth || 420;
    var cm = group.calendarMonth || (function () { var n = new Date(); return { year: n.getFullYear(), month: n.getMonth() }; })();
    var year = cm.year, month = cm.month;

    var cards = group.cardIds.map(function (id) {
      return state.cards.filter(function (c) { return c.id === id; })[0];
    }).filter(function (c) { return c && c.startDate; });

    var cal = document.createElement("div");
    cal.className = "card-group-calendar";
    cal.style.left = group.x + "px";
    cal.style.top = (group.y + GROUP_HEADER_HEIGHT) + "px";
    cal.style.width = frameWidth + "px";
    cal.dataset.id = group.id;
    cal.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    // Month colour bar
    var colourBar = document.createElement("div");
    colourBar.className = "calendar-month-colour-bar";
    colourBar.style.background = monthColour(month);
    cal.appendChild(colourBar);

    // Nav bar
    var nav = document.createElement("div");
    nav.className = "calendar-nav";
    var prevBtn = document.createElement("button");
    prevBtn.className = "calendar-nav-btn";
    prevBtn.textContent = "‹";
    prevBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    prevBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var d = new Date(year, month - 1, 1);
      group.calendarMonth = { year: d.getFullYear(), month: d.getMonth() };
      saveState(); refreshCanvas();
    });
    var navTitle = document.createElement("span");
    navTitle.className = "calendar-nav-title";
    navTitle.style.color = monthInk(month) === "#FBF8F0" ? monthColour(month) : "var(--ink-neutral)";
    navTitle.textContent = MONTH_NAMES[month] + " " + year;
    var nextBtn = document.createElement("button");
    nextBtn.className = "calendar-nav-btn";
    nextBtn.textContent = "›";
    nextBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    nextBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var d = new Date(year, month + 1, 1);
      group.calendarMonth = { year: d.getFullYear(), month: d.getMonth() };
      saveState(); refreshCanvas();
    });
    nav.appendChild(prevBtn);
    nav.appendChild(navTitle);
    nav.appendChild(nextBtn);
    cal.appendChild(nav);

    // Weekday headers
    var weekdays = document.createElement("div");
    weekdays.className = "calendar-weekdays";
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function (d) {
      var wd = document.createElement("div");
      wd.className = "calendar-weekday";
      wd.textContent = d;
      weekdays.appendChild(wd);
    });
    cal.appendChild(weekdays);

    // Day grid
    var grid = document.createElement("div");
    grid.className = "calendar-days";

    var firstDay = new Date(year, month, 1);
    var startDow = (firstDay.getDay() + 6) % 7; // Mon=0
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;

    var today = new Date(); today.setHours(0,0,0,0);

    for (var i = 0; i < totalCells; i++) {
      var dayOffset = i - startDow;
      var cellDate = new Date(year, month, 1 + dayOffset);
      var isCurrentMonth = cellDate.getMonth() === month && cellDate.getFullYear() === year;
      var isToday = cellDate.getTime() === today.getTime();

      var cell = document.createElement("div");
      cell.className = "calendar-day" + (!isCurrentMonth ? " other-month" : "") + (isToday ? " today" : "");

      var dayNum = document.createElement("span");
      dayNum.className = "calendar-day-num";
      dayNum.textContent = cellDate.getDate();
      cell.appendChild(dayNum);

      // Cards whose date range includes this day
      var cellStr = cellDate.toISOString().slice(0, 10);
      cards.forEach(function (card) {
        var sd = card.startDate || "";
        var ed = card.endDate || sd;
        if (cellStr >= sd && cellStr <= ed) {
          var chip = document.createElement("span");
          chip.className = "calendar-event-chip";
          var mIdx = (parseDate(sd) || cellDate).getMonth();
          chip.style.background = monthColour(mIdx);
          chip.style.color = monthInk(mIdx);
          chip.textContent = card.title || "Untitled";
          chip.addEventListener("click", function (e) {
            e.stopPropagation();
            openCardFromOrigin(card.id, chip);
          });
          cell.appendChild(chip);
        }
      });

      grid.appendChild(cell);
    }
    cal.appendChild(grid);

    var addBtn = document.createElement("button");
    addBtn.className = "calendar-add-btn";
    addBtn.textContent = "+ New event";
    addBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    addBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var defaultDate = new Date(year, month, 1).toISOString().slice(0, 10);
      var card = { id: uid(), title: "", notes: "", category: "event", startDate: defaultDate, endDate: defaultDate, x: group.x, y: group.y, properties: {}, z: getMaxZ() + 1 };
      state.cards.push(card);
      group.cardIds.push(card.id);
      migrateCardToBlocks(card);
      saveState();
      openCardFromOrigin(card.id, addBtn);
    });
    cal.appendChild(addBtn);

    itemsLayer.appendChild(cal);
    requestAnimationFrame(function () { syncGroupDashedBorder(group.id); });
  }

  // ---- Property creation popup ----
  var propertyCreatePopup = document.getElementById("property-create-popup");
  var propertyCreateContext = null;
  var propertyCreateType = "text";
  var optionPickerPopup = document.getElementById("option-picker-popup");
  var optionPickerContext = null;
  var popupScrim = document.getElementById("popup-scrim");
  var chordEditorPopup = document.getElementById("chord-editor-popup");
  var chordEditorName = document.getElementById("chord-editor-name");
  var chordEditorGrid = document.getElementById("chord-editor-grid");
  var chordEditorAboveNut = document.getElementById("chord-editor-above-nut");
  var chordEditorBarreCol = document.getElementById("chord-editor-barre-col");
  var chordEditorDeleteBtn = document.getElementById("chord-editor-delete");
  var chordEditorVoicingsWrap = document.getElementById("chord-editor-voicings");
  var chordEditorVoicingsList = document.getElementById("chord-editor-voicings-list");
  var chordEditorSaveNewBtn = document.getElementById("chord-editor-save-new");

  function showPopupScrim() {
    popupScrim.classList.remove("hidden");
  }

  function hidePopupScrimIfBothClosed() {
    if (propertyCreatePopup.classList.contains("hidden") && optionPickerPopup.classList.contains("hidden") && shapeTypePopup.classList.contains("hidden") && chordEditorPopup.classList.contains("hidden")) {
      popupScrim.classList.add("hidden");
    }
  }

  // ---- Chord editor ----
  var ceBaseFret = 1;
  var ceNumFrets = 4;
  var ceBarre = null;
  var ceFrets = [-1,-1,-1,-1,-1,-1];
  var ceEditingName = null;
  var ceActiveVoicingId = null; // id of the voicing currently loaded into the grid, or null if unsaved/new

  function loadVoicingIntoEditor(v) {
    ceFrets = v.frets.slice().reverse();
    ceBaseFret = v.baseFret || 1;
    ceNumFrets = v.numFrets || 4;
    ceBarre = v.barre || null;
    ceActiveVoicingId = v.id || null;
    renderChordEditorGrid();
    updateChordEditorControls();
    renderVoicingsStrip();
  }

  function renderVoicingsStrip() {
    var name = chordEditorName.value.trim();
    var entry = state.customChords && state.customChords[name];
    var voicings = (entry && entry.voicings) || [];
    if (voicings.length < 2) {
      chordEditorVoicingsWrap.classList.add("hidden");
      chordEditorSaveNewBtn.classList.toggle("hidden", voicings.length === 0);
      return;
    }
    chordEditorVoicingsWrap.classList.remove("hidden");
    chordEditorSaveNewBtn.classList.remove("hidden");
    chordEditorVoicingsList.innerHTML = "";
    voicings.forEach(function (v) {
      var chip = document.createElement("div");
      chip.className = "chord-editor-voicing-chip" + (v.id === ceActiveVoicingId ? " active" : "");
      var svg = buildChordDiagramSVG(v, 0.45);
      if (svg) chip.appendChild(svg);
      var label = document.createElement("span");
      label.className = "chord-editor-voicing-chip-label";
      label.textContent = v.id === entry.default ? "Default" : "Fret " + (v.baseFret || 1);
      chip.appendChild(label);
      var removeBtn = document.createElement("button");
      removeBtn.className = "chord-editor-voicing-remove";
      removeBtn.textContent = "×";
      removeBtn.title = "Delete this voicing";
      removeBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      removeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        entry.voicings = entry.voicings.filter(function (x) { return x.id !== v.id; });
        if (entry.default === v.id) {
          entry.default = entry.voicings.length ? entry.voicings[entry.voicings.length - 1].id : null;
        }
        if (!entry.voicings.length) {
          delete state.customChords[name];
        }
        saveState();
        if (entry.voicings && entry.voicings.length) {
          loadVoicingIntoEditor(entry.voicings.filter(function (x) { return x.id === entry.default; })[0] || entry.voicings[0]);
        } else {
          ceActiveVoicingId = null;
          renderVoicingsStrip();
        }
      });
      chip.appendChild(removeBtn);
      chip.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      chip.addEventListener("click", function () {
        entry.default = v.id;
        saveState();
        loadVoicingIntoEditor(v);
      });
      chordEditorVoicingsList.appendChild(chip);
    });
  }

  function openChordEditor(name, isNew) {
    ceEditingName = isNew ? null : name;
    chordEditorName.value = name;
    var entry = (!isNew && state.customChords && state.customChords[name]) || null;
    var builtin = (!isNew && !entry) ? CHORD_LIBRARY[name] : null;

    if (entry && entry.voicings && entry.voicings.length) {
      var def = entry.voicings.filter(function (v) { return v.id === entry.default; })[0] || entry.voicings[0];
      loadVoicingIntoEditor(def);
    } else if (builtin) {
      ceFrets = builtin.frets.slice().reverse();
      ceBaseFret = builtin.baseFret || 1;
      ceNumFrets = builtin.numFrets || 4;
      ceBarre = builtin.barre || null;
      ceActiveVoicingId = null;
      renderChordEditorGrid();
      updateChordEditorControls();
      renderVoicingsStrip();
    } else {
      ceFrets = [0,0,0,0,0,0];
      ceBaseFret = 1;
      ceNumFrets = 4;
      ceBarre = null;
      ceActiveVoicingId = null;
      renderChordEditorGrid();
      updateChordEditorControls();
      renderVoicingsStrip();
    }

    var isCustom = !!entry;
    chordEditorDeleteBtn.classList.toggle("hidden", !isCustom);

  function updateChordEditorControls() {
    document.querySelectorAll(".chord-editor-fret-btn").forEach(function (b) {
      b.classList.toggle("selected", parseInt(b.dataset.val) === ceBaseFret);
    });
    document.querySelectorAll(".chord-editor-numfrets-btn").forEach(function (b) {
      b.classList.toggle("selected", parseInt(b.dataset.val) === ceNumFrets);
    });
    chordEditorGrid.classList.toggle("no-nut", ceBaseFret > 1);
  }

  function renderChordEditorGrid() {
    chordEditorGrid.innerHTML = "";
    chordEditorAboveNut.innerHTML = "";
    chordEditorBarreCol.innerHTML = "";

    for (var s = 0; s < 6; s++) {
      (function (si) {
        var btn = document.createElement("button");
        btn.className = "chord-editor-nut-btn";
        var f = ceFrets[si];
        if (f === 0) { btn.textContent = "○"; btn.classList.add("is-open"); }
        else if (f === -1) { btn.textContent = "×"; btn.classList.add("is-muted"); }
        else { btn.textContent = ""; }
        btn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        btn.addEventListener("click", function () {
          if (ceFrets[si] === 0) { ceFrets[si] = -1; }
          else if (ceFrets[si] === -1) { ceFrets[si] = ceBaseFret; }
          else { ceFrets[si] = 0; }
          renderChordEditorGrid();
        });
        chordEditorAboveNut.appendChild(btn);
      })(s);
    }

    for (var f = 0; f < ceNumFrets; f++) {
      (function (fi) {
        var fretNum = ceBaseFret + fi;
        var btn = document.createElement("button");
        btn.className = "chord-editor-barre-btn" + (ceBarre === fretNum ? " active" : "");
        btn.title = "Barre fret " + fretNum;
        btn.textContent = "B";
        btn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        btn.addEventListener("click", function () {
          if (ceBarre === fretNum) {
            ceBarre = null;
          } else {
            ceBarre = fretNum;
            for (var i = 0; i < 6; i++) {
              if (ceFrets[i] !== -1) ceFrets[i] = fretNum;
            }
          }
          renderChordEditorGrid();
        });
        chordEditorBarreCol.appendChild(btn);
      })(f);
    }

    for (var row = 0; row < ceNumFrets; row++) {
      for (var col = 0; col < 6; col++) {
        (function (fi, si) {
          var fretNum = ceBaseFret + fi;
          var cell = document.createElement("button");
          cell.className = "chord-editor-cell";
          var hasDot = ceFrets[si] === fretNum && ceFrets[si] > 0;
          var isBarreCell = ceBarre === fretNum;
          if (hasDot && !isBarreCell) cell.classList.add("has-dot");
          if (isBarreCell && ceFrets[si] === fretNum && ceFrets[si] > 0) cell.classList.add("is-barre");
          cell.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
          cell.addEventListener("click", function () {
            if (ceFrets[si] === fretNum) {
              ceFrets[si] = 0;
            } else {
              ceFrets[si] = fretNum;
            }
            renderChordEditorGrid();
          });
          chordEditorGrid.appendChild(cell);
        })(row, col);
      }
    }
  }

  function applyChordRename(oldName, name) {
    if (!activeCardId) return;
    var renameCard = state.cards.filter(function (c) { return c.id === activeCardId; })[0];
    if (!renameCard) return;
    (renameCard.blocks || []).forEach(function (block) {
      if (block.type !== "song") return;
      (block.verses || []).forEach(function (verse) {
        (verse.pairs || []).forEach(function (pair) {
          (pair.chords || []).forEach(function (c) {
            if (c.text === oldName) c.text = name;
          });
        });
      });
    });
  }

  function reRenderActiveSongBlocks() {
    try {
      if (!activeCardId) return;
      var card = state.cards.filter(function (c) { return c.id === activeCardId; })[0];
      if (!card) return;
      var container = document.getElementById("blocks-container");
      if (!container) return;
      (card.blocks || []).forEach(function (block) {
        if (block.type === "song") {
          var blockEl = container.querySelector('[data-block-id="' + block.id + '"]');
          if (blockEl) renderSongBlock(block, blockEl);
        }
      });
    } catch (e) { console.warn("Chord editor re-render failed", e); }
  }

  function currentVoicingData() {
    return {
      frets: ceFrets.slice().reverse(),
      baseFret: ceBaseFret,
      numFrets: ceNumFrets,
      barre: ceBarre
    };
  }

  document.getElementById("chord-editor-save").addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  document.getElementById("chord-editor-save").addEventListener("click", function () {
    var name = chordEditorName.value.trim();
    if (!name) { chordEditorName.focus(); return; }
    var oldName = ceEditingName;
    var isRename = oldName && oldName !== name;

    if (!state.customChords) state.customChords = {};
    var entry = state.customChords[name];

    if (entry && ceActiveVoicingId && entry.voicings.some(function (v) { return v.id === ceActiveVoicingId; })) {
      // Update the voicing currently loaded in place
      entry.voicings = entry.voicings.map(function (v) {
        return v.id === ceActiveVoicingId ? Object.assign({ id: v.id }, currentVoicingData()) : v;
      });
      entry.default = ceActiveVoicingId;
    } else {
      // No existing entry under this name, or editing a builtin/new chord — create the first voicing
      var vid = uid();
      var voicing = Object.assign({ id: vid }, currentVoicingData());
      state.customChords[name] = { default: vid, voicings: [voicing] };
      ceActiveVoicingId = vid;
    }

    if (isRename && state.customChords[oldName] && oldName !== name) {
      delete state.customChords[oldName];
    }
    if (isRename) applyChordRename(oldName, name);

    saveState();
    closeChordEditor();
    reRenderActiveSongBlocks();
  });

  chordEditorSaveNewBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  chordEditorSaveNewBtn.addEventListener("click", function () {
    var name = chordEditorName.value.trim();
    if (!name) { chordEditorName.focus(); return; }
    var oldName = ceEditingName;
    var isRename = oldName && oldName !== name;

    if (!state.customChords) state.customChords = {};
    if (!state.customChords[name]) state.customChords[name] = { default: null, voicings: [] };
    var entry = state.customChords[name];

    if (isRename && state.customChords[oldName] && oldName !== name) {

    closeChordEditor();
    reRenderActiveSongBlocks();

  // ---- YouTube helpers ----
  function parseYouTubeId(url) {
    url = url.trim();
    var patterns = [
      /(?:youtube\.com\/watch\?.*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
      /^([A-Za-z0-9_-]{11})$/  // bare ID
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = url.match(patterns[i]);
      if (m) return m[1];
    }
    return null;
  }

  function youtubeEmbedUrl(videoId) {
    return "https://www.youtube.com/embed/" + videoId + "?rel=0&modestbranding=1&enablejsapi=1";
  }

  function fetchYouTubeTitle(videoId, cb) {
    var url = "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=" + videoId + "&format=json";
    fetch(url).then(function (r) { return r.json(); }).then(function (d) { cb(d.title || ""); }).catch(function () { cb(""); });
  }

    openBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    });

    // Delete

    delBtn.className = "video-item-btn danger";

    delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

    thumb.className = "video-item-thumb";
    thumb.src = "https://img.youtube.com/vi/" + video.videoId + "/hqdefault.jpg";
    thumb.alt = video.title || "YouTube video";
    embedDiv.appendChild(thumb);

    playOverlay.className = "video-item-play-overlay";
    var playBtn = document.createElement("div");
    playBtn.className = "video-item-play-btn";
    playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>';
    playOverlay.appendChild(playBtn);
    embedDiv.appendChild(playOverlay);

    embedDiv.addEventListener("click", function (e) {
      e.stopPropagation();
      window.open("https://www.youtube.com/watch?v=" + video.videoId, "_blank", "noopener");
    });
    el.appendChild(embedDiv);

    // Resize handle
    var resizeHandle = document.createElement("div");
    resizeHandle.className = "resize-handle";
    resizeHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    el.appendChild(resizeHandle);

    // Connect dots
    addConnectionDots(el, video.id);

    itemsLayer.appendChild(el);

    el.addEventListener("pointerdown", function () {
      if (!selectedVideoIds.has(video.id)) {
        clearSelection();
        selectedVideoIds.add(video.id);
        el.classList.add("selected");
      }
    });

    makeDraggable(el, function (x, y) {
      var dx = x - video.x; var dy = y - video.y;
      video.x = x; video.y = y;
      moveOtherSelectedItems(dx, dy, "video", video.id);
      renderConnections();
    });

    // Resize
    resizeHandle.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      resizeHandle.setPointerCapture(e.pointerId);
      el.style.transition = "none";
      var startW = video.width, startH = video.height, startX = e.clientX, startY = e.clientY;
      var ratio = startW / startH;
      function move(ev) {
        var dx = (ev.clientX - startX) / scale;
        var newW = Math.max(240, snapVal(startW + dx));
        video.width = newW; video.height = newW / ratio;
        el.style.width = newW + "px"; el.style.height = (newW / ratio) + "px";
      }
      function up(ev) {
        resizeHandle.removeEventListener("pointermove", move);
        resizeHandle.removeEventListener("pointerup", up);
        resizeHandle.releasePointerCapture(ev.pointerId);
        saveState(); clearAllTransitionOverrides();
      }
      resizeHandle.addEventListener("pointermove", move);
      resizeHandle.addEventListener("pointerup", up);
    });
    resizeHandle.addEventListener("click", function (e) { e.stopPropagation(); });

    return el;
  }

  function addVideoToBoard(videoId, title, cx, cy) {
    var w = 480, h = Math.round(w * 9 / 16) + 32; // 32 for toolbar
    var video = {

      x: cx - w / 2, y: cy - h / 2,
